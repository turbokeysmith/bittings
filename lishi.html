<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Lishi & Programming Reference — Turbo Keysmith</title>
<link rel="icon" href="app/tks_mark.png">
<style>
  :root{
    --bg:#14171b; --bg2:#1b1f25; --card:#1f232a; --edge:#2c313a; --ink:#f4f5f7; --dim:#9aa1ac;
    --amber:#ffb000; --red:#b82334; --green:#22994a; --off:#5a616c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;padding-bottom:40px;}
  a{color:var(--amber);text-decoration:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;gap:12px;margin:4px 0 14px;}
  .top h1{font-size:19px;margin:0;font-weight:800;}
  .back{background:var(--card);border:1px solid var(--edge);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;}
  .seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .seg button{flex:1 1 auto;min-width:96px;background:var(--card);border:1px solid var(--edge);color:var(--dim);
    border-radius:11px;padding:11px 10px;font-weight:800;font-size:14px;cursor:pointer;}
  .seg button.on{background:var(--amber);color:#1a1300;border-color:var(--amber);}
  .panel{display:none;}
  .panel.on{display:block;}
  input,select,textarea,button{font-family:inherit;}
  .in{width:100%;background:var(--card);border:1px solid var(--edge);border-radius:11px;padding:12px 13px;color:var(--ink);font-size:16px;outline:none;}
  textarea.in{min-height:80px;resize:vertical;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .row > *{flex:1 1 140px;}
  .btn{background:var(--card);border:1px solid var(--edge);color:var(--ink);border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;}
  .btn.amber{background:var(--amber);color:#1a1300;border-color:var(--amber);}
  .btn.red{background:var(--red);color:#fff;border-color:var(--red);}
  .btn.sm{padding:7px 10px;font-size:12.5px;border-radius:9px;}
  .muted{color:var(--dim);font-size:13px;}
  .hint{color:var(--dim);font-size:12.5px;margin:6px 2px;}
  /* reference card */
  .card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px;margin-top:14px;}
  .card.flag{border-color:var(--red);}
  .card h2{margin:0 0 2px;font-size:20px;color:var(--amber);}
  .card .veh{color:var(--dim);font-size:13px;margin-bottom:12px;}
  .kv{display:grid;grid-template-columns:128px 1fr;gap:8px 12px;font-size:14.5px;}
  .kv .k{color:var(--dim);font-weight:700;}
  .kv .v{font-weight:700;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;}
  .pill.ok{background:rgba(34,153,74,.18);color:#5fd389;}
  .pill.no{background:rgba(184,35,52,.18);color:#ef8b96;}
  .pill.warn{background:rgba(255,176,0,.16);color:var(--amber);}
  .badge-oem{display:inline-block;margin-top:12px;background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:8px 12px;font-size:13.5px;}
  /* tables */
  .tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
  .tbl th,.tbl td{border-bottom:1px solid var(--edge);padding:8px 7px;text-align:left;vertical-align:top;}
  .tbl th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--bg2);}
  .tbl tr:hover td{background:rgba(255,255,255,.02);}
  .notein{width:100%;min-width:120px;background:#171b21;border:1px solid var(--edge);border-radius:8px;color:var(--ink);font-size:12.5px;padding:6px 8px;}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--edge);border-radius:12px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
  .toolbar .in{flex:1 1 200px;}
  .src{color:var(--off);font-size:10.5px;}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40;}
  .ov.on{display:flex;}
  .sheet{background:var(--bg2);border:1px solid var(--edge);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px;}
  .sheet h3{margin:0 0 10px;font-size:17px;}
  .fld{margin-bottom:9px;}
  .fld label{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:4px;}
  .corr{background:var(--card);border:1px solid var(--edge);border-radius:11px;padding:11px 12px;margin-bottom:9px;font-size:14px;}
  .corr .when{color:var(--off);font-size:11.5px;}
  @media(max-width:560px){ .kv{grid-template-columns:108px 1fr;} .ov{align-items:stretch;} .sheet{border-radius:0;max-height:100vh;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">‹ Apps</a>
    <h1>🔑 Lishi &amp; Programming Reference</h1>
  </div>

  <div class="seg" id="seg">
    <button data-p="lookup" class="on">🔎 Lookup</button>
    <button data-p="vehicles">🚗 Vehicles</button>
    <button data-p="tools">🛠 Tools</button>
    <button data-p="corr">📝 Corrections</button>
  </div>

  <!-- LOOKUP -->
  <div class="panel on" id="p-lookup">
    <div class="row" style="margin-bottom:8px">
      <input class="in" id="vinIn" placeholder="Paste 17-char VIN…" maxlength="17" style="flex:2 1 220px;text-transform:uppercase">
      <button class="btn amber" id="vinBtn" style="flex:0 0 auto">Decode VIN</button>
    </div>
    <div class="hint">…or search when you're holding a key, not a VIN:</div>
    <div class="row" style="margin-bottom:8px">
      <select class="in" id="mode" style="flex:0 0 auto;max-width:210px">
        <option value="veh">By year / make / model</option>
        <option value="key">By keyway / tool</option>
      </select>
    </div>
    <div class="row" id="vehPick">
      <select class="in" id="fYear"><option value="">Year (any)</option></select>
      <select class="in" id="fMake"><option value="">Make…</option></select>
      <select class="in" id="fModel"><option value="">Model (pick make first)</option></select>
    </div>
    <div class="row" id="keyPick" style="display:none">
      <input class="in" id="q" placeholder="e.g. HU100">
    </div>
    <div id="lookMsg" class="hint"></div>
    <div id="cards"></div>
  </div>

  <!-- VEHICLES -->
  <div class="panel" id="p-vehicles">
    <div class="toolbar">
      <input class="in" id="vSearch" placeholder="Filter vehicles…">
      <button class="btn amber sm" id="vAdd">+ Add vehicle</button>
      <button class="btn sm" id="vExport">⇩ CSV</button>
      <button class="btn sm" id="vImport">⇧ Import</button>
      <input type="file" id="vFile" accept=".csv" hidden>
    </div>
    <div class="muted" id="vCount"></div>
    <div class="tblwrap"><table class="tbl" id="vTbl"></table></div>
  </div>

  <!-- TOOLS -->
  <div class="panel" id="p-tools">
    <div class="toolbar">
      <input class="in" id="tSearch" placeholder="Filter tools…">
      <button class="btn amber sm" id="tAdd">+ Add tool</button>
      <button class="btn sm" id="tExport">⇩ CSV</button>
      <button class="btn sm" id="tImport">⇧ Import</button>
      <input type="file" id="tFile" accept=".csv" hidden>
    </div>
    <div class="muted" id="tCount"></div>
    <div class="tblwrap"><table class="tbl" id="tTbl"></table></div>
  </div>

  <!-- CORRECTIONS -->
  <div class="panel" id="p-corr">
    <div class="hint">Jot fixes or additions here as you find them in the field. Export the log, hand it to Code, and it gets applied to the tables.</div>
    <textarea class="in" id="corrText" placeholder='e.g. "HU100 Buick ignition wrong, should be HU100R"  ·  "Add 2024 Toyota Tacoma — TOY48"'></textarea>
    <div class="toolbar">
      <button class="btn amber" id="corrAdd">Add to log</button>
      <button class="btn sm" id="corrMd">⇩ Export .md</button>
      <button class="btn sm" id="corrCsv">⇩ Export .csv</button>
      <button class="btn red sm" id="corrClear">Clear log (after export)</button>
    </div>
    <div id="corrList"></div>
  </div>
</div>

<!-- editor modal -->
<div class="ov" id="ov"><div class="sheet">
  <h3 id="ovTitle">Edit</h3>
  <div id="ovFields"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn amber" id="ovSave">Save</button>
    <button class="btn" id="ovCancel">Cancel</button>
  </div>
</div></div>

    cur.forEach(r=>{ const k=String(r.tool_designation).toUpperCase(); if((r.notes||'').trim()) noteBy[k]=r.notes; });
    const fresh=ALL_TOOLS.map(x=>{ const o=Object.assign({id:uid('lt')},x); const n=noteBy[String(x.tool_designation).toUpperCase()]; if(n) o.notes=n; return o; });
    const haveT=new Set(fresh.map(r=>String(r.tool_designation).toUpperCase()));
    cur.forEach(r=>{ const k=String(r.tool_designation).toUpperCase(); if(!haveT.has(k) && (r.notes||'').trim()){ fresh.push(r); haveT.add(k); } });
    writeLS(K_TOOLS,fresh);
  } else if(sv<SEEDVER){
    const T=readLS(K_TOOLS,[])||[]; const have=new Set(T.map(r=>String(r.tool_designation).toUpperCase()));
    ALL_TOOLS.forEach(s=>{ const k=String(s.tool_designation).toUpperCase(); if(!have.has(k)){ T.push(Object.assign({id:uid('lt')},s)); have.add(k); } });
    writeLS(K_TOOLS,T);
  }
  // vehicles: always add any missing rows (never clobbers edits)
  const V=readLS(K_VEH,[])||[]; const vh=new Set(V.map(r=>(r.make+'|'+r.model+'|'+r.year_start+'|'+r.keyway).toUpperCase()));
  ALL_VEH.forEach(s=>{ const k=(s.make+'|'+s.model+'|'+s.year_start+'|'+s.keyway).toUpperCase(); if(!vh.has(k)){ V.push(Object.assign({id:uid('vk')},s)); vh.add(k); } });
  writeLS(K_VEH,V);
  // v6: re-source previously-installed rows now that they're cross-referenced vs the supplier lists
  if(sv<6){ const Vr=readLS(K_VEH,[])||[]; let ch=0; Vr.forEach(r=>{ if(/^Compiled from public/.test(r.source||'')){ r.source='Cross-ref: LockPickWorld/CLK/UHS lists (2026-06-15)'; ch++; } }); if(ch) writeLS(K_VEH,Vr); }
  writeLS('tks_lishi_seedver',SEEDVER);
}

/* ---- helpers ---- */
const KW_ALIAS={DA34:'NSN14', KK10:'HY20', HU162T:'HU162', B102:'B111'};
function toolForKeyway(keyway){
  if(!keyway) return null;
  let kw=String(keyway).toUpperCase().trim(); kw=KW_ALIAS[kw]||kw;
  const list=tools();
  return list.find(t=>String(t.keyway).toUpperCase()===kw)
      || list.find(t=>kw.indexOf(String(t.keyway).toUpperCase())>=0 || String(t.keyway).toUpperCase().indexOf(kw)>=0)
      || null;
}
function inStock(keyway, blank){
  const inv=readLS('tks_inventory',[])||[];
  const needles=[keyway,blank].filter(Boolean).map(s=>String(s).toUpperCase());
  if(!needles.length) return null;
  const hit=inv.find(it=>{
    const hay=(((it.name||'')+' '+(it.sku||'')+' '+(it.fitment||'')+' '+(it.notes||''))).toUpperCase();
    const q=Number(it.qty!=null?it.qty:it.quantity);
    return needles.some(n=>n && hay.indexOf(n)>=0) && (isNaN(q)||q>0);
  });
  return !!hit;
}
function yearMatch(r,y){ y=Number(y); if(!y) return true; const a=Number(r.year_start)||0,b=Number(r.year_end)||9999; return y>=a && y<=b; }
function pill(val){
  const s=String(val||'').toLowerCase();
  if(s==='yes') return '<span class="pill ok">Yes</span>';
  if(s==='no')  return '<span class="pill no">No</span>';
  if(s.indexOf('caution')>=0) return '<span class="pill warn">Caution</span>';
  return '<span class="pill warn">'+esc(val||'—')+'</span>';
}

/* ============================== REFERENCE CARD ============================== */
function renderCards(rows, ctx){
  const box=document.getElementById('cards');
  if(!rows.length){ box.innerHTML='<div class="hint">No match. Try fewer words, or add it under 🚗 Vehicles.</div>'; return; }
  box.innerHTML=rows.slice(0,12).map(r=>{
    const tool=toolForKeyway(r.keyway);
    const stock=inStock(r.keyway, tool&&tool.key_blank);
    const oem=String(r.oem_only).toLowerCase()==='yes', nastf=String(r.nastf_required).toLowerCase()==='yes';
    const stockPill = stock===null?'<span class="pill warn">—</span>':(stock?'<span class="pill ok">In stock</span>':'<span class="pill no">Not in stock</span>');
    return `<div class="card${oem||nastf?' flag':''}">
      <h2>${esc(r.keyway||'—')}</h2>
      <div class="veh">${esc(r.make)} ${esc(r.model)} · ${esc(r.year_start)}–${esc(r.year_end)}</div>
      ${/^Matched by keyway/.test(r.source||'')?'<div style="margin:0 0 10px"><span class="pill warn">⚙ Matched by keyway — verify in field</span></div>':''}
      <div class="kv">
        <div class="k">Recommended Lishi</div><div class="v">${tool?esc(tool.tool_designation):'<span class="pill warn">not in tool list</span>'}${tool&&tool.wafer_positions?(' <span class="muted">('+esc(tool.wafer_positions)+' pos)</span>'):''}</div>
        <div class="k">In stock?</div><div class="v">${stockPill}${tool&&tool.key_blank?(' <span class="muted">'+esc(tool.key_blank)+'</span>'):''}</div>
        <div class="k">Coded / cut</div><div class="v">${pill(r.coded)}</div>

        ${r.notes?('<div class="k">Notes</div><div class="v" style="font-weight:500">'+esc(r.notes)+'</div>'):''}

  }).join('');
}

function uniqSort(a){ return [...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),undefined,{numeric:true})); }

function populateYears(){
  const ys=veh().map(r=>Number(r.year_start)).filter(Boolean), ye=veh().map(r=>Number(r.year_end)).filter(n=>n&&n<9000);
  let lo=Math.min.apply(null,ys.concat(1998)), hi=Math.max.apply(null,ye.concat(new Date().getFullYear?2026:2026));
  hi=Math.max(hi,2026); lo=Math.min(lo,1998);

function runVehSearch(){
  const msg=document.getElementById('lookMsg'), box=document.getElementById('cards');
  const mk=fMake.value, md=fModel.value, yr=fYear.value;
  if(!mk){ box.innerHTML=''; msg.textContent='Pick a make to see its models.'; return; }
  let rows=veh().filter(r=> r.make===mk && (!md || r.model===md) && yearMatch(r,yr));
  if(rows.length){ msg.textContent=rows.length+' match'+(rows.length===1?'':'es')+(yr?(' for '+yr):''); renderCards(rows,'veh'); return; }
  // No verified row — infer the keyway from make+era and TAG it "matched by keyway".
  const kw=inferKeyway(mk, yr);
  if(md && kw){
    const d=MK[mk]||{};
    const row={make:mk, model:md, year_start:(yr||''), year_end:(yr||''), keyway:kw,
      coded:'Yes', door_location:'Driver door', can_pick_ignition:'',
      transponder_system:d.t||'', programming_path:d.p||'', oem_only:'No', nastf_required:'No',
      notes:'', source:'Matched by keyway (inferred — verify in field)'};
    msg.textContent='No exact row on file — matched by keyway from '+esc(mk)+' era.';
    renderCards([row],'infer'); return;
  }
  const kws=[...new Set(veh().filter(r=>r.make===mk).map(r=>r.keyway))];
  msg.textContent='Pick a model'+(yr?(' for '+yr):'')+'.';
  box.innerHTML='<div class="hint">Pick a model to see its keyway &amp; tool.'+(kws.length?(' '+esc(mk)+' keyways on file: <b>'+kws.map(esc).join(', ')+'</b>.'):'')+'</div>';
}

  const q=document.getElementById('q').value.trim(), msg=document.getElementById('lookMsg');

}

  const arr = type==='veh'?veh():tools();

    : arr.some(r=>r.id!==editCtx.id && String(r.tool_designation).toLowerCase()===String(obj.tool_designation).toLowerCase());
  if(isDup && !confirm('A matching row already exists (make/model/year + keyway). Save anyway?')) return;
  if(type==='veh' && !obj.make){ alert('Make is required.'); return; }
  if(type==='tool' && !obj.tool_designation){ alert('Tool designation is required.'); return; }

};

/* ---- CSV import/export ---- */
function toCSV(rows,fields){
  const head=fields.join(',');
  const body=rows.map(r=>fields.map(f=>{ let s=String(r[f]==null?'':r[f]); return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; }).join(',')).join('\n');
  return head+'\n'+body;
}
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.length); if(!lines.length) return [];
  const split=l=>{ const out=[];let cur='',q=false; for(let i=0;i<l.length;i++){const c=l[i]; if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else { if(c===','){out.push(cur);cur='';} else if(c==='"'){q=true;} else cur+=c; } } out.push(cur); return out; };
  const head=split(lines[0]); return lines.slice(1).map(l=>{ const c=split(l); const o={}; head.forEach((h,i)=>o[h.trim()]=c[i]||''); return o; });
}
function dl(name,text,type){ const b=new Blob([text],{type:type||'text/plain'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
const VKEYS=VEH_FIELDS.map(f=>f[0]).concat('id'), TKEYS=TOOL_FIELDS.map(f=>f[0]).concat('id');
document.getElementById('vExport').onclick=()=>dl('tks_vehicle_keyways.csv',toCSV(veh(),VKEYS),'text/csv');
document.getElementById('tExport').onclick=()=>dl('tks_lishi_tools.csv',toCSV(tools(),TKEYS),'text/csv');
document.getElementById('vImport').onclick=()=>document.getElementById('vFile').click();
document.getElementById('tImport').onclick=()=>document.getElementById('tFile').click();
function importInto(file, key, idp, render){
  const rd=new FileReader(); rd.onload=()=>{ try{
    const incoming=parseCSV(rd.result); const cur=readLS(key,[]); let added=0,upd=0;
    incoming.forEach(o=>{ if(!o.id){ o.id=uid(idp); } const ex=cur.find(z=>z.id===o.id); if(ex){ Object.assign(ex,o); upd++; } else { cur.push(o); added++; } });
    writeLS(key,cur); render(); alert('Imported: '+added+' added, '+upd+' updated.');
  }catch(e){ alert('Could not read that CSV.'); } };
  rd.readAsText(file);
}
document.getElementById('vFile').onchange=e=>{ if(e.target.files[0]) importInto(e.target.files[0],K_VEH,'vk',renderVeh); e.target.value=''; };

document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  const p=b.dataset.p;
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on', x.id==='p-'+p));
  if(p==='vehicles') renderVeh(); if(p==='tools') renderTools(); if(p==='corr') renderCorr();
});
document.getElementById('vinIn').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('vinBtn').click(); });
</script>
</body>
</html>
