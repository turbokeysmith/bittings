<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pay your invoice</title>
<link rel="icon" href="favicon.ico">
<!--
  pay.html — the page a CUSTOMER opens from a pay link (8z75, owner 2026-11-12).
  Public, no sign-in, none of the staff app's code. It asks the server (pay-link) what the link is for,
  shows the shop, invoice number and amount, and sends the customer to Stripe's own secure payment page.
  The card number is typed on Stripe's page — it never touches this page or Bittings.
  Link: pay.html?i=<invoice id>&k=<key>      After paying, Stripe returns here with &done=1.
-->
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:#f1f3f6; color:#14171b; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:460px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .card{ background:#fff; border:1px solid #dfe3e8; border-radius:18px; padding:22px 20px; box-shadow:0 6px 24px rgba(20,23,27,.06); }
  .shop{ font-size:20px; font-weight:800; line-height:1.25; margin:0 0 2px; }
  .inv{ font-size:15px; color:#4b5563; margin:0; }
  .amt{ font-size:44px; font-weight:800; letter-spacing:-.5px; margin:18px 0 2px; }
  .sub{ font-size:14px; color:#4b5563; margin:0 0 18px; }
  .btn{ display:block; width:100%; min-height:56px; padding:15px 16px; border:0; border-radius:14px; background:linear-gradient(180deg,#22994a,#156632); color:#fff; font-size:19px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn[disabled]{ opacity:.6; cursor:default; }
  .btn.ghost{ background:#fff; color:#14171b; border:1px solid #c7ccd3; font-size:16px; min-height:48px; margin-top:10px; text-decoration:none; text-align:center; line-height:18px; }
  .note{ font-size:13.5px; color:#4b5563; line-height:1.5; margin:14px 0 0; }
  .msg{ font-size:14.5px; line-height:1.5; margin:12px 0 0; min-height:20px; color:#a3252e; font-weight:600; }
  .ok{ display:flex; align-items:center; gap:12px; margin:6px 0 4px; }
  .tick{ flex:0 0 52px; height:52px; border-radius:50%; background:#e6f4ea; color:#156632; font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .big{ font-size:22px; font-weight:800; margin:0; }
  .foot{ text-align:center; font-size:12.5px; color:#5b6472; margin:16px 4px 0; line-height:1.5; }
  .spin{ width:26px; height:26px; border:3px solid #dfe3e8; border-top-color:#156632; border-radius:50%; animation:sp 1s linear infinite; margin:8px 0; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spin{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card" aria-live="polite"><div class="spin" role="status" aria-label="Loading"></div><p class="sub" style="margin:6px 0 0">Opening your invoice…</p></div>
  <p class="foot" id="foot">Secure card payment by Stripe. Your card number is never seen or stored by the shop’s app.</p>
</div>
<script>
(function(){
  'use strict';
  var FN = 'https://gcshuhlksjznksspbigl.supabase.co/functions/v1/pay-link';   // public by design; every request needs the link's key
  var qs = new URLSearchParams(location.search), I = (qs.get('i')||'').trim(), K = (qs.get('k')||'').trim(), DONE = qs.get('done')==='1';
  var card = document.getElementById('card');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(c){ return '$'+(Math.round(Number(c)||0)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function tel(p){ var d=String(p||'').replace(/\D/g,''); if(d.length===10) d='1'+d; return d.length>=11?('+'+d):''; }
  function call(action){
    return fetch(FN, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ action:action, i:I, k:K }) })
      .then(function(r){ return r.json().then(function(j){ j._status=r.status; return j; }, function(){ return { error:'Unexpected answer from the payment service.', _status:r.status }; }); },
            function(){ return { error:'No connection. Check your signal and try again.', network:true }; });
  }
  function callBtn(info){ var t=tel(info&&info.phone); return t?('<a class="btn ghost" href="tel:'+esc(t)+'">Call '+esc(info.shop||'the shop')+'</a>'):''; }
  function head(info){ return '<p class="shop">'+esc(info.shop||'Invoice')+'</p><p class="inv">'+(info.number?('Invoice '+esc(info.number)):'Invoice')+'</p>'; }

  function showProblem(title, text, info){
    card.innerHTML = '<p class="big">'+esc(title)+'</p><p class="note" style="margin-top:8px">'+esc(text)+'</p>'+callBtn(info||{})+
      '<button type="button" class="btn ghost" id="again">Try again</button>';
    document.getElementById('again').onclick=function(){ location.reload(); };
  }
  function showPaid(info, justNow){
    document.title='Paid — thank you';
    card.innerHTML = head(info)+'<div class="ok" style="margin-top:16px"><div class="tick" aria-hidden="true">✓</div><div><p class="big">Paid — thank you!</p>'+
      '<p class="sub" style="margin:2px 0 0">'+(info.amount_cents?esc(money(info.amount_cents))+' received. ':'')+'Nothing more to pay.</p></div></div>'+
      '<p class="note">'+(justNow?'Stripe emails a receipt if you entered your email. ':'')+'You can close this page.</p>';
  }
  function showConfirming(info){
    document.title='Thank you';
    card.innerHTML = head(info)+'<div class="ok" style="margin-top:16px"><div class="tick" aria-hidden="true">✓</div><div><p class="big">Thank you!</p>'+
      '<p class="sub" style="margin:2px 0 0">Your payment went through.</p></div></div><p class="note" id="conf">Letting the shop know…</p>';
  }
  function showPay(info){
    document.title='Pay '+money(info.amount_cents)+(info.shop?(' — '+info.shop):'');
    card.innerHTML = head(info)+'<p class="amt">'+esc(money(info.amount_cents))+'</p><p class="sub">Total due, tax included. No card surcharge.</p>'+
      '<button type="button" class="btn" id="go">Pay '+esc(money(info.amount_cents))+' securely</button>'+
      '<p class="msg" id="msg" role="alert"></p>'+
      '<p class="note">You’ll enter your card on Stripe’s secure page. Apple Pay or Google Pay may be offered there too.</p>'+callBtn(info);
    var go=document.getElementById('go'), msg=document.getElementById('msg');
    go.onclick=function(){
      go.disabled=true; go.textContent='Opening secure payment…'; msg.textContent='';
      call('checkout').then(function(j){
        if(j && j.paid){ call('info').then(function(n){ showPaid(n&&n.ok?n:info, false); }); return; }
        if(j && j.url && /^https:\/\/([a-z0-9-]+\.)*stripe\.com\//i.test(j.url)){ location.href=j.url; return; }   // only ever send the customer to Stripe
        go.disabled=false; go.textContent='Pay '+money(info.amount_cents)+' securely';
        msg.textContent=(j && j.error) || 'Could not open the payment page. Please try again.';
      });
    };
  }

  if(!I || !K){ showProblem('This link is incomplete', 'Part of the payment link is missing. Open it again from the text message, or ask the shop to send a new one.'); return; }
  call('info').then(function(info){
    if(!info || info.error || !info.ok){
      if(info && info.network){ showProblem('No connection', info.error); return; }
      showProblem('This payment link isn’t valid', (info && info.code==='not_found') ? 'Ask the shop to send you a new link.' : ((info && info.error) || 'Please try again in a moment.'));
      return;
    }
    if(info.paid){ showPaid(info, DONE); return; }
    if(DONE){   // back from Stripe: the payment went through there; the shop's record follows within seconds
      showConfirming(info); var n=0;
      (function again(){ n++; setTimeout(function(){ call('info').then(function(x){
        if(x && x.ok && x.paid){ showPaid(x, true); return; }
        if(n<10) again(); else { var c=document.getElementById('conf'); if(c) c.textContent='The shop will see your payment shortly. You can close this page.'; }
      }); }, n<4?2000:4000); })();
      return;
    }
    if(info.gone){ showProblem('This invoice is no longer available', 'Please call the shop.', info); return; }
    if(!info.canPay){ showProblem('Card payment isn’t available for this invoice', 'Please call the shop to pay another way.', info); return; }
    showPay(info);
  });
})();
</script>
</body>
</html>
