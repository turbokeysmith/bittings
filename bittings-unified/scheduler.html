<script>
/* Set theme before the page paints so a dark-mode user never sees a white flash. */
(function(){
  try{
    var g = localStorage.getItem('bt_theme');           // global Light/Dark toggle (shared w/ dashboard)
    var s = localStorage.getItem('tks_sched_theme');     // this app's own remembered choice
    var theme = g ? g
      : s ? JSON.parse(s)
      : ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<style>
/* =========================================================================
   TURBO KEYSMITH — TRAINEE SCHEDULER
   Single-file app. Walks a new hire through booking a job, tells him exactly
   what to say, coaches small talk + upselling, and adds the job to your
   calendar with one tap. Shares the Bittings customer database.
   No backend, no logins, no cost. Works offline once loaded.
   ========================================================================= */

/* ---- LIGHT THEME (default) ---- */
:root{
  color-scheme:light;      /* native time/date pickers render light */
  --gold:#E8A317;          /* brand accent (key gold) */
  --gold-soft:#FFF6E2;     /* tint for selected choices */
  --gold-line:#F0C462;
  --ink:#14171b;           /* main text */
  --ink-soft:#5a616c;      /* secondary text */
  --bg:#f6f7f9;            /* page background */
  --card:#FFFFFF;
  --input-bg:#FFFFFF;
  --line:#e3e6ea;
  --green:#1F8A4C;
  --green-soft:#E7F4EC;
  --red:#C0392B;
  --red-soft:#FDF1F0;
  --on-gold:#1C1C1E;       /* text that sits on a gold button (dark in both themes) */
  /* header — light surface in light mode (themed to match the rest of the app) */
  --header-bg:#fbfcfd; --header-fg:#14171b; --toggle-bg:#eef1f5; --toggle-fg:#5a616c;
  /* "say this" coaching card */
  --coach-bg:#FFF6E2; --coach-border:#F0C462; --coach-accent:#E8A317; --coach-tag:#9A6B00; --coach-text:#3A2D08;
  /* "tip" coaching card */
  --tip-bg:#EEF3FF; --tip-border:#C9D8FF; --tip-accent:#3B6FE0; --tip-tag:#2E55B5; --tip-text:#22335E;
  --header-h:64px;
  --maxw:540px;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,23,27,.04),0 8px 24px rgba(20,23,27,.06);
}
/* ---- DARK THEME ---- */
:root[data-theme="dark"]{
  color-scheme:dark;       /* native time/date picker icons go light/white in dark mode */
  --gold:#F2B43A;
  --gold-soft:#3A2E12;
  --gold-line:#5C4A1E;
  --ink:#F1F1F4;
  --ink-soft:#9A9AA2;
  --bg:#111113;
  --card:#1C1C20;
  --input-bg:#16161A;
  --line:#33333A;
  --green:#54C98A;
  --green-soft:#16291F;
  --red:#E26A5E;
  --red-soft:#2E1A18;
  --on-gold:#1C1C1E;
  --header-bg:#0E0E10; --header-fg:#FFFFFF; --toggle-bg:#28282C; --toggle-fg:#9A9AA2;
  --coach-bg:#2E2410; --coach-border:#5C4A1E; --coach-accent:#F2B43A; --coach-tag:#E0A93C; --coach-text:#F5E4C2;
  --tip-bg:#16203A; --tip-border:#2A3F6B; --tip-accent:#5B86E5; --tip-tag:#9DB8F0; --tip-text:#D3E0FA;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:17px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .2s ease,color .2s ease;
}
h1,h2,h3,.brand{font-family:"Sora",-apple-system,sans-serif;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;height:var(--header-h);
  background:var(--header-bg);color:var(--header-fg);border-bottom:1px solid rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;padding-top:env(safe-area-inset-top);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.hdr-right{display:flex;align-items:center;gap:10px;}
.lang-toggle{
  display:flex;background:var(--toggle-bg);border-radius:999px;padding:3px;font-size:13px;font-weight:600;
}
.lang-toggle button{
  border:0;background:transparent;color:var(--toggle-fg);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;
}
.lang-toggle button.active{background:var(--gold);color:var(--on-gold);}
.theme-btn{
  border:0;background:var(--toggle-bg);color:var(--header-fg);width:38px;height:38px;
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:18px 16px 120px;}
.screen{display:none;}
.screen.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- progress ---------- */
.progress{height:6px;background:var(--line);border-radius:999px;margin-bottom:18px;overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease;}

/* ---------- coaching card (the "say this" box) ---------- */
.coach{
  background:var(--coach-bg);border:1px solid var(--coach-border);
  border-left:5px solid var(--coach-accent);border-radius:14px;
  padding:14px 16px;margin:0 0 18px;position:relative;
}
.coach .tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--coach-tag);margin-bottom:6px;
}
.coach .line{font-size:18px;font-weight:600;color:var(--coach-text);line-height:1.4;}
.coach.tip{background:var(--tip-bg);border-color:var(--tip-border);border-left-color:var(--tip-accent);}
.coach.tip .tag{color:var(--tip-tag);}
.coach.tip .line{font-weight:500;color:var(--tip-text);}

/* ---------- step content ---------- */
.step-title{font-size:15px;font-weight:600;color:var(--ink-soft);margin:0 0 12px;}
label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
input,select,textarea{
  width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--input-bg);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
textarea{min-height:70px;resize:vertical;}
.field-err{border-color:var(--red)!important;background:var(--red-soft);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ---------- big choice buttons ---------- */
.choices{display:grid;gap:10px;}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;color:var(--ink);
  transition:.15s;
}
.choice:active{transform:scale(.99);}
.choice.sel{border-color:var(--gold);background:var(--gold-soft);}
.choice .emo{font-size:22px;width:28px;text-align:center;}

/* ---------- yes/no toggle for upsell ---------- */
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.yn button{
  padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink);
}
.yn button.yes.sel{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.yn button.no.sel{background:var(--red-soft);border-color:var(--red);color:var(--red);}

/* ---------- nav buttons ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;}
.btn{
  flex:1;padding:16px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:17px;
  cursor:pointer;font-family:"Sora",sans-serif;
}
.btn.primary{background:var(--gold);color:var(--on-gold);}
.btn.ghost{flex:0 0 auto;background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);min-width:84px;}
.btn:disabled{opacity:.45;}

/* ---------- summary + calendar ---------- */
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
.summary .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;}
.summary .r:last-child{border-bottom:0;}
.summary .r b{color:var(--ink-soft);font-weight:600;}
.cal{display:grid;gap:10px;margin-bottom:10px;}
.cal a,.cal button{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font:inherit;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;font-size:16px;
}
.opencal{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border-radius:12px;border:1.5px solid var(--gold);background:var(--gold-soft);
  color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:18px;
}

/* ---------- home + lists ---------- */
.hero{text-align:center;padding:18px 0 8px;}
.hero h1{font-size:26px;margin:0 0 4px;}
.hero p{color:var(--ink-soft);margin:0 0 22px;}
.tile{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px;width:100%;font:inherit;text-align:left;cursor:pointer;
  margin-bottom:12px;box-shadow:var(--shadow);color:var(--ink);
}
.tile .big{font-size:26px;}
.tile h3{margin:0;font-size:18px;}
.tile p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat .n{font-family:"Sora";font-size:24px;font-weight:700;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.backup-row{display:flex;gap:10px;margin-top:24px;}
.mini{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font:inherit;font-weight:600;font-size:14px;cursor:pointer;}
.bk-caption{font-size:12px;color:var(--ink-soft);text-align:center;margin:10px 4px 0;line-height:1.4;}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.job .top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);}
.job h3{margin:4px 0 2px;font-size:17px;}
.job .meta{font-size:14px;color:var(--ink-soft);}
.empty{text-align:center;color:var(--ink-soft);padding:40px 0;}
.section-h{font-family:"Sora";font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:24px 0 10px;}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--coach-tag);}
.cust-hit{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.cust-hit b{display:block;}
.cust-hit span{font-size:14px;color:var(--ink-soft);}
.done-check{font-size:54px;text-align:center;margin:18px 0 6px;}

/* ---- Day view (in-app calendar) ---- */
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.daybar .navd{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto;}
.daybar input[type=date]{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 12px;color:var(--ink);font-size:16px;font-family:inherit;}
.daysum{font-size:13px;color:var(--ink-soft);margin:0 2px 12px;}
.slot{display:flex;gap:12px;align-items:stretch;border-top:1px solid var(--line);padding:10px 2px;}
.slot .hr{flex:0 0 64px;font-weight:700;font-size:13px;color:var(--ink-soft);padding-top:4px;}
.slot .cell{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.slot.free .cell{justify-content:center;}
.book-card{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--gold,#f2b43a);
  border-radius:12px;padding:10px 12px;cursor:pointer;}
.book-card.urgent{border-left-color:var(--coach-tag,#c8323c);}
.book-card b{font-size:15px;}
.book-card .m{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.slot .addbtn{align-self:flex-start;background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.slot .addbtn:hover{color:var(--ink);}
.gcal-stub{margin-top:18px;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;
  padding:14px 16px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.gcal-stub b{color:var(--ink);}
.gcal-stub .tagph{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;background:var(--gold-soft);
  color:var(--coach-tag);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
.gcal-stub button{margin-top:10px;background:transparent;border:1.5px solid var(--line);color:var(--ink);
  border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;}

/* ---- Status tags + booking detail ---- */
.status-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;
  border-radius:999px;padding:3px 9px;vertical-align:middle;white-space:nowrap;}
.book-card .row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.bk-detail{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.bk-detail h2{margin:0 0 4px;font-size:20px;}
.bk-detail .when{color:var(--ink-soft);font-size:14px;margin-bottom:12px;}
.bk-detail .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;}
.bk-detail .r b{color:var(--ink-soft);font-weight:600;}
.status-picker{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
.status-picker button{border:1.5px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;}
.status-picker button.sel{border-color:transparent;}
.bk-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.bk-actions a,.bk-actions button{flex:1 1 auto;text-align:center;text-decoration:none;border-radius:11px;
  padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;}
.bk-actions .gcal{background:var(--gold,#f2b43a);color:#1c1c1e;border:none;}
.bk-actions .edit{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.bk-actions .del{background:transparent;border:1.5px solid rgba(200,50,60,.4);color:#e0707a;flex:0 0 auto;}
/* VIN row + ignition picker */
.vin-row{display:flex;gap:8px;align-items:flex-end;}
.vin-row input{flex:1;}
.vin-row button{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  border-radius:11px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;min-height:46px;}
.vin-or{text-align:center;font-size:12px;color:var(--ink-soft);font-weight:700;margin:10px 0 4px;letter-spacing:.5px;}
.ign-pick{display:flex;gap:10px;margin-top:6px;}
.ign-pick button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  border-radius:11px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;min-height:46px;}
.ign-pick button.sel{border-color:var(--gold,#f2b43a);background:var(--gold-soft,rgba(242,180,58,.14));}
.vin-msg{font-size:13px;margin-top:6px;color:var(--ink-soft);min-height:1px;}
.vin-msg.bad{color:#e0707a;}
/* Job-photo slots — built but DORMANT (no photos yet). */
.job-photos{display:none;}            /* flip to grid when real photos exist */
.job-photos.has-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}

/* ---- Accessibility + mobile polish ---- */
:focus-visible{outline:3px solid var(--gold,#f2b43a);outline-offset:2px;border-radius:8px;}
.daybar .navd{min-width:44px;min-height:44px;}
.slot .addbtn{min-height:40px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>
</head>

/* =========================================================================
   1) STORAGE HELPERS  (same pattern as Bittings: readLS / writeLS)
   These read and write the browser's localStorage. Because this app is
   hosted on the same turbokeysmith.github.io domain as Bittings, it sees
   the SAME saved data — so customers added here show up in Bittings.
   ========================================================================= */
function readLS(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function writeLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.warn('save failed', e); }
}

/* =========================================================================
   3b) SCRIPT ROTATION ENGINE
   Picks a variant for each slot, avoiding the one used last time so lines
   don't repeat back-to-back. The choice is locked per booking (stable if he
   taps Back), and the "last used" is saved so the next call differs too.
   We store the INDEX (not the text), so toggling EN/ES keeps the same line.
   ========================================================================= */
let lastLineIdx = readLS(K_LASTLINE, {});   // { slot: lastIndexUsed }

function pickIdx(slot, len){
  if(booking.lineIdx && booking.lineIdx[slot]!=null) return booking.lineIdx[slot]; // stable within this call
  let i = Math.floor(Math.random()*len);
  if(len>1 && i===lastLineIdx[slot]) i=(i+1)%len;   // never repeat the previous one
  booking.lineIdx[slot]=i;
  lastLineIdx[slot]=i; writeLS(K_LASTLINE, lastLineIdx);
  return i;
}
/* returns the chosen line text for a slot, in the current language,
   with {biz}/{techClause}/{tech} personalized from the Setup config */
function line(slot, variants){
  const arr = variants[LANG] || variants.en;
  return personalize(arr[pickIdx(slot, arr.length)]);

/* ---- script personalization (single source = Setup config, no hardcoded brand) ---- */
function bizName(){
  try{ const n=((window.TKS&&TKS.Config)?(TKS.Config.identity().name||''):'').trim(); if(n) return n; }catch(e){}
  return LANG==='es' ? 'nuestra cerrajería' : 'our shop';
}
function techFirstName(){
  try{
    if(!(window.TKS&&TKS.Config&&TKS.auth)) return '';
    const email=(TKS.auth.email()||'').toLowerCase();
    if(!email) return '';
    const emps=(TKS.Config.access().employees)||[];
    const me=emps.find(e=> e && String(e.email||'').toLowerCase()===email);
    const nm=me && String(me.name||'').trim();
    return nm ? nm.split(/\s+/)[0] : '';
  }catch(e){ return ''; }
}
function personalize(str){
  if(!str) return str;
  const tech=techFirstName();
  const techClause = tech ? (LANG==='es' ? `, le habla ${tech}` : `, this is ${tech}`) : '';
  return String(str).replace(/\{biz\}/g, bizName()).replace(/\{techClause\}/g, techClause).replace(/\{tech\}/g, tech);
}

/* ---- structured address (Street / City / State / ZIP) ----
   We keep booking.address as the composed one-line string so everything that
   already reads it (the calendar location, the day card, receipts) keeps working
   and the tech can tap it to navigate. */
function composeAddress(a){
  if(!a) return '';
  const l1 = (a.street||'').trim();
  const cs = [ (a.city||'').trim(), [ (a.state||'').trim(), (a.zip||'').trim() ].filter(Boolean).join(' ') ].filter(Boolean).join(', ');
  return [l1, cs].filter(Boolean).join(', ');
}
function setAddr(field, val){
  if(!booking.addr) booking.addr = { street:"", city:"", state:"", zip:"" };
  booking.addr[field] = (field==='state') ? (val||'').toUpperCase() : val;
  booking.address = composeAddress(booking.addr);
}
// One reusable Street/City/State/ZIP block (each on its own line).
function addrFieldsHTML(a){
  a = a || { street:"", city:"", state:"", zip:"" };
  const L = (en,es)=> LANG==='es'?es:en;
  return `<label>${L('Street address','Calle y número')}</label>
      <input id="f_street" value="${esc(a.street||'')}" oninput="setAddr('street',this.value)" placeholder="123 Main St" autocomplete="off">
    <label>${L('City','Ciudad')}</label>
      <input id="f_city" value="${esc(a.city||'')}" oninput="setAddr('city',this.value)" placeholder="${L('Oklahoma City','Ciudad de Oklahoma')}" autocomplete="off">
    <div class="row2">
      <div><label>${L('State','Estado')}</label><input id="f_state" value="${esc(a.state||'')}" oninput="setAddr('state',this.value)" placeholder="OK" maxlength="2" style="text-transform:uppercase" autocomplete="off"></div>
      <div><label>${L('ZIP','Código postal')}</label><input id="f_zip" value="${esc(a.zip||'')}" oninput="setAddr('zip',this.value)" placeholder="73101" inputmode="numeric" autocomplete="off"></div>
    </div>`;
}
// Make sure booking.addr exists (migrate an old one-line address into Street).
function ensureAddr(){
  if(!booking.addr) booking.addr = { street:"", city:"", state:"", zip:"" };

}

/* ---- technician roster (a DROPDOWN, never typed) ----
   Sourced from the CLOUD STAFF table when signed in (the authoritative team, with
   roles + stable ids), falling back to Settings → Access employees when offline. */
let _schedStaff = null;   // cache of [{user_id,name,role,active}]; null = not loaded yet
function loadSchedStaff(cb){
  if(_schedStaff!==null){ if(cb) cb(); return; }
  _schedStaff = [];
  try{
    if(window.TKS && TKS.auth && TKS.auth.isSignedIn() && TKS.Fleet && TKS.Fleet.staff){
      TKS.Fleet.staff().then(res=>{ _schedStaff = (res && res.data) || []; if(cb) cb(); }).catch(()=>{ if(cb) cb(); });
      return;
    }
  }catch(e){}
  if(cb) cb();
}
function roleShort(r){ return ({owner:'Owner',manager:'Manager',front_desk:'Front Desk',technician:'Tech'})[r] || ''; }
// Unified roster [{id,name,role}] — cloud staff first, else Settings employees.
function teamMembers(){
  if(_schedStaff && _schedStaff.length){
    return _schedStaff.filter(s=>s.active!==false).map(s=>({ id:s.user_id, name:(s.name||'').trim()||roleShort(s.role), role:s.role }));
  }
  try{ return ((TKS.Config.access().employees)||[]).filter(e=>e&&(e.name||'').trim()).map(e=>({ id:'', name:e.name.trim(), role:e.owner?'manager':'' })); }catch(e){ return []; }
}
// <select> value = the staff user_id (reliable) or "name:<n>" offline. We store
// BOTH booking.technicianId (for matching) and booking.technician (name, for display/reports).
function techSelectHTML(selId, selName, onchangeAttr){
  const team = teamMembers();
  if(!team.length){ return `<div class="bk-caption" style="margin:2px 0 8px">${LANG==='es'?'Agrega tu equipo en Configuración → Acceso para asignar un técnico.':'Add your team in Settings → Access to assign a tech.'}</div>`; }
  const none = LANG==='es'?'— Sin asignar —':'— Unassigned —';
  return `<select ${onchangeAttr||''}><option value="">${none}</option>`+
    team.map(m=>{ const val = m.id || ('name:'+m.name);
      const sel = (m.id && selId && selId===m.id) || ((!m.id || !selId) && selName && selName===m.name);
      return `<option value="${esc(val)}" ${sel?'selected':''}>${esc(m.name + (m.role?(' — '+roleShort(m.role)):''))}</option>`; }).join('')+`</select>`;
}
function resolveTech(val){
  if(!val) return { id:'', name:'' };
  if(String(val).indexOf('name:')===0) return { id:'', name:String(val).slice(5) };
  const m = teamMembers().find(x=>x.id===val);
  return { id:val, name:(m&&m.name)||'' };
}
function pickTech(val){ const r=resolveTech(val); booking.technicianId=r.id; booking.technician=r.name; }   // flow confirm + quick form
// Assign a tech to an EXISTING booking straight from the detail view (saves now).
function assignTechToBooking(id, val){
  let bk=null; try{ bk = TKS.Bookings.get(id); }catch(e){}
  if(!bk) bk = allBookings().find(x=>x.id===id);
  if(!bk) return;
  const r=resolveTech(val); bk.technicianId=r.id; bk.technician=r.name;
  try{ TKS.Bookings.save(bk); }
  catch(e){ const arr=readLS(K_BOOKINGS,[]); const i=arr.findIndex(x=>x.id===id); if(i!==-1){ arr[i]=bk; writeLS(K_BOOKINGS,arr); } }
}

/* ---- technician self-scope: a tech only SEES + TOUCHES their own assigned jobs ---- */
function isTechRole(){ try{ return !!(TKS.auth && TKS.auth.staffRole && TKS.auth.staffRole()==='technician'); }catch(e){ return false; } }
function isOwnerRole(){ try{ return !!(TKS.auth && ((TKS.auth.staffRole&&TKS.auth.staffRole()==='owner') || (TKS.auth.isOwner&&TKS.auth.isOwner()))); }catch(e){ return false; } }
function myStaffName(){
  let uid=''; try{ const u=TKS.auth.user&&TKS.auth.user(); uid=u?u.id:''; }catch(e){}
  if(uid && _schedStaff){ const s=_schedStaff.find(x=>x.user_id===uid); if(s) return String(s.name||'').trim(); }
  try{ const email=((TKS.auth&&TKS.auth.email&&TKS.auth.email())||'').toLowerCase(); const emps=(TKS.Config.access().employees)||[]; const me=emps.find(e=>String(e.email||'').toLowerCase()===email); return me?String(me.name||'').trim():''; }catch(e){ return ''; }
}
function isOwnBooking(b){
  if(!isTechRole()) return true;
  let uid=''; try{ const u=TKS.auth.user&&TKS.auth.user(); uid=u?u.id:''; }catch(e){}
  if(uid && b && b.technicianId) return b.technicianId===uid;        // reliable id match
  const me=(myStaffName()||'').toLowerCase();
  return !!(me && String((b&&b.technician)||'').trim().toLowerCase()===me);
}
function ownJobsOnly(list){ if(!isTechRole()) return list||[]; return (list||[]).filter(isOwnBooking); }

/* =========================================================================
   Day view — in-app calendar for the front desk.
   Reads the SAME local bookings (tks_bookings) the intake flow writes, shows
   them on an hour-by-hour grid, and lets you tap an open slot to start a new
   booking pre-filled with that date + time. No Google account required.
   ========================================================================= */
const DAY_START = 7, DAY_END = 20;            // 7 AM … 8 PM rows
function todayISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
let DAY = todayISO();
function shiftDay(n){ DAY = addDaysISO(DAY,n); render(); }
function setDay(v){ if(v){ DAY=v; render(); } }

function renderDay(){
  if(nav) nav.style.display='none';
  const all = ownJobsOnly(allBookings().filter(b=>(b.date||'')===DAY))
                .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let rows='';
  for(let h=DAY_START; h<=DAY_END; h++){
    const hh = String(h).padStart(2,'0');
    const inSlot = all.filter(b=>{ const t=(b.time||''); const bh=parseInt(t.slice(0,2),10); return bh===h; });
    const label = fmt12(hh+':00');
    let cell='';
    if(inSlot.length){
      cell = inSlot.map(b=>{
        const nm = (b.customer && b.customer.name) ? b.customer.name : (b.customer && b.customer.customer) || '—';
        const job = subLabel ? subLabel(b.jobType, b.subType) : (b.jobType||'');
        const urgent = (typeof isUrgent==='function' && isUrgent(b)) ? ' urgent' : '';
        return `<div class="book-card${urgent}" onclick="openBooking('${b.id}')">
          <div class="row-top"><b>${esc(fmt12(b.time))} · ${esc(nm)}</b>${statusTag(b.status||'Scheduled')}</div>
          <div class="m">${esc(job||'')}${b.address?' · '+esc(b.address):''}</div></div>`;
      }).join('');
    }
    // Day view is read-only: it shows jobs and lets you open them. Starting a
    // booking must go through the forced guided flow (Home → New booking), so
    // there is intentionally no "+ Book" shortcut here.
    rows += `<div class="slot ${inSlot.length?'busy':'free'}"><div class="hr">${esc(label)}</div><div class="cell">${cell || ''}</div></div>`;
  }
  const count = all.length;
  app.innerHTML = `
    <button class="btn ghost" style="margin-bottom:14px" onclick="VIEW='home';render()">← ${t('home')}</button>
    <div class="daybar">
      <button class="navd" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
      <input type="date" value="${DAY}" onchange="setDay(this.value)">
      <button class="navd" onclick="shiftDay(1)" aria-label="Next day">›</button>
    </div>
    <div class="daysum">${esc(prettyDate(DAY))} · ${count} ${count===1?(LANG==='es'?'trabajo':'job'):(LANG==='es'?'trabajos':'jobs')} ${LANG==='es'?'agendados':'booked'}</div>
    ${rows}
    <div class="gcal-stub">
      <b>${LANG==='es'?'Google Calendar':'Google Calendar'}</b><span class="tagph">${LANG==='es'?'NO CONECTADO':'NOT CONNECTED'}</span><br>
      ${LANG==='es'
        ? 'La sincronización en dos sentidos con Google Calendar aún no está conectada. Por ahora puedes abrir Google Calendar en otra pestaña. Conectar la cuenta real es una decisión pendiente.'
        : 'Two-way sync with Google Calendar isn’t wired up yet. For now you can open Google Calendar in a new tab. Connecting the real account is a pending decision (needs credentials).'}
      <br><button onclick="openCalendar()">📅 ${LANG==='es'?'Abrir Google Calendar':'Open Google Calendar'}</button>
    </div>`;
}

        ${canEditBooking() ? `<button class="edit" onclick="editBooking('${b.id}')">✏️ ${t('edit_booking')}</button>` : ''}
        <button class="del" data-cap="hardDelete" onclick="deleteBooking('${b.id}')">🗑</button>
      </div>
    </div>`;
  if(window.TKS_ACCESS) TKS_ACCESS.applyGates(app);
  loadJobAccount(b.id);
}

// Local→cloud status map (the cloud state machine is richer; we keep the owner's
// familiar 5-button picker and translate). 'Canceled' is special — it must carry a
// reason, so it routes to the cancel flow (job_cancel), never job_set_status.
const L2C_STATUS = { 'Scheduled':'scheduled','In Progress':'in_progress','Completed':'completed','Rescheduled':'scheduled','Canceled':'canceled' };
const CLOUD_STATUS_LABEL = { scheduled:'Scheduled', en_route:'En route', on_site:'On site', in_progress:'In progress', completed:'Completed', on_hold:'On hold', canceled:'Canceled' };

function setBookingStatus(id,status){
  // Cancel + Reschedule ALWAYS require a note + the equipment/sign-off warning
  // (online or offline). Everything else is just moving the progress bar.
  if(status==='Canceled'){ openStatusNote(id,'cancel'); return; }
  if(status==='Rescheduled'){ openStatusNote(id,'reschedule'); return; }
  // Offline / local: just set the status.
  if(!(window.TKS && TKS.auth && TKS.auth.isSignedIn())){ try{ TKS.Bookings.setStatus(id,status); }catch(e){} render(); return; }
  // Cloud: the authoritative status is RPC-only (own-job + reconciliation gates).
  const cloud = L2C_STATUS[status] || 'scheduled';
  TKS.Jobs.setStatus(id, cloud).then(res=>{
    if(res && res.error){ if(window.TKS_ACCESS) TKS_ACCESS.toast(res.error.message); else alert(res.error.message); }
    else { try{ TKS.Bookings.setStatus(id,status); }catch(e){} }   // mirror to the local day-board view
    render();
  }).catch(e=>{ if(window.TKS_ACCESS) TKS_ACCESS.toast(e.message||'Status change failed.'); render(); });
}
function deleteBooking(id){
  TKS_ACCESS.confirmDanger({ title:'Delete this booking?', message:t('del_confirm'), confirmLabel:'Delete' }).then(function(ok){
    if(!ok) return;
    try{ TKS.Bookings.remove(id); }catch(e){}
    VIEW='jobs'; render();
  });
}
/* ===================== JOB ACCOUNTABILITY (cloud, 1c) =====================
   Appended to the booking detail when signed into the cloud. Shows the
   authoritative (RPC-only) status + reconciliation flag, the assigned lead
   tech, the parts checklist (reconcile used/returned; a returned cut key needs
   a photo), the "part not on the tech's van" flag with a guided move, and
   Cancel-with-reason. Every action calls a server RPC that re-enforces the role
   + own-job rule, so the UI can't grant more than the database allows. */
const CANCEL_REASONS = ['Customer no-show','Customer canceled','Rescheduled','Duplicate booking','Unable to complete (vehicle/parts)','Priced too high','Other'];
function jobRole(){ try{ return TKS.auth.staffRole && TKS.auth.staffRole(); }catch(e){ return null; } }
function myUid(){ try{ const u=TKS.auth.user&&TKS.auth.user(); return u?u.id:null; }catch(e){ return null; } }
function vanName(loc, vans){ if(loc==='shop') return 'Shop'; if(String(loc).indexOf('van:')===0){ const id=String(loc).slice(4); const v=(vans||[]).find(x=>x.id===id); return v?(v.nickname||('Van '+(v.fleet_no||''))||'Van'):'Van'; } return loc; }
function jaMsg(t,ok){ const m=document.getElementById('ja_msg'); if(m){ m.style.color=ok?'#22994a':'#c8323c'; m.textContent=t; if(ok) setTimeout(()=>{ if(m) m.textContent=''; },2400); } }

function loadJobAccount(jobId){
  const host=document.getElementById('jobAccount'); if(!host) return;
  if(!(window.TKS && TKS.auth && TKS.auth.isSignedIn())){ host.innerHTML=''; return; }   // cloud-only feature
  host.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px 0">Loading job accountability…</div>';
  Promise.all([ TKS.Jobs.meta(jobId), TKS.Jobs.parts(jobId), TKS.Jobs.staffOnJob(jobId), TKS.Fleet.staff(), TKS.Fleet.list() ])
    .then(([meta,parts,js,staff,vans])=>{
      const M=(meta&&meta.data)||{}, P=(parts&&parts.data)||[], JS=(js&&js.data)||[], STAFF=(staff&&staff.data)||[], VANS=(vans&&vans.data)||[];
      drawJobAccount(host, jobId, M, P, JS, STAFF, VANS);
    }).catch(e=>{ host.innerHTML='<div style="color:#c8323c;font-size:12px;padding:8px 0">'+esc(e.message||'Couldn’t load job data.')+'</div>'; });
}

function partRowHTML(p, canReconcile){

  let acts='';
  if((p.state||'pending')==='pending' && canReconcile){
    acts='<div style="display:flex;gap:6px;margin-top:5px">'+
      '<button class="btn ghost" data-used="'+esc(p.id)+'" style="padding:6px 12px;font-size:12px">Used</button>'+
      '<button class="btn ghost" data-ret="'+esc(p.id)+'" data-cut="'+(p.is_cut_key?'1':'')+'" style="padding:6px 12px;font-size:12px">Returned'+(p.is_cut_key?' 📷':'')+'</button></div>';
  }
  return '<div class="ja-part" data-pid="'+esc(p.id)+'" style="border-top:1px solid var(--line);padding:7px 0">'+
    '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>'+esc(p.description||p.item_id||'Part')+
      (p.qty>1?(' ×'+p.qty):'')+(p.is_cut_key?' <span style="font-size:10px;background:rgba(74,163,255,.14);color:#2b6cb0;padding:1px 6px;border-radius:999px">cut key</span>':'')+'</span>'+
      '<span style="font-size:12px;white-space:nowrap">'+stateBadge+'</span></div>'+
      '<div class="ja-vanflag" style="font-size:11.5px;margin-top:2px"></div>'+acts+'</div>';

function drawJobAccount(host, jobId, M, parts, jobStaff, staff, vans){
  const role=jobRole(), uid=myUid();
  const lead=jobStaff.find(x=>x.job_role==='lead');
  const ownJob = !!(uid && jobStaff.some(x=>x.user_id===uid));
  const canStatus = role!=='front_desk' && !(role==='technician' && !ownJob);
  const canReconcile = role==='owner'||role==='manager' || (role==='technician' && ownJob);
  const leadStaff = lead ? staff.find(s=>s.user_id===lead.user_id) : null;
  const leadName = leadStaff ? (leadStaff.name||'Tech') : (lead?'Tech':'Unassigned');
  const leadVan = leadStaff ? leadStaff.home_van_id : null;

  // Read-only the simple picker when this user can't change THIS job's status.
  const sp=document.getElementById('statusPicker');
  if(sp){ if(!canStatus){ sp.style.opacity='.45'; sp.style.pointerEvents='none'; } else { sp.style.opacity=''; sp.style.pointerEvents=''; } }

  let html='<div class="section-h" style="margin-top:18px">Job accountability</div>'+
    '<div style="font-size:12.5px;color:var(--dim);margin-bottom:8px">Accountable status: <b style="color:var(--ink)">'+esc(CLOUD_STATUS_LABEL[M.status]||M.status||'—')+'</b>'+
      (M.reconciliation_pending?' · <b style="color:#c8323c">⚠ Reconciliation pending</b>':'')+'</div>';
  if(M.status==='canceled' && M.cancel_reason){ html+='<div style="font-size:12px;color:var(--dim);margin:-4px 0 8px">Reason: '+esc(M.cancel_reason)+(M.cancel_detail?(' — '+esc(M.cancel_detail)):'')+'</div>'; }
  if(role==='technician' && !ownJob){ html+='<div style="background:rgba(242,180,58,.12);border:1px solid rgba(242,180,58,.4);border-radius:9px;padding:8px 10px;font-size:12px;margin-bottom:8px">This isn’t your assigned job — status &amp; parts are read-only for you.</div>'; }

  // Lead assignment (manager+ sets it).
  html+='<div style="margin-bottom:8px"><label style="font-size:11px;color:var(--dim);display:block;margin-bottom:3px">Lead tech</label>';
  if(role==='owner'||role==='manager'){
    const opts='<option value="">— unassigned —</option>'+staff.filter(s=>s.active!==false).map(s=>'<option value="'+esc(s.user_id)+'"'+(lead&&lead.user_id===s.user_id?' selected':'')+'>'+esc(s.name||s.role)+'</option>').join('');
    html+='<select id="ja_lead" style="width:100%">'+opts+'</select>';
  } else { html+='<div style="font-size:13px">'+esc(leadName)+'</div>'; }
  html+='</div>';

  // Parts checklist.
  html+='<div class="section-h" style="margin-top:8px">Parts &amp; reconciliation</div>';
  html+= parts.length ? '<div id="ja_parts">'+parts.map(p=>partRowHTML(p,canReconcile)).join('')+'</div>'
                      : '<div style="font-size:12px;color:var(--dim)">No parts logged for this job.</div>';
  html+='<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center"><input id="ja_pdesc" placeholder="Add a part used on this job" style="flex:1;min-width:150px">'+
    '<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)"><input type="checkbox" id="ja_pcut" style="width:auto">cut key</label>'+
    '<button class="btn ghost" id="ja_padd" style="padding:8px 12px">+ Add</button></div>';

  // Cancel-with-reason.
  const canCancel = role==='owner'||role==='manager' || (role==='technician'&&ownJob) || (role==='front_desk' && M.status==='scheduled');
  if(canCancel && M.status!=='canceled'){
    html+='<button class="btn ghost" id="ja_cancel" style="margin-top:12px;color:#c8323c;border-color:rgba(200,50,60,.4);width:100%">⊘ Cancel this job…</button>';
  }
  html+='<div id="ja_msg" style="font-size:12px;min-height:15px;margin-top:8px"></div>';
  host.innerHTML=html;

  // ---- wire ----
  const leadSel=document.getElementById('ja_lead');
  if(leadSel) leadSel.onchange=function(){
    const newUid=leadSel.value;
    const step = TKS.Jobs.unassignRole(jobId,'lead');     // clear any existing lead first
    step.then(()=> newUid ? TKS.Jobs.assign(jobId,newUid,'lead') : {error:null})
      .then(res=>{ jaMsg(res&&res.error?res.error.message:(newUid?'Lead assigned.':'Lead cleared.'), !(res&&res.error)); loadJobAccount(jobId); })
      .catch(e=> jaMsg(e.message||'Couldn’t assign.',false));
  };
  host.querySelectorAll('[data-used]').forEach(b=> b.onclick=()=> jaReconcile(jobId, b.getAttribute('data-used'),'used',false));
  host.querySelectorAll('[data-ret]').forEach(b=> b.onclick=()=> jaReconcile(jobId, b.getAttribute('data-ret'),'returned', b.getAttribute('data-cut')==='1'));
  const padd=document.getElementById('ja_padd');
  if(padd) padd.onclick=function(){
    const d=document.getElementById('ja_pdesc').value.trim(), cut=document.getElementById('ja_pcut').checked;
    if(!d){ jaMsg('Type what the part was.',false); return; }
    jaMsg('Adding…',true);
    TKS.Jobs.addPart(jobId,d,cut).then(res=>{ if(res&&res.error){ jaMsg(res.error.message,false);} else { jaMsg('Part added.',true); loadJobAccount(jobId);} }).catch(e=> jaMsg(e.message||'Add failed.',false));
  };
  const cb=document.getElementById('ja_cancel');
  if(cb) cb.onclick=()=> openCancelJob(jobId);

  // "Part not on the tech's van" flag + guided move (async enrichment).
  if(leadVan){ jaCheckVanStock(jobId, parts, leadVan, leadName, role, ownJob); }
}

function jaReconcile(jobId, partId, state, isCut){
  if(state==='returned' && isCut){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
    inp.onchange=function(){ const f=inp.files&&inp.files[0]; if(!f) return; jaMsg('Uploading photo…',true);
      TKS.Jobs.uploadProof(jobId,f).then(path=> TKS.Jobs.reconcilePart(partId,'returned',path))
        .then(res=>{ if(res&&res.error){ jaMsg(res.error.message,false);} else { jaMsg('Returned — photo saved.',true); loadJobAccount(jobId);} })
        .catch(e=> jaMsg(e.message||'Upload failed.',false)); };
    inp.click(); return;
  }
  jaMsg('Saving…',true);
  TKS.Jobs.reconcilePart(partId,state,'').then(res=>{ if(res&&res.error){ jaMsg(res.error.message,false);} else { jaMsg('Marked '+state+'.',true); loadJobAccount(jobId);} }).catch(e=> jaMsg(e.message||'Failed.',false));
}

// For each part tied to an inventory item, check the lead tech's home van. If the
// item isn't on that van, flag it and (for someone who can move stock) offer a
// one-tap guided move from the shop to the van — the reassignment helper.
function jaCheckVanStock(jobId, parts, leadVan, leadName, role, ownJob){
  const canMove = role==='owner'||role==='manager' || (role==='technician' && ownJob);
  parts.forEach(p=>{
    if(!p.item_id) return;
    const row=document.querySelector('.ja-part[data-pid="'+p.id+'"] .ja-vanflag'); if(!row) return;
    TKS.InvOps.locations(p.item_id).then(res=>{
      const locs=(res&&res.data)||[]; const onVan=locs.find(l=>l.location==='van:'+leadVan);
      if(onVan && (parseInt(onVan.qty,10)||0)>0) return;     // it's on the van — nothing to flag
      const atShop=locs.find(l=>l.location==='shop'); const shopQty=atShop?(parseInt(atShop.qty,10)||0):0;
      row.innerHTML='<span style="color:#c8323c">⚠ Not on '+esc(leadName)+'’s van.</span>'+
        (canMove && shopQty>0 ? ' <button class="btn ghost" data-mv="'+esc(p.item_id)+'" style="padding:3px 9px;font-size:11px">Move 1 → van</button>'
          : (shopQty<=0?' <span style="color:var(--dim)">(none at shop)</span>':''));
      const mv=row.querySelector('[data-mv]');
      if(mv) mv.onclick=function(){ jaMsg('Moving to van…',true);
        TKS.InvOps.move(p.item_id,'shop','van:'+leadVan,1).then(r=>{ if(r&&r.error){ jaMsg(r.error.message,false);} else { jaMsg('Moved 1 to the van.',true); loadJobAccount(jobId);} }).catch(e=> jaMsg(e.message||'Move failed.',false)); };
    }).catch(()=>{});
  });
}

// Append a timestamped note to a booking + flag that a manager must sign off
// (confirm any equipment is unused/returned before stock is restored).
function tagBookingNote(id, label, note){
  let bk=null; try{ bk=TKS.Bookings.get(id); }catch(e){} if(!bk) bk=allBookings().find(x=>x.id===id); if(!bk) return;
  let stamp=''; try{ stamp=' '+new Date().toLocaleString(); }catch(e){}
  bk.notes = ((bk.notes||'').trim() ? (bk.notes.trim()+'\n') : '') + '['+label+stamp+'] '+(note||'');
  bk.needsManagerSignoff = true; bk.signoffReason = label;   // manager confirms equipment unused/returned
  try{ TKS.Bookings.save(bk); }catch(e){ const arr=readLS(K_BOOKINGS,[]); const i=arr.findIndex(x=>x.id===id); if(i!==-1){ arr[i]=bk; writeLS(K_BOOKINGS,arr);} }
}

// Cancel / Reschedule modal — a NOTE is required, and it warns that equipment
// must be confirmed UNUSED and a MANAGER must sign off. Centered + theme-matched.
// Cancel routes to job_cancel (server re-checks role/own-job); reschedule keeps
// the cloud status 'scheduled' but flags it locally as Rescheduled + needs sign-off.
function openStatusNote(jobId, kind){
  const isCancel = kind==='cancel';
  const noteReq = !isOwnerRole();   // owner can cancel/reschedule without a note; everyone else must
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9000;background:rgba(6,8,11,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML='<div style="background:var(--card,#fff);color:var(--ink);width:100%;max-width:520px;border-radius:16px;padding:16px;max-height:88vh;overflow:auto">'+
    '<h2 style="margin:0 0 8px;font-size:17px">'+(isCancel?'Cancel this job':'Reschedule this job')+'</h2>'+
    '<div style="background:rgba(200,50,60,.10);border:1px solid rgba(200,50,60,.4);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:10px">'+
      '⚠ Confirm every part, key, or piece of equipment taken for this job is <b>unused</b> and returned to stock. '+
      '<b>A manager must sign off</b> before any of it goes back into inventory.</div>'+
    (isCancel ? '<label style="font-size:12px;color:var(--dim)">Reason</label><select id="sn_reason" style="width:100%">'+CANCEL_REASONS.map(r=>'<option value="'+esc(r)+'">'+esc(r)+'</option>').join('')+'</select>' : '')+
    '<label style="font-size:12px;color:var(--dim);margin-top:8px;display:block">'+(isCancel?'Note':'Why reschedule, and new timing?')+(noteReq?' (required)':' (optional)')+'</label>'+
    '<textarea id="sn_note" rows="3" style="width:100%" placeholder="'+(isCancel?'What happened — and the state of any equipment taken…':'Reason + new timing — and the state of any equipment taken…')+'"></textarea>'+
    '<div id="sn_msg" style="font-size:12px;min-height:15px;margin-top:6px"></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" id="sn_back" style="flex:1">Keep job</button>'+
      '<button class="btn" id="sn_go" style="flex:2;background:#c8323c;color:#fff">'+(isCancel?'Cancel job':'Mark rescheduled')+'</button></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) close(); });
  document.getElementById('sn_back').onclick=close;
  document.getElementById('sn_go').onclick=function(){
    const note=document.getElementById('sn_note').value.trim();
    const reason=isCancel ? document.getElementById('sn_reason').value : 'Rescheduled';
    const m=document.getElementById('sn_msg');
    if(noteReq && !note){ m.style.color='#c8323c'; m.textContent='A note is required.'; return; }
    m.style.color='var(--dim)'; m.textContent=isCancel?'Canceling…':'Saving…';
    tagBookingNote(jobId, isCancel?('Canceled — '+reason):'Rescheduled', note);
    const signedIn=!!(window.TKS && TKS.auth && TKS.auth.isSignedIn());
    if(signedIn){
      const p = isCancel ? TKS.Jobs.cancel(jobId, reason, note) : TKS.Jobs.setStatus(jobId,'scheduled');
      p.then(res=>{ if(res&&res.error){ m.style.color='#c8323c'; m.textContent=res.error.message; }
        else { try{ TKS.Bookings.setStatus(jobId, isCancel?'Canceled':'Rescheduled'); }catch(e){} close(); render(); } })
       .catch(e=>{ m.style.color='#c8323c'; m.textContent=e.message||'Failed.'; });
    } else { try{ TKS.Bookings.setStatus(jobId, isCancel?'Canceled':'Rescheduled'); }catch(e){} close(); render(); }
  };
}
function openCancelJob(jobId){ openStatusNote(jobId,'cancel'); }   // alias (used by the job accountability panel)

function editBooking(id){
  if(!canEditBooking()){ try{ TKS_ACCESS.toast("Technicians can't edit appointments — move the status, or reschedule/cancel with a note."); }catch(e){} return; }
  const b = (function(){ try{ return TKS.Bookings.get(id); }catch(e){ return null; } })()
            || allBookings().find(x=>x.id===id);
  if(!b) return;
  booking = JSON.parse(JSON.stringify(b));
  if(!booking.lineIdx) booking.lineIdx={};
  if(!booking.vehicle) booking.vehicle={year:"",make:"",model:"",vin:"",ignition:""};
  if(!booking.images) booking.images=[];
  stepIndex = 0; VIEW='flow'; render();
}

/* =========================================================================
   OWNER QUICK-FORM BYPASS  (single, SWAPPABLE control point)
   The per-booking "Quick form" skips the guided steps for ONE booking. Access
   runs through requestOwnerAccess() — the ONLY gate. TODAY it checks a PIN from
   app/cloud-config.js (window.TKS_OWNER.QUICK_FORM_PIN). LATER, when a real
   owner login gates the app, replace ONLY the body of requestOwnerAccess() with
   a role check, e.g.:
       function requestOwnerAccess(onGranted){
         if (window.TKS && TKS.currentUserIsOwner && TKS.currentUserIsOwner()) onGranted();
         else { alert('Owners only'); VIEW='home'; render(); }
       }
   Nothing else changes — every caller just calls requestOwnerAccess(grantFn).
   ========================================================================= */
let _ownerGrant = null, pinError = '';
function ownerPinConfigured(){
  if(window.TKS && TKS.auth && TKS.auth.hasManagerPin) return TKS.auth.hasManagerPin();
  return !!String((window.TKS && TKS.Config ? TKS.Config.ownerPin() : (window.TKS_OWNER && window.TKS_OWNER.QUICK_FORM_PIN)) || '').length;
}
function requestOwnerAccess(onGranted){
  const grant = (typeof onGranted==='function') ? onGranted : function(){};
  // 1) Signed in as the OWNER → unlock immediately, no PIN.
  try{
    if(window.TKS && TKS.auth && TKS.auth.isSignedIn()){
      if(TKS.auth.can && TKS.auth.can('setup')){ grant(); return; }   // manager+ unlocks (real role)
      // Signed in as a non-manager → their login can't unlock manager-only things.
      alert(t('owner_denied')); VIEW='home'; render(); return;
    }
  }catch(e){}
  // 2) Nobody signed in → fall back to the owner PIN (if one is configured).
  if(!ownerPinConfigured()){ alert(t('pin_unset')); VIEW='home'; render(); return; }
  _ownerGrant = grant; pinError=''; VIEW='pin'; render();
}
function submitOwnerPin(){
  const el = document.getElementById('pinInput');
  const entered = el ? el.value : '';
  const match = (window.TKS && TKS.auth && TKS.auth.managerByPin) ? TKS.auth.managerByPin(entered)
    : (entered && entered === String((window.TKS && TKS.Config ? TKS.Config.ownerPin() : (window.TKS_OWNER && window.TKS_OWNER.QUICK_FORM_PIN)) || '') ? {name:'Manager'} : null);
  if(match){
    const g = _ownerGrant; _ownerGrant = null; pinError = '';
    if(g) g();
  } else {
    pinError = t('pin_wrong'); render();
  }
}
function renderPin(){
  if(nav) nav.style.display='none';
  app.innerHTML = `
    <button class="btn ghost" style="margin-bottom:14px" onclick="VIEW='home';render()">← ${t('home')}</button>
    <div class="bk-detail">
      <div class="row-top"><h2>🔒 ${t('pin_title')}</h2></div>
      <p class="when">${t('pin_prompt')}</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off"
             placeholder="••••" style="font-size:20px;letter-spacing:4px;text-align:center"
             onkeydown="if(event.key==='Enter')submitOwnerPin()">
      ${pinError?`<div class="vin-msg bad" style="margin-top:8px">${esc(pinError)}</div>`:''}
      <div class="bk-actions">
        <button class="gcal" onclick="submitOwnerPin()">${t('unlock')}</button>
        <button class="edit" onclick="VIEW='home';render()">${t('cancel')}</button>
      </div>
    </div>`;
  const i = document.getElementById('pinInput'); if(i) i.focus();
}
function ownerQuickForm(){
  // Single gate: owner-login unlocks instantly; PIN is the no-login fallback.
  requestOwnerAccess(startQuickForm);
}
function startQuickForm(){ booking = freshBooking(); VIEW='quickform'; render(); }

function renderQuickForm(){
  if(nav) nav.style.display='none';
  const b = booking;
  const isAuto = b.jobType==='auto';
  const subOpts = (SUBTYPES[b.jobType]||[]).map(([v,emo,en,es])=>

/* ---------- FLOW (the wizard) ---------- */
function startFlow(){ booking = freshBooking(); stepIndex = 0; VIEW='flow'; render(); }

function renderFlow(){
  nav.style.display='block';
  const step = STEPS[stepIndex];
  const pct = Math.round((stepIndex)/(STEPS.length-1)*100);
  let html = `<div class="progress"><i style="width:${pct}%"></i></div>
    <div id="stepMsg" class="vin-msg bad" style="margin-bottom:8px"></div>`;

  if(step==='greeting') html += stepGreeting();
  if(step==='customer') html += stepCustomer();
  if(step==='jobtype')  html += stepJobType();
  if(step==='subtype')  html += stepSubType();
  if(step==='details')  html += stepDetails();
  if(step==='schedule') html += stepSchedule();
  if(step==='upsell')   html += stepUpsell();
  if(step==='confirm')  html += stepConfirm();

  app.innerHTML = html;
  bindInputs();
  backBtn.textContent = t('back');
  nextBtn.textContent = (step==='confirm') ? t('save') : (step==='greeting' ? t('start') : t('next'));
  backBtn.onclick = goBack;
  nextBtn.onclick = goNext;
}
/* attach two-way binding for any [data-bind] inputs in the current view */
function bindInputs(){
  app.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input',()=>setPath(el.dataset.bind, el.value));
  });
}
function stepMsgSet(txt){ const e=document.getElementById('stepMsg'); if(e) e.textContent = txt||''; }

function coachCard(text){return `<div class="coach"><span class="tag">📞 ${t('say_this')}</span><div class="line">${text}</div></div>`;}
function tipCard(text){return `<div class="coach tip"><span class="tag">💡 ${t('tip')}</span><div class="line">${text}</div></div>`;}

function stepGreeting(){

function stepJobType(){

function jobChoice(v,emo,label){

function stepSubType(){
  const tipKey = booking.jobType==='auto'?'auto':booking.jobType==='res'?'res':'com';

  const items = list.map(([v,emo,en,es])=>{

  }).join('');

    `<p class="step-title">${t('subtype')}</p><div class="choices">${items}</div>`;

function stepDetails(){
  // Tone-matched: cheerful small talk for routine jobs, but keep-it-moving for emergencies.
  // Say-this ASKS for exactly what this step collects (job-aware): a car needs the
  // vehicle + address; a house/business just needs the address. The lockout empathy
  // already fired on the previous step, so here we keep it practical, not chit-chat.
  const msg = line('details', booking.jobType==='auto' ? SCRIPT.details_auto : SCRIPT.details_addr);
  let html = coachCard(msg);
  html += tipCard((booking.jobType==='auto' ? TIPS.details_auto : TIPS.location)[LANG]);
  if(booking.jobType==='auto'){
    // A car job needs vehicle ID: a VIN (auto-fills year/make/model) OR
    // year+make+model typed in. Ignition type is also required.
    html += `<label>${t('veh_id')}</label>
      <div class="vin-row">
        <input data-bind="vehicle.vin" id="f_vin" value="${esc(booking.vehicle.vin)}" placeholder="VIN — 17 characters" autocapitalize="characters" autocomplete="off">

      </div>
      <div class="vin-msg" id="vinMsg"></div>
      <div class="vin-or">— ${LANG==='es'?'O':'OR'} —</div>
      <div class="row2">
        <div><label>${t('veh_y')}</label><select id="f_vy" onchange="setVeh('year',this.value)">${TKS_YMM.yearOptionsHTML(booking.vehicle.year)}</select></div>
        <div><label>${t('veh_mk')}</label><select id="f_vmk" onchange="setVeh('make',this.value)">${TKS_YMM.makeOptionsHTML(booking.vehicle.make)}</select></div>
      </div>
      <label>${t('veh_md')}</label><select id="f_vmd" onchange="setVeh('model',this.value)">${TKS_YMM.modelOptionsHTML(booking.vehicle.make, booking.vehicle.year, booking.vehicle.model)}</select>

   6) FLOW ACTIONS
   ========================================================================= */
function setPath(path,val){
  const parts = path.split('.'); let o = booking;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function pickJobType(v){ booking.jobType=v; booking.subType=''; render(); }
function pickSub(v){ booking.subType=v; render(); }
function setIgnition(v){ booking.vehicle.ignition=v; render(); }
// Year/Make/Model cascade (model-driven, matches Start-a-Job): Year resets Make+Model; Make resets Model.
// VIN decode sets booking.vehicle.* then render() — the selects re-fill with those values (injected if not in catalog).
function setVeh(field,val){
  booking.vehicle[field]=val;
  if(field==='year'){ booking.vehicle.make=''; booking.vehicle.model=''; }
  else if(field==='make'){ booking.vehicle.model=''; }
  render();
}
function detailMsg(key, isBad){
  const m=document.getElementById('vinMsg');
  if(m){ m.className='vin-msg'+(isBad?' bad':''); m.textContent=key?t(key):''; }
}
/* Decode a VIN via the shared NHTSA helper and auto-fill year/make/model. */
function decodeVinNow(){
  const vin=(booking.vehicle.vin||'').trim();
  detailMsg('vin_decoding', false);
  if(!window.TKS || !TKS.decodeVin){ detailMsg('vin_bad', true); return; }
  TKS.decodeVin(vin).then(r=>{
    booking.vehicle.year=r.year||''; booking.vehicle.make=r.make||'';
    booking.vehicle.model=r.model||''; booking.vehicle.vin=r.vin||vin;
    render();
    const m=document.getElementById('vinMsg');
    if(m){ m.className='vin-msg'; m.textContent=`✓ ${booking.vehicle.year} ${booking.vehicle.make} ${booking.vehicle.model}`.trim(); }
  }).catch(()=>detailMsg('vin_bad', true));
}
function setUpsell(field,val){
  booking.upsell[field]=val;
  if(field==='offered' && val===false) booking.upsell.accepted=null;
  render();
}

function searchCust(q){
  const hits = document.getElementById('custHits'); if(!hits) return;
  q=(q||'').toLowerCase().trim();
  if(!q){ hits.innerHTML=''; return; }
  // search BOTH individual customers and business shops, via TKS (shared list)
  let all;
  try{ all = TKS.list('customers').concat(TKS.list('shops')); }
  catch(e){ all = readLS(K_CUSTOMERS, []).concat(readLS(K_SHOPS, [])); }
  const found = all.filter(c=>{
    const n=(c.customer||'').toLowerCase();   // Bittings stores the name under "customer"
    const p=(c.phone||'').toLowerCase();
    return n.includes(q)||p.includes(q);
  }).slice(0,5);
  hits.innerHTML = found.length
    ? found.map(c=>`<div class="cust-hit" onclick='useCust(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
        <b>${esc(c.customer||'')}</b><span>${esc(c.phone||'')}</span></div>`).join('')
    : `<div class="cust-hit" style="cursor:default"><span>${t('no_match')}</span></div>`;
}
function useCust(c){
  booking.customer.name  = c.customer || '';   // "customer" holds the name in Bittings
  booking.customer.phone = c.phone || '';
  booking.customer.email = c.email || '';
  if(c.address) booking.address = c.address;
  render();
}

/* Non-core categories (Safe & Vault, Emergency, Access control, Other) are booked
   "not in detail" — no SUBTYPES and no tailored upsell — so skip those two steps. */
function shouldSkipStep(step){
  return (step==='subtype' || step==='upsell') && !hasSub(booking.jobType);
}
function goBack(){
  if(stepIndex===0){ VIEW='home'; render(); return; }
  stepIndex--;
  while(stepIndex>0 && shouldSkipStep(STEPS[stepIndex])) stepIndex--;
  render();
}
function goNext(){
  const step = STEPS[stepIndex];
  if(!validateStep(step)) return;
  if(step==='confirm'){ saveBooking(); return; }
  stepIndex++;
  while(stepIndex < STEPS.length-1 && shouldSkipStep(STEPS[stepIndex])) stepIndex++;
  render();
}

/* required-field validation with red highlight (matches Bittings behavior) */
function validateStep(step){
  let ok=true;
  stepMsgSet('');
  function bad(id){ const el=document.getElementById(id); if(el){el.classList.add('field-err'); ok=false;} }
  if(step==='customer'){
    if(!booking.customer.name.trim()) bad('f_name');
    if(!booking.customer.phone.trim()) bad('f_phone');
  }
  if(step==='jobtype' && !booking.jobType){ ok=false; stepMsgSet(t('need_jobtype')); }
  // subtype + upsell are only required for the core categories that have them
  if(step==='subtype' && hasSub(booking.jobType) && !booking.subType){ ok=false; stepMsgSet(t('need_subtype')); }
  if(step==='upsell' && hasSub(booking.jobType)){
    if(booking.upsell.offered===null){ ok=false; stepMsgSet(t('need_upsell')); }
    else if(booking.upsell.offered===true && booking.upsell.accepted===null){ ok=false; stepMsgSet(t('need_upsell_acc')); }
  }
  if(step==='details'){
    if(!(booking.addr && (booking.addr.street||'').trim())) bad('f_street');   // street is the minimum for a usable address
    if(booking.jobType==='auto'){
      const v = booking.vehicle;
      const hasVin = /^[A-HJ-NPR-Z0-9]{17}$/.test((v.vin||'').toUpperCase());
      const hasYMM = (''+(v.year||'')).trim() && (v.make||'').trim() && (v.model||'').trim();
      if(!hasVin && !hasYMM){ bad('f_vin'); bad('f_vy'); bad('f_vmk'); bad('f_vmd'); detailMsg('vin_need', true); }
      else if(!v.ignition){ ok=false; detailMsg('ign_need', true);
        const ip=document.getElementById('ignPick'); if(ip){ ip.style.outline='2px solid #e0707a'; ip.style.borderRadius='12px'; } }
    }
  }
  if(step==='schedule'){
    if(!booking.date) bad('f_date');
    if(!booking.time) bad('f_time');
  }
  if(!ok){
    document.querySelectorAll('.field-err').forEach(el=>el.addEventListener('input',()=>el.classList.remove('field-err'),{once:true}));
  }
  return ok;
}

function saveBooking(){
  // 1) Upsert the customer through TKS (deduped by PHONE, then name) and grab
  //    the id so the booking is linked to a real customer record.
  let cust = null;
  const name = (booking.customer.name||'').trim();
  try{
    if(name) cust = TKS.Customers.upsert({
      customer: name,
      phone: (booking.customer.phone||'').trim(),
      email: (booking.customer.email||'').trim(),
      address: (booking.address||'').trim(),
      customerType: (booking.jobType==='com') ? 'business' : 'individual',
      source: 'scheduler'
    });
  }catch(e){ /* fall through to local save below */ }
  if(cust && cust.id) booking.customerId = cust.id;

  // 2) Auto-derive the canonical service category from the coaching tiles
  //    (no double entry for the trainee).
  try{ const sv = TKS.Services.fromJob(booking.jobType, booking.subType);
       booking.serviceCategory = sv.cat; booking.serviceLabel = sv.value; }catch(e){}
  if(!booking.status) booking.status = 'Scheduled';

  // 3) Save the booking through TKS (inserts new, or updates when editing).
  try{ TKS.Bookings.save(booking); }
  catch(e){
    const bookings = readLS(K_BOOKINGS, []);
    if(!booking.id) booking.id = 'bk_'+Date.now();
    const i = bookings.findIndex(x=>x.id===booking.id);
    if(i!==-1) bookings[i]=JSON.parse(JSON.stringify(booking)); else bookings.push(JSON.parse(JSON.stringify(booking)));
    writeLS(K_BOOKINGS, bookings);
  }
  VIEW='done'; render();
}

/* -------------------------------------------------------------------------
   SAVE CUSTOMER TO SHARED DATABASE  — matches Bittings exactly.
   Verified against bittings.html: a customer record is
     { customer, contact, phone, email, address, customerType, lastUsed }
   where the NAME is stored under "customer". Bittings finds an existing
   record by NAME (case-insensitive) and updates it; otherwise adds a new one
   and stamps lastUsed (the picker sorts by lastUsed). We mirror that so the
   scheduler and Bittings agree on what counts as the same customer.
   Business (commercial) jobs are tagged customerType "business"; everything
   else "individual".
   ------------------------------------------------------------------------- */
function saveCustomerToSharedDB(){
  const name = (booking.customer.name||'').trim();
  if(!name) return;
  const list = getCustomers();
  const custData = {
    customer: name,
    contact: '',
    phone: (booking.customer.phone||'').trim(),
    email: (booking.customer.email||'').trim(),
    address: (booking.address||'').trim(),
    customerType: (booking.jobType==='com') ? 'business' : 'individual'
  };
  const existing = list.find(c => (c.customer||'').toLowerCase() === name.toLowerCase());
  if(existing){ Object.assign(existing, custData); existing.lastUsed = Date.now(); }
  else{ list.push(Object.assign({}, custData, {lastUsed: Date.now()})); }
  saveCustomers(list);
}
/* tiny Bittings-compatible helpers (same keys/behaviour as bittings.html) */
function getCustomers(){ return readLS(K_CUSTOMERS, []); }
function saveCustomers(arr){ writeLS(K_CUSTOMERS, arr); }

/* =========================================================================
   7) CALENDAR LINKS  (one-tap add — free, no login)
   ========================================================================= */
function eventTimes(){
  const [y,m,d] = booking.date.split('-').map(Number);
  const [hh,mm] = (booking.time||'09:00').split(':').map(Number);
  const start = new Date(y, m-1, d, hh, mm);
  const end   = new Date(start.getTime() + (booking.duration*60000));
  return {start,end};
}
function eventTitle(){
  const sub = subLabel(booking.jobType, booking.subType);
  return `${sub} — ${booking.customer.name||'Customer'}`;
}
function eventDetails(){
  const veh = booking.vehicle.make ? `\nVehicle: ${booking.vehicle.year} ${booking.vehicle.make} ${booking.vehicle.model} ${booking.vehicle.vin}` : '';
  return `Customer: ${booking.customer.name}\nPhone: ${booking.customer.phone}${veh}\n${booking.notes||''}`.trim();
}
function eventLocation(){ return booking.address || booking.parked || ''; }

/* Open Google Calendar so he can see what's already booked before picking a time.
   If a date is already chosen, jump straight to that day's view. */
function calendarViewUrl(){
  const base='https://calendar.google.com/calendar/r';
  if(booking.date){
    const [y,m,d]=booking.date.split('-').map(Number);
    return `${base}/day/${y}/${m}/${d}`;
  }
  return base;
}
function openCalendar(){ window.open(calendarViewUrl(), '_blank', 'noopener'); }

/* =========================================================================
   7b) BACKUP & RESTORE  (free, no cloud)
   Export saves all contacts + bookings to a file. Import MERGES a file back
   in — it only ADDS what's missing (matched by phone / booking id) and never
   deletes what's already there, so it's safe to run anytime.
   ========================================================================= */
function exportData(){
  const data = {
    _app:'turbo-scheduler', _version:1, _exported:new Date().toISOString(),
    customers: readLS(K_CUSTOMERS, []),
    shops:     readLS(K_SHOPS, []),
    bookings:  readLS(K_BOOKINGS, [])
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='turbo-scheduler-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
/* merge a list of {customer,...} records by name (case-insensitive), Bittings-style */
function mergeByName(key, incoming){
  const list = readLS(key, []);
  const have = new Set(list.map(c=>(c.customer||'').toLowerCase()).filter(Boolean));
  let added=0;
  (incoming||[]).forEach(c=>{
    const n=(c.customer||'').toLowerCase();
    if(n && have.has(n)) return;
    list.push(c); if(n) have.add(n); added++;
  });
  writeLS(key, list); return added;
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      let addedC = mergeByName(K_CUSTOMERS, data.customers);
      addedC    += mergeByName(K_SHOPS, data.shops);
      // merge bookings by id
      const bks=readLS(K_BOOKINGS,[]);
      const haveB=new Set(bks.map(b=>b.id).filter(Boolean));
      let addedB=0;
      (data.bookings||[]).forEach(b=>{
        if(b.id && haveB.has(b.id)) return;
        bks.push(b); if(b.id) haveB.add(b.id); addedB++;
      });
      writeLS(K_BOOKINGS, bks);
      alert(`${t('bk_restored')} ${addedC} ${t('bk_contacts')}, ${addedB} ${t('bk_bookings')}.`);
      render();
    }catch(e){ alert(t('bk_badfile')); }
  };
  r.readAsText(file);
}

function pad(n){return String(n).padStart(2,'0');}
function fmtCompact(dt){ return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`; }
function fmtOutlook(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}:00`; }
function googleUrl(){
  if(!booking.date||!booking.time) return '#';
  const {start,end}=eventTimes();
  const p = new URLSearchParams({
    action:'TEMPLATE', text:eventTitle(),
    dates:`${fmtCompact(start)}/${fmtCompact(end)}`,
    details:eventDetails(), location:eventLocation(),
    ctz:'America/Chicago',
    add:'turbokeysmith@gmail.com'   // business calendar is invited as guest / system of record
  });
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function outlookUrl(){
  if(!booking.date||!booking.time) return '#';
  const {start,end}=eventTimes();
  const p = new URLSearchParams({
    path:'/calendar/action/compose', rru:'addevent',
    subject:eventTitle(), startdt:fmtOutlook(start), enddt:fmtOutlook(end),
    body:eventDetails(), location:eventLocation()
  });
  return 'https://outlook.live.com/calendar/0/deeplink/compose?'+p.toString();
}
function downloadICS(){
  if(!booking.date||!booking.time){ alert(t('err')); return; }
  const {start,end}=eventTimes();
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+(bizName().replace(/[^\x20-\x7E]/g,'')||'Locksmith')+'//Scheduler//EN','BEGIN:VEVENT',
    'UID:'+(booking.id||Date.now())+'@turbokeysmith',
    'DTSTAMP:'+fmtCompact(new Date()),
    'DTSTART:'+fmtCompact(start),
    'DTEND:'+fmtCompact(end),
    'SUMMARY:'+icsEsc(eventTitle()),
    'DESCRIPTION:'+icsEsc(eventDetails()),
    'LOCATION:'+icsEsc(eventLocation()),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics],{type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'turbokeysmith-booking.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}

/* =========================================================================
   8) SMALL HELPERS
   ========================================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function subLabel(type,sub){
  const list = SUBTYPES[type]||[]; const row = list.find(r=>r[0]===sub);
  if(!row){
    // no-detail category (or unknown sub): fall back to the shared category label
    try{ if(window.TKS&&TKS.ServiceCats){ return TKS.ServiceCats.label(TKS.ServiceCats.codeToKey(type), LANG); } }catch(e){}
    return type||'';
  }
  return LANG==='es'?row[3]:row[2];
}
function fmt12(t24){
  if(!t24) return '';
  let [h,m]=t24.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12;
  return `${h}:${pad(m)} ${ap}`;
}
function prettyDate(iso){
  if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString(LANG==='es'?'es-US':'en-US',{weekday:'short',month:'short',day:'numeric'});
}

/* =========================================================================
   9) BOOT
   ========================================================================= */
document.getElementById('langToggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  LANG=b.dataset.lang; writeLS(K_LANG, LANG); render();
});

/* ---- dark mode ----
   The theme is already set on <html> by the small script in the <head>
   (so there's no white flash). Here we just sync the button icon and
   handle taps. Sun = currently dark (tap to go light); moon = the reverse. */
function syncThemeIcon(){
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  writeLS(K_THEME, next);
  syncThemeIcon();
});
syncThemeIcon();

/* Cloud bootstrap — connect to Supabase ONLY if a staff member is already
   signed in (session shared with the staff app via cloud-test.html). Otherwise
   stay on localStorage. Re-render when the cloud finishes hydrating. */
if(window.TKS && TKS.onChange) TKS.onChange(function(){ render(); });
(function schedCloudBootstrap(){
  var cfg = window.TKS_CLOUD;
  if(!cfg || !cfg.AUTO_CONNECT) return;
  if(!window.supabase || !window.supabase.createClient) return;   // library blocked/offline
  var probe;
  try{ probe = window.supabase.createClient(cfg.url, cfg.anonKey); }catch(e){ return; }
  probe.auth.getSession().then(function(res){
    if(!res || !res.data || !res.data.session) return;            // not signed in -> stay local
    TKS.connectCloud({ url:cfg.url, anonKey:cfg.anonKey }).then(function(){ render(); }).catch(function(){});
  }).catch(function(){});
})();

render();
</script>
