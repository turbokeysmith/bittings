  const hasDiscount = t.discount>0;
  if(t.tax>0 || t.surcharge>0 || hasDiscount || r.taxExempt){
    // Show gross subtotal + discount when a discount exists
    if(hasDiscount){
      sub+='<div class="rc-subrow"><span>Subtotal</span><span>'+money(t.grossSubtotal)+'</span></div>';
      sub+='<div class="rc-subrow"><span>Discount</span><span style="color:#22994A">−'+money(t.discount)+'</span></div>';
    }
    if(t.tax>0){
      sub+='<div class="rc-subrow"><span>Taxable portion</span><span>'+money(t.taxableAfter)+'</span></div>';
      if(t.nontaxAfter>0) sub+='<div class="rc-subrow"><span>Non-taxable</span><span>'+money(t.nontaxAfter)+'</span></div>';
      if(!hasDiscount) sub+='<div class="rc-subrow"><span>Subtotal</span><span>'+money(t.subtotal)+'</span></div>';
      sub+='<div class="rc-subrow"><span>Sales Tax ('+t.taxRate+'%)</span><span>'+money(t.tax)+'</span></div>';
    }
    if(r.taxExempt && !(t.tax>0)) sub+='<div class="rc-subrow"><span>Sales Tax</span><span>EXEMPT</span></div>';   // 8z78
    if(t.surcharge>0){
      sub+='<div class="rc-subrow"><span>Card Surcharge ('+t.surchargeRate+'%)</span><span>'+money(t.surcharge)+'</span></div>';
    }
  }
  const docLbl = r.docType==="invoice"?"INVOICE":r.docType==="estimate"?"ESTIMATE":"RECEIPT";
  const subline = r.docType==="invoice"?"Due upon receipt":r.docType==="estimate"?"Valid for 30 days":"";
  const numLabel = r.docType==="invoice"?"Invoice #":r.docType==="estimate"?"Estimate #":"Receipt #";

  let statusLine = "";
  if(r.docType==="receipt"){
    statusLine='<div class="rc-pm">Payment: '+escapeHtml(r.payment||"")+'</div>'+
               '<div class="rc-st" style="color:'+sColor+'">Status: '+escapeHtml((status||"").toUpperCase())+'</div>';
    if(status==="Partial Payment" && r.amountPaid!=null && r.amountPaid!==""){
      const _bal=Math.max(0, Math.round(((t.total||0)-Number(r.amountPaid))*100)/100);
      statusLine+='<div class="rc-pm">Paid: '+money(r.amountPaid)+' · Balance due: '+money(_bal)+'</div>';
    }
  }else if(r.docType==="invoice"){
    statusLine='<div class="rc-pm">Expected payment: '+escapeHtml(r.payment||"Not specified")+'</div>'+
               '<div class="rc-st" style="color:var(--amber)">Status: UNPAID — DUE UPON RECEIPT</div>';
  }else{
    statusLine='<div class="rc-st" style="color:#595959">ESTIMATE — Valid 30 days from issue</div>';
  }

  const isContracting = r.nastf && r.nastf.type==="Contracting D1";
  const isAuctionFleet = r.nastf && r.nastf.type==="Auction/Fleet D1";

  let billTo = '<div class="rc-line">'+(isContracting?"Shop":"Customer")+': '+escapeHtml(r.customer||"")+'</div>';
  if(r.contact) billTo+='<div class="rc-line">'+(isContracting?"Manager":"Contact")+': '+escapeHtml(r.contact)+'</div>';
  if(r.phone)   billTo+='<div class="rc-line">Phone: '+escapeHtml(r.phone)+'</div>';
  if(r.email)   billTo+='<div class="rc-line">Email: '+escapeHtml(r.email)+'</div>';
  if(r.address) billTo+='<div class="rc-line">Address: '+escapeHtml(r.address)+'</div>';
  {const _w=whereLine(r); if(_w) billTo+='<div class="rc-line">'+escapeHtml(_w)+'</div>';}   // 8z78
  {const _v=vehicleString(r); if(_v) billTo+='<div class="rc-line">Vehicle: '+escapeHtml(_v)+'</div>';}
  if(r.vin)     billTo+='<div class="rc-line">VIN: '+escapeHtml(r.vin)+'</div>';
  moreVehList(r).forEach(function(l,i){ billTo+='<div class="rc-line">Vehicle '+(i+2)+': '+escapeHtml(l)+'</div>'; });   // 8z84
  {const _d=d1Of(r); if(_d.color) billTo+='<div class="rc-line">Color: '+escapeHtml(_d.color)+'</div>';   // 8z90
   if(_d.plate) billTo+='<div class="rc-line">Plate: '+escapeHtml(_d.plate)+'</div>';
   if(_d.odometer && !r.nastf) billTo+='<div class="rc-line">Miles: '+escapeHtml(_d.odometer)+'</div>'; }
  if(r.odometer!==undefined && r.odometer!=="") billTo+='<div class="rc-line">Odometer: '+escapeHtml(r.odometer)+'</div>';
  if(r.dlNumber)billTo+='<div class="rc-line">DL #: '+escapeHtml(r.dlNumber)+'</div>';

  // Auction/Fleet D1 — service location + authorizing party block (audit-required)
  let nastfBlock = "";
  if(isAuctionFleet){
    nastfBlock += '<div class="rc-sec" style="margin-top:14px;">AUTHORIZING PARTY (NASTF)</div>';
    if(r.jobLocation)     nastfBlock+='<div class="rc-line">Service Location: '+escapeHtml(r.jobLocation)+'</div>';
    if(r.requesterName)   nastfBlock+='<div class="rc-line">Authorized by: '+escapeHtml(r.requesterName)+'</div>';
    if(r.requesterCompany)nastfBlock+='<div class="rc-line">Company: '+escapeHtml(r.requesterCompany)+'</div>';
    if(r.requesterPhone)  nastfBlock+='<div class="rc-line">Phone: '+escapeHtml(r.requesterPhone)+'</div>';
    if(r.requesterEmail)  nastfBlock+='<div class="rc-line">Email: '+escapeHtml(r.requesterEmail)+'</div>';
  }
  // Contracting D1 — vehicle owner block (recorded for our protection; not the bill-to)
  if(isContracting){
    nastfBlock += '<div class="rc-sec" style="margin-top:14px;">VEHICLE OWNER (NASTF record)</div>';
    if(r.voName)        nastfBlock+='<div class="rc-line">Name: '+escapeHtml(r.voName)+'</div>';
    if(r.voPhone)       nastfBlock+='<div class="rc-line">Phone: '+escapeHtml(r.voPhone)+'</div>';
    if(r.voCity||r.voState) nastfBlock+='<div class="rc-line">Location: '+escapeHtml([r.voCity,r.voState].filter(Boolean).join(", "))+'</div>';
    if(r.voDocVerified) nastfBlock+='<div class="rc-line">Ownership doc verified: '+escapeHtml(r.voDocVerified)+'</div>';
    if(r.voDLMatch)     nastfBlock+='<div class="rc-line">DL name matches ownership doc: '+escapeHtml(r.voDLMatch)+'</div>';
  }
  if(r.nastf) nastfBlock += '<div class="rc-line" style="color:#595959;font-style:italic;margin-top:6px;">NASTF Type: '+escapeHtml(r.nastf.type)+'</div>';

  return '<div class="receipt-card">'+
     '<div class="rc-head">'+
       '<img src="'+SETTINGS.logo+'">'+
       '<div class="t"><b>'+escapeHtml(SETTINGS.name)+'</b>'+
         '<span>'+escapeHtml(SETTINGS.address)+'</span>'+
         '<span>'+escapeHtml(SETTINGS.phone)+(SETTINGS.email?'  |  '+escapeHtml(SETTINGS.email):'')+'</span></div>'+
       '<div class="rt">'+docLbl+'<span>'+escapeHtml(r.number)+'<br>'+escapeHtml(r.date)+(subline?'<br>'+escapeHtml(subline):'')+'</span></div>'+
     '</div>'+
     '<div class="rc-body">'+
       '<div class="rc-sec">BILL TO</div>'+billTo+
       nastfBlock+
       '<div class="rc-items">'+
         '<div class="rc-sec" style="margin-top:6px;">'+escapeHtml((r.serviceType||"").toUpperCase())+' SERVICE</div>'+
         '<div class="rc-ihead"><span>DESCRIPTION</span><span>AMOUNT</span></div>'+
         itemRows+
       '</div>'+
       '<div class="rc-tot">'+sub+
         '<div class="rc-totrow"><span>Total:</span><span>'+money(t.total)+'</span></div>'+
         statusLine+
       '</div>'+
       (function(){
          const term=warrantyTermText(r), pill=warrantyPillHTML(r), tu=configTermsUrl();
          const line1=[ term?('<span style="font-weight:700;color:#1f8f43">'+escapeHtml(term)+'</span>'):'', pill ].filter(Boolean).join('&nbsp;&nbsp;');
          const terms = tu?('<div style="font-size:11.5px;color:#5a616c;margin-top:4px">Terms &amp; Conditions: <a href="'+escapeHtml(termsHref(tu))+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+escapeHtml(termsDisplay(tu))+'</a></div>'):'';
          return (line1||terms)?('<div style="margin-top:8px">'+line1+terms+'</div>'):'';
       })()+
       (r.notes?'<div class="rc-notes">Notes: '+escapeHtml(r.notes)+'</div>':'')+
       (function(){ const L=exemptLines(r); return L.length?('<div class="rc-notes" style="font-style:normal"><b>'+escapeHtml(L[0])+'</b><br>'+L.slice(1).map(escapeHtml).join('<br>')+'</div>'):''; })()+
     '</div>'+
     (actionsHTML||'')+
   '</div>';
}
/* Append the receipt card to the results surface (with the My Copy / Customer / Español / Share buttons). */
function renderReceiptCard(r){
  const actions='<div class="rc-actions">'+
       '<button data-lang="en" data-copy="mine" title="Your full copy with NASTF audit fields">My Copy</button>'+
       '<button data-lang="en" data-copy="customer" title="Customer-facing copy (NASTF fields hidden)">Customer Copy</button>'+
       '<button data-lang="es" data-copy="customer" title="Customer Copy in Spanish">Español</button>'+
       '<button data-share="1" data-lang="en" data-copy="customer" title="Send via the share sheet — pick Messages, Mail, etc.; attaches the PDF">📤 Share</button>'+
     '</div>';
  const card=document.createElement("div");
  card.className="res-card";
  card.innerHTML=buildReceiptCardHTML(r, actions);
  chat.appendChild(card);
  card.querySelectorAll(".rc-actions button").forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.share === "1"){
        shareDocument(r, b.dataset.lang || "en", b.dataset.copy === "customer");
      }else{
        makePDF(r, b.dataset.lang||"en", b.dataset.copy==="customer");
      }
    };
  });
  scrollDown();
}

/* ==========================================================
   SHARE SHEET (Web Share API)
   ----------------------------------------------------------
   shareDocument(r, lang, forCustomer) — generate the PDF as a Blob and
   hand it to the OS share sheet (iOS: AirDrop/Messages/Mail/etc.,
   Android: SMS/Gmail/WhatsApp/etc.). Falls back to download + a hint
   message when the browser doesn't support sharing files.
   ========================================================== */
function shareDocument(r, lang, forCustomer){
  lang = lang || "en";
  // Spanish is always customer-facing
  if(lang === "es") forCustomer = true;
  let result;
  try {
    result = makePDF(r, lang, forCustomer, true);  // 4th arg true => return blob
  } catch(err){
    appAlert("Couldn't build PDF", err.message || "Unknown error");
    return;
  }
  if(!result || !result.blob){
    appAlert("Couldn't build PDF", "Try the download buttons instead.");
    return;
  }
  const file = new File([result.blob], result.filename, {type: "application/pdf"});
  const docLabelText = docLabel(r.docType);
  const cust = r.customer || "";
  const shareData = {
    files: [file],
    title: docLabelText + " " + r.number,
    text: docLabelText + " from " + (SETTINGS.name || "your locksmith") +
          (cust ? " for " + cust : "")
  };
  // Feature detection: not all browsers support sharing files. Test with
  // canShare before calling share, since calling share() on an unsupported
  // browser can throw or just silently do nothing.
  const canShareFiles = (
    typeof navigator !== "undefined" &&
    navigator.canShare &&
    navigator.canShare({files: [file]})
  );
  if(canShareFiles){
    navigator.share(shareData).then(()=>{
      // success — no toast needed, the OS handled it
    }).catch(err=>{
      // User cancelled the share sheet — that's not an error to surface
      if(err && err.name === "AbortError") return;
      // Real failure — give them a useful next step
      appAlert("Share didn't complete",
        "Couldn't open the share sheet. You can still tap a download button to save the PDF.");
    });
  }else{
    // Fallback: download the file and let the user know
    const a = document.createElement("a");
    a.href = URL.createObjectURL(result.blob);
    a.download = result.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    appAlert("Share not supported here",
      "This browser doesn't support file sharing. The PDF was downloaded instead — open it from your Files/Downloads to share manually.");
  }
}

/* ==========================================================
   PDF GENERATION
   ========================================================== */
function makePDF(r, lang, forCustomer){
  r=docWithVehicles(r);   // 8z84
  lang = lang || "en";
  // Spanish is always customer-facing
  if(lang === "es") forCustomer = true;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const W=612;
  const DARK=[42,42,42], RED=[200,50,50], LIGHT=[245,245,245];
  const GREEN=[34,153,74], AMBER=[217,138,0], GRAY=[115,115,115];
  const t=r.totals;

  // ---- header bar ----
  doc.setFillColor(...DARK); doc.rect(0,0,W,160,"F");
  // Logo, fit inside a 120x96 box preserving aspect (never stretched).
  try{ if(SETTINGS.logo){
    let lw=96, lh=96;
    try{ const ip=doc.getImageProperties(SETTINGS.logo); const ar=(ip.width||1)/(ip.height||1);
      const boxW=120, boxH=96; if(ar>=boxW/boxH){ lw=boxW; lh=Math.round(boxW/ar); } else { lh=boxH; lw=Math.round(boxH*ar); } }catch(_){}
    doc.addImage(SETTINGS.logo,"PNG",40,32+Math.max(0,(96-lh)/2),lw,lh);
  } }catch(e){}
  doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255); doc.setFontSize(22);
  doc.text(SETTINGS.name, 175, 70, {maxWidth:300});
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(216,216,216);
  let ay=92;
  if(SETTINGS.address){ doc.text(SETTINGS.address,175,ay,{maxWidth:300}); ay+=13; }
  const cline=[SETTINGS.phone,SETTINGS.email].filter(Boolean).join("  |  ");
  if(cline){ doc.text(cline,175,ay,{maxWidth:300}); ay+=13; }
  if(SETTINGS.license){ doc.text(SETTINGS.license,175,ay,{maxWidth:300}); }

  // doc label + meta
  const lbl = tr(docLabel(r.docType), lang);
  const numLbl = tr(r.docType==="invoice"?"Invoice #":r.docType==="estimate"?"Estimate #":"Receipt #", lang);
  doc.setFont("helvetica","bold"); doc.setFontSize(19);
  doc.setTextColor(...(r.docType==="estimate"?GRAY:RED));
  doc.text(lbl, 572, 70, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(216,216,216);
  doc.text(numLbl+": "+r.number, 572, 90, {align:"right"});
  doc.text(tr("Date",lang)+": "+r.date, 572, 103, {align:"right"});
  const subline = r.docType==="invoice" ? tr("Due upon receipt",lang)
                : r.docType==="estimate" ? tr("Valid for 30 days",lang) : "";
  if(subline){ doc.text(subline, 572, 116, {align:"right"}); }

  // ---- BILL TO ----
  const isContractingP = r.nastf && r.nastf.type==="Contracting D1";
  const isAuctionFleetP = r.nastf && r.nastf.type==="Auction/Fleet D1";
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...RED);
  doc.text(tr(isContractingP?"BILL TO (CONTRACTING SHOP)":"BILL TO", lang),40,191);
  doc.setLineWidth(1.5); doc.setDrawColor(...RED); doc.line(40,197,225,197);
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(50,50,50);
  let yy=216;
  function bl(label, val){
    if(val===undefined||val===""||val===null) return;
    // advance the cursor by the ACTUAL number of wrapped lines so the next field never overlaps
    var _lines=doc.splitTextToSize(tr(label,lang)+": "+val, 260);
    for(var _i=0;_i<_lines.length;_i++){ doc.text(_lines[_i], 40, yy); yy+=15; }
  }
  bl(isContractingP?"Shop":"Customer", r.customer);
  bl(isContractingP?"Manager":"Contact", r.contact);
  bl("Phone", r.phone);
  bl("Email", r.email);
  bl("Address", r.address);
  if(r.serviceWhere==="shop") bl("Service", "In shop"+((SETTINGS&&SETTINGS.address)?(" — "+SETTINGS.address):"")); else if(r.serviceWhere==="mobile") bl("Service", "Mobile (we come to you)");   // 8z78
  bl("Vehicle", vehicleString(r));
  bl("VIN", r.vin);
  moreVehList(r).forEach(function(l,i){ bl("Vehicle "+(i+2), l); });   // 8z84
  // DL #, Plate, Odometer are NASTF audit fields — hide from customer copy
  if(!forCustomer){
    bl("DL #", r.dlNumber);
    { const _d=d1Of(r); bl("Color", _d.color); bl("Plate", _d.plate); if(_d.odometer!=="") bl("Odometer", _d.odometer); }   // 8z90
  }

  // ---- NASTF-specific blocks ----
  // Auction/Fleet authorizing-party block: audit data, hide from customer copy
  if(isAuctionFleetP && !forCustomer){
    yy+=8;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...RED);
    doc.text("AUTHORIZING PARTY",40,yy); yy+=4;
    doc.setLineWidth(0.8); doc.line(40,yy,200,yy); yy+=12;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(50,50,50);
    bl("Service Location", r.jobLocation);
    bl("Authorized by", r.requesterName);
    bl("Company", r.requesterCompany);
    bl("Auth. Phone", r.requesterPhone);
    bl("Auth. Email", r.requesterEmail);
  }
  // Contracting vehicle-owner block: audit data, hide from customer copy
  if(isContractingP && !forCustomer){
    yy+=8;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...RED);
    doc.text("VEHICLE OWNER",40,yy); yy+=4;
    doc.setLineWidth(0.8); doc.line(40,yy,200,yy); yy+=12;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(50,50,50);
    bl("Name", r.voName);
    bl("Phone", r.voPhone);
    if(r.voCity||r.voState) bl("Location", [r.voCity,r.voState].filter(Boolean).join(", "));
    bl("Ownership Doc Verified", r.voDocVerified);
    bl("DL Matches Ownership", r.voDLMatch);
  }
  // NASTF type footer: hide from customer copy
  if(r.nastf && !forCustomer){
    yy+=4;
    doc.setFont("helvetica","oblique"); doc.setFontSize(8.5); doc.setTextColor(120,120,120);
    doc.text("NASTF: "+r.nastf.type, 40, yy); yy+=10;
  }

  // section heading
  let secY=Math.max(yy+15, 285);
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...RED);
  const secTitle = tr((r.serviceType||"").toUpperCase()+" SERVICE", lang);
  doc.text(secTitle,40,secY);
  doc.line(40,secY+6,40+doc.getTextWidth(secTitle)+15,secY+6);

  // items table header
  let tY=secY+22;
  doc.setFillColor(...DARK); doc.setDrawColor(...RED); doc.setLineWidth(1);
  doc.rect(40,tY,532,22,"FD");
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(255,255,255);
  doc.text(tr("DESCRIPTION",lang),50,tY+15);
  doc.text(tr("AMOUNT",lang),562,tY+15,{align:"right"});

  let rY=tY+22;
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  r.items.forEach((it,i)=>{
    doc.setFillColor(...(i%2===0?LIGHT:[255,255,255]));
    doc.setDrawColor(...RED); doc.rect(40,rY,532,22,"FD");
    if(it.isDiscount){
      doc.setTextColor(...GREEN);
      const lbl = it.discountMode==="percent" ? tr("Discount",lang)+" ("+it.discountValue+"%)" : tr("Discount",lang);
      doc.text(lbl,50,rY+15);
      doc.text("-"+money(t.discount),562,rY+15,{align:"right"});
    }else{
      const nd=!!it.declined, _dq=parseInt(it.declinedQty,10)||0;   // 8r: not-done lines → grey, struck, $0
      doc.setTextColor(...(nd?[150,150,150]:[50,50,50]));
      let d=it.desc; const maxW=nd?300:(_dq>0?330:420);
      while(doc.getTextWidth(d)>maxW && d.length>4){ d=d.slice(0,-2); }
      if(d!==it.desc) d=d.trim()+"...";
      doc.text(d,50,rY+15);
      if(nd || _dq>0){
        const w=doc.getTextWidth(d);
        if(nd){ doc.setDrawColor(150,150,150); doc.setLineWidth(0.8); doc.line(50,rY+11.5,50+w,rY+11.5); }
        doc.setFontSize(8); doc.setTextColor(179,36,47);
        let note=(lang==="es"?"no realizado":"not done"); if(!nd) note=_dq+" "+(lang==="es"?"de":"of")+" "+(_dq+(parseInt(it.qty,10)||0))+" "+note;
        if(it.declineReason) note+=" — "+it.declineReason;
        while(doc.getTextWidth(note)>(430-w) && note.length>6){ note=note.slice(0,-2); }
        doc.text(note,50+w+6,rY+15); doc.setFontSize(10.5); doc.setTextColor(...(nd?[150,150,150]:[50,50,50]));
      }
      doc.text(money(nd?0:it.amount),562,rY+15,{align:"right"});
    }
    rY+=22;
  });

  let toY=rY+22;
  doc.setFontSize(10);
  const hasDiscountP = t.discount>0;
  if(t.tax>0 || t.surcharge>0 || hasDiscountP || r.taxExempt){
    doc.setFont("helvetica","normal"); doc.setTextColor(...GRAY);
    if(hasDiscountP){
      doc.text(tr("Subtotal",lang),306,toY);
      doc.text(money(t.grossSubtotal),562,toY,{align:"right"}); toY+=15;
      doc.setTextColor(...GREEN);
      doc.text(tr("Discount",lang),306,toY);
      doc.text("-"+money(t.discount),562,toY,{align:"right"}); toY+=15;
      doc.setTextColor(...GRAY);
    }
    if(t.tax>0){
      doc.text(tr("Parts (taxable)",lang),306,toY);
      doc.text(money(t.taxableAfter),562,toY,{align:"right"}); toY+=15;
      if(t.nontaxAfter>0){
        doc.text(tr("Labor / Service",lang),306,toY);
        doc.text(money(t.nontaxAfter),562,toY,{align:"right"}); toY+=15;
      }
      if(!hasDiscountP){
        doc.text(tr("Subtotal",lang),306,toY);
        doc.text(money(t.subtotal),562,toY,{align:"right"}); toY+=15;
      }
      doc.text(tr("Sales Tax",lang)+" ("+t.taxRate+"%)",306,toY);
      doc.text(money(t.tax),562,toY,{align:"right"}); toY+=15;
    }
    if(r.taxExempt && !(t.tax>0)){ doc.text(tr("Sales Tax",lang),306,toY); doc.text("EXEMPT",562,toY,{align:"right"}); toY+=15; }   // 8z78
    if(t.surcharge>0){
      doc.text(tr("Card Surcharge",lang)+" ("+t.surchargeRate+"%)",306,toY);
      doc.text(money(t.surcharge),562,toY,{align:"right"}); toY+=8;
    }else{ toY-=7; }
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.8);
    doc.line(306,toY,572,toY); toY+=16;
  }
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(50,50,50);
  doc.text(tr("Total",lang)+":",306,toY);
  doc.text(money(t.total),562,toY,{align:"right"});

  // status / payment
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...GRAY);
  if(r.docType==="receipt"){
    doc.text(tr("Payment Method",lang)+": "+tr(r.payment||"",lang),306,toY+20);
    const sc=r.status==="Paid in Full"?GREEN:r.status==="Unpaid"?RED:AMBER;
    doc.setFont("helvetica","bold"); doc.setTextColor(...sc);
    doc.text(tr("Status",lang)+": "+tr((r.status||"").toUpperCase(),lang),306,toY+35);
    if(r.status==="Partial Payment" && r.amountPaid!=null && r.amountPaid!==""){
      const _bal=Math.max(0, Math.round(((t.total||0)-Number(r.amountPaid))*100)/100);
      doc.setFont("helvetica","normal"); doc.setTextColor(...GRAY);
      doc.text(tr("Amount Paid",lang)+": "+money(r.amountPaid)+"   "+tr("Balance Due",lang)+": "+money(_bal),306,toY+49);
    }
  }else if(r.docType==="invoice"){
    if(r.payment) doc.text(tr("Payment Method",lang)+": "+tr(r.payment,lang),306,toY+20);
    doc.setFont("helvetica","bold"); doc.setTextColor(...AMBER);
    doc.text(tr("Status",lang)+": "+tr("UNPAID",lang)+" — "+tr("Due upon receipt",lang).toUpperCase(),306,toY+35);
  }

  // warranty (customer-facing, no date) — right column under the status; receipts & invoices only
  const _warrText = warrantyTermText(r);
  if(_warrText){
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...GREEN);
    doc.text(_warrText, 306, toY+52);
  }

  // notes
  if(r.notes){
    let nY = toY + 60;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(50,50,50);
    doc.text(tr("Notes",lang)+":",40,nY);
    doc.setFont("helvetica","normal"); doc.setTextColor(80,80,80);
    doc.text(r.notes,40,nY+14,{maxWidth:520});
  }
  // 8z78: the exemption this sale relied on (left column, small print, above the signature)
  { const L=exemptLines(r);
    if(L.length){ let eY = toY + 60 + (r.notes ? (28 + 12*Math.max(1, doc.splitTextToSize(String(r.notes),520).length)) : 0); if(eY>600) eY=600;
      doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(50,50,50); doc.text(L[0],40,eY); eY+=11;
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(90,90,90);
      L.slice(1).forEach(function(line){ const parts=doc.splitTextToSize(String(line),250); parts.forEach(function(p){ if(eY<650){ doc.text(p,40,eY); eY+=9; } }); }); } }

  // signature
  if(r.signature){
    let sY = 660;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(80,80,80);
    doc.text(tr("Customer Signature",lang)+":",40,sY);
    if(r.signature==="LINE"){
      doc.setDrawColor(80,80,80); doc.setLineWidth(0.8);
      doc.line(40,sY+45,300,sY+45);
      doc.setFontSize(8); doc.setTextColor(150,150,150);
      doc.text(tr("Signature",lang),40,sY+57);
    }else{
      try{ doc.addImage(r.signature,"PNG",40,sY+5,260,60); }catch(e){}
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(140,140,140);
    const _authShop=(SETTINGS.name||"the shop"), _authTu=configTermsUrl();
    const _authTxt=_authTu
      ? ("By signing, the customer authorized the work described and agreed to "+_authShop+"'s Terms & Conditions ("+termsDisplay(_authTu)+").")
      : "By signing, the customer authorized the work described.";
    doc.text(_authTxt,40,sY+78,{maxWidth:520});
  }

  // footer
  doc.setFillColor(...DARK); doc.rect(0,742,W,50,"F");
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(180,180,180);
  const _footerTail = (SETTINGS.footer||'').trim() || tr("Insured & Bonded",lang);   // owner-configured receipt footer (Setup) or the default
  const footerLine1 = [SETTINGS.name, SETTINGS.license, _footerTail].filter(Boolean).join("  |  ");
  doc.text(footerLine1, W/2, 765, {align:"center"});
  doc.text(tr("Thank you for choosing",lang)+" "+SETTINGS.name+"!", W/2, 777, {align:"center"});

  const langSuffix = lang==="es" ? "_ES" : "";
  const copySuffix = forCustomer ? "_Customer" : "";
  const filename = docLabel(r.docType).charAt(0)+docLabel(r.docType).slice(1).toLowerCase()+"_"+r.number+copySuffix+langSuffix+".pdf";
  // When called with returnBlob=true (4th arg), return {blob,filename} instead of triggering a download.
  // This lets shareDocument() hand the bytes directly to the Web Share API.
  if(arguments.length >= 4 && arguments[3] === true){
    return { blob: doc.output("blob"), filename: filename };
  }
  doc.save(filename);
}

   HISTORY PANEL
   ========================================================== */
function setHistFilter(f){
  histFilter=f;
  document.querySelectorAll(".hist-filter button").forEach(b=>{
    b.classList.toggle("active", b.dataset.f===f);
  });
  try{ document.querySelector("#histPanel .pp-head b").textContent=(f==="estimate")?"Estimates":"History"; }catch(e){}   // 8z78
  renderHistList();
}
function openHist(){ renderHistList(); document.getElementById("histPanel").classList.add("open"); }
function closeHist(){ document.getElementById("histPanel").classList.remove("open"); }
function renderHistList(){
  const list=document.getElementById("histList");
  let hist=getHistory();
  { // 8z81: an estimate that became an invoice / receipt is not listed any more — only the document it became
    const conv={}; hist.forEach(x=>{ if(x && x.fromEstimate) conv[x.fromEstimate]=1; });
    hist=hist.filter(r=>!((r.docType||"receipt")==="estimate" && conv[r.number])); }
  if(histFilter!=="all"){ hist=hist.filter(r=> (r.docType||"receipt")===histFilter); }
  // 8z78: search + (for estimates) which ones are already on the schedule
  const _hq=((document.getElementById("histSearch")||{}).value||"").trim().toLowerCase();
  if(_hq){ const _hd=_hq.replace(/\D/g,""); hist=hist.filter(r=>{ const hay=[r.number,r.customer,r.contact,r.email,r.address,vehicleString(r),r.vin,moreVehList(r).join(" "),(r.items||[]).map(i=>i&&i.desc).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(_hq)>=0 || (_hd.length>=4 && String(r.phone||"").replace(/\D/g,"").indexOf(_hd)>=0); }); }
  const _booked={}; try{ (TKS.Bookings.all()||[]).forEach(b=>{ if(b && b.fromEstimate && !b.deletedAt && !/cancel/i.test(String(b.status||""))) _booked[b.fromEstimate]=b; }); }catch(e){}
  list.innerHTML="";
  if(hist.length===0){
    list.innerHTML='<div class="pp-empty">'+(_hq?"Nothing matches that search.":(histFilter==="estimate"?"No estimates yet. Make one from Quick quote.":"No documents yet."))+'</div>';
    return;
  }
  hist.forEach((r,idx)=>{
    const type=r.docType||"receipt";
    const total=r.totals?r.totals.total:(r.amount||0);
    // History description line:
    //   - Automotive jobs → vehicle (year/make/model) if available
    //   - Residential/Commercial jobs → customer address if collected
    //   - Anything else (or if the preferred field is missing) → first line item
    const veh=vehicleString(r);
    const isAuto=(r.serviceType==="Automotive")||veh;
    let descPart;
    if(isAuto && veh){
      descPart=veh;
    }else if(!isAuto && r.address){
      descPart=r.address;
    }else{
      const firstDesc=(r.items&&r.items[0])?r.items[0].desc:(r.descLine||"");
      const extra=(r.items&&r.items.length>1)?" +"+(r.items.length-1)+" more":"";
      descPart=firstDesc+extra;
    }
    const div=document.createElement("div");
    div.className="hist-item "+type;
    // Use doc number (stable id) instead of array index (changes on edit/delete/filter)
    const dn=escapeHtml(r.number);
    // 8z78: an estimate leads with what you do next — put it on the schedule, or change it (any role: nothing has been sold yet)
    const bk=(type==="estimate")?_booked[r.number]:null;
    let actions=(type==="estimate" ? ('<button data-act="sched" data-num="'+dn+'" style="background:var(--red);border-color:var(--red);color:#fff;font-weight:700">'+(bk?"📅 Schedule again":"📅 Schedule")+'</button>'+
                                      '<button data-act="edit" data-num="'+dn+'" style="font-weight:700">✏️ Edit</button>') : '')+
                '<button data-act="print" data-num="'+dn+'">🖨 Print</button>'+
                '<button data-act="share" data-num="'+dn+'">📤 Send</button>'+
                '<button data-act="pdf" data-num="'+dn+'">PDF</button>'+
                '<button data-act="pdfes" data-num="'+dn+'">PDF (ES)</button>'+
                (type==="estimate" ? '' : '<button data-cap="editPricing" data-act="edit" data-num="'+dn+'">Edit</button>');   // edit invoice = manager/owner
    if(type==="invoice") actions += '<button data-act="paid" data-num="'+dn+'">Mark Paid</button>';
    if(type==="estimate") actions += '<button data-act="toinv" data-num="'+dn+'">→ Invoice</button>';
    const tags=[ (Array.isArray(r.moreVehicles)&&r.moreVehicles.length)?("🚗 "+(r.moreVehicles.length+1)+" vehicles"):"", r.serviceWhere==="shop"?"🏪 In shop":(r.serviceWhere==="mobile"?"🚐 Mobile":""), r.taxExempt?"🏛 Tax exempt":"",
      bk?("📅 On the schedule"+(bk.date?(" "+bk.date):"")+(bk.time?(" "+bk.time):"")):"" ].filter(Boolean).join(" · ");
    actions += '<button data-cap="hardDelete" data-act="del" data-num="'+dn+'">Delete</button>';   // invoice hard-delete = owner only (hidden for others by access.js)
    div.innerHTML=
      '<div class="hi-top"><span class="hi-num">'+escapeHtml(r.number)+'</span>'+
      warrantyPillCompactHTML(r)+
      '<span class="hi-amt">'+money(total)+'</span></div>'+
      '<div class="hi-cust">'+escapeHtml(r.customer||"(no name)")+'</div>'+
      '<div class="hi-desc">'+escapeHtml(r.date||"")+' · '+escapeHtml(descPart)+(r.phone?(' · '+escapeHtml(r.phone)):'')+'</div>'+
      (tags?'<div class="hi-desc" style="color:#d8dbe2;font-weight:600">'+escapeHtml(tags)+'</div>':'')+
      (warrantyPillHTML(r)?'<div style="margin-top:5px">'+warrantyPillHTML(r)+'</div>':'')+
      '<div class="hi-actions">'+actions+'</div>';
    list.appendChild(div);
  });
  list.querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{
      const num=b.dataset.num, act=b.dataset.act;
      const hist=getHistory();
      const i=hist.findIndex(x=>x.number===num);
      if(i<0) return;
      const r=hist[i];
      if(!r.totals){ r.totals=computeTotals(r.items||[{desc:r.descLine||"Service",amount:r.amount||0,taxable:false}], r.payment, receiptTaxRate(r)); }
      if(!r.items) r.items=[{desc:r.descLine||"Service",amount:r.amount||0,taxable:false}];
      if(act==="share") shareDocument(r, "en", true);
      else if(act==="sched"){ closeHist(); estimateToJob(r); }   // 8z78
      else if(act==="print") printPaper(r, b, true);   // 8z80: a reprint never opens the cash drawer
      else if(act==="pdf") makePDF(r, "en");
      else if(act==="pdfes") makePDF(r, "es");
      else if(act==="del"){
        const note = (r.stockApplied||r.posStockApplied) ? "This cannot be undone. Any parts used will be added back to stock." : "This cannot be undone.";
        appConfirm("Delete "+r.number+"?", note).then(ok=>{
          if(!ok) return;
          const finishDelete=()=>{ const live=getHistory(), j=live.indexOf(r); if(j>=0){ live.splice(j,1); saveHistory(live); } renderHistList(); };   // 8z64: by the record itself, not by a position worked out before the question
          // Restock must COMPLETE before the receipt row disappears (the server reads the receipt to know what to put back).
          if(r.stockApplied||r.posStockApplied){ Promise.resolve(reverseStockForReceipt(r)).then(finishDelete, finishDelete); } else finishDelete();
        });
      }else if(act==="paid"){
        /* 8z69: "Mark Paid" used to change the status and nothing else — no payment was recorded, so the money never
           reached Closeout, Reports or commission. Now it asks how it was paid and records it like the builder does. */
        showModal({ title:"How was "+r.number+" paid?", body:"The payment is recorded for today, so it shows in Closeout and Reports.",
          buttons:[{label:"Cancel",kind:"no",value:""},{label:"💳 Card",kind:"no",value:"card"},{label:"Other",kind:"no",value:"other"},{label:"📱 Zelle / app",kind:"no",value:"zelle"},{label:"🧾 Check",kind:"no",value:"check"},{label:"💵 Cash",kind:"yes",value:"cash"}] }).then(method=>{
          if(!method) return;
          if(method==="card"){ closeHist(); openPayNow(r); return; }
          const label={cash:"Cash",check:"Check",zelle:"Zelle",other:"Other"}[method];
          const local=()=>{ r.docType="receipt"; r.status="Paid in Full"; r.payment=label; r.number=String(r.number||"").replace(/^INV/,"TKS"); r.paidAt=Date.now();
            applyStockForReceipt(r);   // consume parts now that it's paid (once)
            saveHistory(getHistory()); renderHistList(); };
          if(!(cloudReady() && typeof window.recordCashSale==="function" && r.id)){ local(); return; }   // demo / not signed in: on this device only
          window.recordCashSale(r, method).then(res=>{
            if(!res || res.error){ appAlert("Not recorded", "The payment was NOT recorded: "+((res&&res.error)||"no answer")+". Nothing was changed."); return; }
            r.cashLogged=true; local();
          });
        });
      }else if(act==="toinv"){
        // Convert estimate to invoice (new doc, keeps original estimate)
        const inv=estimateToInvoice(r); renderHistList();
        appAlert("Done", "Created "+inv.number+" from "+r.number);
      }else if(act==="edit"){
        editReceipt(r);
      }
    };
  });
  try{ if(window.TKS_ACCESS) TKS_ACCESS.applyGates(list); }catch(e){}   // gate the freshly-rendered action buttons (e.g. owner-only Delete)
}

/* ---------- Edit an existing document — always through the Quick invoice (merge-save) ---------- */
/* 8z48 (owner, 2026-11-11): once a receipt is CLOSED, only a manager or the owner may change it.
   Closed = marked Paid in Full and the money is actually in: any non-card payment, or a card payment that was charged
   (paidAt is stamped when the charge clears). A card receipt that has not been charged yet is still open, so a
   technician can fix a mistake before taking the payment. Estimates and unpaid invoices are never closed. */
function receiptClosed(r){
  if(!r || (r.docType||"")==="estimate") return false;
  if(r.status!=="Paid in Full") return false;
  if(/^card$/i.test(String(r.payment||"")) && !r.paidAt) return false;
  return true;
}
function canEditClosed(){
  try{ const role=(window.TKS&&TKS.auth&&TKS.auth.staffRole)?TKS.auth.staffRole():null;
       if(role) return role==="owner"||role==="manager";
       return !!(window.TKS&&TKS.auth&&TKS.auth.isOwner&&TKS.auth.isOwner()); }catch(e){ return false; }
}
function receiptLockedForMe(r){ return receiptClosed(r) && !canEditClosed(); }
function editReceipt(r){
  closeHist();
  chat.innerHTML="";
  if(receiptLockedForMe(r)){   // show it, but no editing
    resultNote("🔒 "+(r.number||"This receipt")+" is closed (paid). Only a manager or the owner can change it.");
    renderFinished(r); return;
  }
  openQuickInvoice(showHome, r);
}

   ========================================================== */
let custPickCallback=null;
let custPickMode="customer"; // "customer" or "shop"
let custPickType=null;       // "individual" | "business" | null — customer-mode filter (set by the caller)
function openCustPicker(cb, shopMode, custType){
  custPickCallback=cb;
  custPickMode = shopMode ? "shop" : "customer";
  custPickType = custType || null;
  document.getElementById("custSearch").value="";
  document.querySelector("#custPanel .pp-head b").textContent =
    custPickMode==="shop" ? "Pick Contracting Shop" : "Pick Customer";
  document.getElementById("custSearch").placeholder =
    custPickMode==="shop" ? "Search shops..." : "Search customers...";
  renderCustList();
  document.getElementById("custPanel").classList.add("open");
}
function closeCust(){
  document.getElementById("custPanel").classList.remove("open");
  custPickCallback=null;
}
function renderCustList(){
  const q=document.getElementById("custSearch").value.toLowerCase();
  const source = custPickMode==="shop" ? getShops() : getCustomers();
  let list = source.slice().sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));
  // For customer mode, filter by the current job's customerType so an Individual
  // job doesn't show Business customers (and vice versa). Records with no
  // customerType (legacy) show on both sides for backward compat.
  if(custPickMode !== "shop" && custPickType){
    list = list.filter(c => !c.customerType || c.customerType === custPickType);
  }
  if(q){
    // Search both the customer name AND the contact person (so searching
    // "Joey" finds him under "Freeman Striping")
    list=list.filter(c=>{
      const fields = [c.customer, c.name, c.contact, c.manager, c.phone, c.email]
        .filter(Boolean).map(s=>String(s).toLowerCase());
      return fields.some(f=>f.includes(q));
    });
  }
  const el=document.getElementById("custList");
  el.innerHTML="";
  if(list.length===0){
    el.innerHTML='<div class="pp-empty">No matches.</div>';
    return;
  }
  list.forEach(c=>{
    const div=document.createElement("div");
    div.className="hist-item";
    div.style.cursor="pointer";
    const name = c.customer || c.name || "";
    const sub = custPickMode==="shop"
      ? [c.manager||c.contact, c.phone, c.email].filter(Boolean).join(" · ")
      : [c.contact, c.phone, c.email].filter(Boolean).join(" · ");
    // Type tag — shops are always business; customers carry customerType
    let typeTag = "";
    if(custPickMode === "shop"){
      typeTag = '<span class="cust-type-tag biz">BUSINESS</span>';
    }else if(c.customerType === "business"){
      typeTag = '<span class="cust-type-tag biz">BUSINESS</span>';
    }else if(c.customerType === "individual"){
      typeTag = '<span class="cust-type-tag ind">INDIVIDUAL</span>';
    }
    div.innerHTML='<div class="hi-cust">'+escapeHtml(name)+' '+typeTag+'</div>'+
      '<div class="hi-desc">'+escapeHtml(sub)+'</div>';
    div.onclick=()=>{
      const cb = custPickCallback;
      closeCust();
      if(cb) cb(c);
    };
    el.appendChild(div);
  });
}

/* ===== Read-only Receipts mode — view/search/reprint + NASTF D1 worklist.
   Entered via ?receipts=1 (the "Receipts" nav). The builder never runs here;
   charging/creating lives on the register (desktop) + Start-a-Job (mobile). ===== */
var RO_RECEIPTS = /[?&](receipts|history)=1/.test(location.search);
var roTab='all', roQuery='';
function roVehStr(r){ try{ return vehicleString(r)||''; }catch(e){ return ''; } }
function roDesc(r){
  var veh=roVehStr(r), isAuto=(r.serviceType==="Automotive")||veh;

function roFindReceipt(id, num){

function roActionsHTML(r){

/* ---- In-app invoice viewer: shows the receipt as live HTML (renders reliably on
   every phone, unlike a blob-PDF iframe which goes blank on mobile). Download + Print
   build the PDF on demand from the SAME engine. The view shows sell prices only —
   never cost/margin — so it's safe for every role. ---- */
var roViewerReceipt=null;
function roOpenViewer(r){
  if(!r) return;
  // legacy receipts may lack totals/items — rebuild them the same way the history list does
  try{
    if(!r.items) r.items=[{desc:r.descLine||"Service",amount:r.amount||0,taxable:false}];
    if(!r.totals) r.totals=computeTotals(r.items, r.payment, (typeof receiptTaxRate==='function'?receiptTaxRate(r):(r.taxRate||0)));
  }catch(e){}
  roViewerReceipt=r;
  var docEl=document.getElementById('roViewerDoc');
  if(docEl){
    try{ docEl.innerHTML=buildReceiptCardHTML(r); docEl.scrollTop=0; }
    catch(e){ docEl.innerHTML='<div style="padding:26px;text-align:center;color:#e7e9ee">Couldn’t render this receipt — tap <b>⬇ Download</b> for the PDF.</div>'; }
  }
  var ttl=document.getElementById('roViewerTitle'); if(ttl) ttl.textContent=((typeof docLabel==='function'?docLabel(r.docType):'Document'))+' '+(r.number||r.id||'');

function boot(){
  // Business identity ALWAYS comes from the main app (TKS.Config / the Setup wizard).
  // Bittings never shows its own welcome/setup screen — it pulls the shop's identity
  // from the shared config and just works (blank is fine until the owner fills Setup).
  const s = getSettings();
  SETTINGS = s ? Object.assign({}, DEFAULT_SETTINGS, s) : Object.assign({}, DEFAULT_SETTINGS);
  if(!SETTINGS.logoCustom && SETTINGS.logo!==DEFAULT_LOGO){ SETTINGS.logo=DEFAULT_LOGO; }
  hydrateIdentityFromConfig();   // pull name/address/phone/email/license/logo from TKS.Config
  // One-time: carry a pre-existing local tax rate into the cloud config.
  try{
    if(!localStorage.getItem('tks_shop_config') && SETTINGS && Number(SETTINGS.taxRate)>0 && window.TKS && TKS.Config){
      TKS.Config.save({ taxRate: Number(SETTINGS.taxRate), taxableByCategory: {} });
    }
  }catch(e){}
  try{ saveSettingsObj(SETTINGS); }catch(e){}   // cache locally so we never re-prompt
  applyBranding();
  if(window.RO_RECEIPTS) roOpen();
  else {
    // Start-a-job handoff: index.html writes a one-shot sessionStorage draft → pre-fill the builder.
    // 8z46: the app's Receipts list (or a job that already has a receipt) hands over ONE existing document to edit in place
    let editDoc=null;
    try{ const er=sessionStorage.getItem('tks_edit_receipt'); if(er){ sessionStorage.removeItem('tks_edit_receipt'); editDoc=JSON.parse(er); } }catch(e){ editDoc=null; }
    // 8z69: "Card — take it now" on an unpaid invoice (customer page) lands here: show that document and open Pay Now on it
    let payDoc=null;
    try{ const pr=sessionStorage.getItem('tks_pay_receipt'); if(pr){ sessionStorage.removeItem('tks_pay_receipt'); const want=JSON.parse(pr);
      payDoc=getHistory().find(x=>(want.id&&x.id===want.id)||(want.number&&x.number===want.number))||null; } }catch(e){ payDoc=null; }
    if(payDoc){ try{ sessionStorage.removeItem('tks_job_draft'); }catch(e){} chat.innerHTML=""; renderFinished(payDoc); if(payDoc.docType!=="estimate" && !receiptClosed(payDoc)) openPayNow(payDoc); }
    else if(editDoc && (editDoc.id||editDoc.number)){ try{ sessionStorage.removeItem('tks_job_draft'); }catch(e){} editReceipt(editDoc); }
    else {
    let draft=null;
    try{ const raw=sessionStorage.getItem('tks_job_draft'); if(raw){ sessionStorage.removeItem('tks_job_draft'); draft=JSON.parse(raw); } }catch(e){ draft=null; }
    // 8z65 Quick quote: a customer calls for a price → the builder opens as an Estimate, no name needed
    const _dm=/[?&]docs=([^&]+)/.exec(location.search);
    if(_dm && window.TKS_RDOCS){ openDocsPage(decodeURIComponent(_dm[1])); }   // 8z90: scanned QR → this receipt's photo page
    else if(/[?&]estimates=1/.test(location.search)){ showHome(); setHistFilter("estimate"); openHist(); }   // 8z78: menu → Estimates
    else if(/[?&]quote=1/.test(location.search)){ const pf=draft ? (jobDraftToPrefill(draft)||{}) : {}; pf.docType="estimate"; pf.quote=true; openNewDocument(pf); }   // 8z71: a website lead being quoted comes with its details
    else openNewDocument(draft ? jobDraftToPrefill(draft) : null);
    }
  }
  // When the cloud config finishes loading (async), re-pull identity in case it changed.
  try{ if(window.TKS && TKS.Config && TKS.Config.load){ TKS.Config.load().then(function(){ try{ hydrateIdentityFromConfig(); saveSettingsObj(SETTINGS); }catch(e){} }); } }catch(e){}
  syncOwnerUI();   // hide the ⚙ Settings gear for a signed-in staff member
}

/* ===================== PAY NOW (portal payments) =====================
   Calls the Supabase pay-* edge functions with the signed-in staff session.
   Reader (WisePOS E, server-driven) + typed-card (Stripe Payment Element).
   The 2% surcharge is CREDIT-ONLY and enforced server-side at capture. */
(function(){
  const CFG = window.TKS_CLOUD || {};
  const FN = (CFG.url||"") + "/functions/v1";
  let sb=null, stripe=null, elements=null, S={}, modal=null, polls=0;
  function client(){ if(!sb && window.supabase && CFG.url) sb=supabase.createClient(CFG.url, CFG.anonKey); return sb; }
  async function token(){ const c=client(); if(!c) return null; try{ const {data}=await c.auth.getSession(); return data&&data.session?data.session.access_token:null; }catch(e){ return null; } }
  async function call(fn, body){
    const tok=await token();
    let r;
    try{ r=await fetch(FN+"/"+fn,{method:"POST",headers:{"content-type":"application/json","apikey":CFG.anonKey,"authorization":"Bearer "+(tok||CFG.anonKey)},body:JSON.stringify(body||{})}); }
    catch(e){ return { error:"Can't reach the payment service — check the connection and try again.", network:true }; }   // never throw out of here (B8)
    let j; try{ j=await r.json(); }catch(e){ j={error:"bad response"}; }
    if(!r.ok && !j.error) j.error="HTTP "+r.status; return j;
  }
  function m(c){ return "$"+(Number(c||0)/100).toFixed(2); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  function node(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
  // Closing the sheet mid-charge cancels the live PaymentIntent + reader prompt (C6) — see app/pay.js.
  function close(){
    try{ if(S && S.pi && !S.completed && !S.cancelling){ S.cancelling=true; call("pay-terminal",{ action:"cancel_intent", paymentIntentId:S.pi, readerId:S.reader||null }).then(j=>{ if(j&&j.error) console.warn("cancel_intent:",j.error); },()=>{}); } }catch(_){}
    if(modal){ modal.remove(); modal=null; } S={}; stripe=null; elements=null;
  }
  function status(msg,kind){ const s=modal&&modal.querySelector("#pnStatus"); if(s){ s.textContent=msg||""; s.style.color=kind==="bad"?"#f0a0a6":kind==="ok"?"#7fd49b":"#9aa3af"; } }

  window.openPayNow = async function(receipt){
    if(!receipt||!receipt.id){ appAlert("Save first", "Save the receipt first."); return; }
    const c=client(); const tok=await token();
    if(!c||!tok){ appAlert("Sign in needed", "Sign in (Staff Login) to take a payment."); return; }
    // Card requires this shop's Stripe Connect account to be connected + charge-enabled.
    // (Cash/check don't go through Pay Now.) Blocks the card modal with a clear prompt
    // instead of letting the charge fail on tap.
    try{
      const cs=await c.from("shops").select("connect_charges_enabled,stripe_connect_id").limit(1).maybeSingle();
      const ok = cs && cs.data && cs.data.stripe_connect_id && cs.data.connect_charges_enabled;
      if(!ok){ appAlert("Connect Stripe to take card", "This shop hasn’t connected its Stripe account yet, so card payments are off. An owner can connect it in Settings → Payments. Cash and check still work."); return; }
    }catch(e){}
    try{ await c.from("receipts").upsert({ id:receipt.id, data:receipt }); }catch(e){ appAlert("Sync failed", "Couldn't sync the invoice to the cloud: "+(e.message||e)); return; }
    const t=receipt.totals||{}; const baseCents=Math.round((Number(t.total||0)-Number(t.surcharge||0))*100);
    S={ receipt, baseCents, method:"reader", attempt:1, reader:localStorage.getItem("tks_pay_reader")||"" };
    render();
  };

  // Log a CASH / CHECK paid sale as a transaction (same pay-record endpoint as the
  // Payments tile) so it shows up in Dashboard, Reports and Closeout. Card sales log
  // themselves via Pay Now. Returns {error} on failure (caller decides whether to retry).
  window.recordCashSale = async function(receipt, method){
    try{
      if(!receipt || !receipt.id) return {error:"missing id"};
      const c=client(); const tok=await token();
      if(!c || !tok) return {error:"not signed in"};
      await c.from("receipts").upsert({ id:receipt.id, data:receipt });
      return await call("pay-record", { invoiceId:receipt.id, method:method });
    }catch(e){ return {error:(e&&e.message)||String(e)}; }
  };

  function render(){
    if(modal) modal.remove();
    const sur=Math.round(S.baseCents*0.02);
    const _t=(S.receipt&&S.receipt.totals)||{};
    const taxC=Math.round((Number(_t.tax)||0)*100);
    const rateLbl=_t.taxRate?(" ("+_t.taxRate+"%)"):"";
    const taxRows = taxC>0 ? (
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#5a616c"><span>Subtotal (goods + labor)</span><span>'+m(S.baseCents-taxC)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#5a616c"><span>Sales Tax'+rateLbl+'</span><span>'+m(taxC)+'</span></div>') : "";
    modal=node(`<div style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px">
      <div style="background:#ffffff;color:#14171b;width:100%;max-width:440px;border-radius:18px;padding:18px;max-height:92vh;overflow:auto;font-family:-apple-system,Segoe UI,Roboto,sans-serif">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:18px">Pay Now</b><button id="pnX" style="background:none;border:none;color:#5a616c;font-size:26px;cursor:pointer;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin:-6px -6px -6px 0">&times;</button></div>
        <div style="font-size:13px;color:#5a616c;margin-bottom:10px">Invoice ${esc(S.receipt.number||S.receipt.id)}</div>
        <div style="background:#f3f4f6;border:1px solid #e3e6ea;border-radius:12px;padding:12px;margin-bottom:12px">
          ${taxRows}
          <div style="display:flex;justify-content:space-between;margin-top:${taxC>0?'4px':'0'}"><span>Amount${taxC>0?' (incl. tax)':''}</span><b>${m(S.baseCents)}</b></div>
          <div id="pnSur" style="font-size:12px;color:#f2b43a;margin-top:6px">Then a 2% surcharge (${m(sur)}) is added on top for <b>credit</b> cards only — debit &amp; prepaid are never surcharged.</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px"><button class="pnM" data-m="reader">🏪 Reader</button><button class="pnM" data-m="keyed">⌨️ Type card</button><button class="pnM" data-m="link">🔗 Send link</button></div>
        <div id="pnBody"></div><div id="pnStatus" style="font-size:13px;margin-top:10px;min-height:18px"></div>
      </div></div>`);
    document.body.appendChild(modal);
    modal.querySelector("#pnX").onclick=close;
    modal.addEventListener("click",e=>{ if(e.target===modal) close(); });
    modal.querySelectorAll(".pnM").forEach(b=>{ const on=b.dataset.m===S.method;
      b.style.cssText="flex:1;min-width:0;min-height:44px;padding:11px 6px;border-radius:11px;border:1.5px solid "+(on?"#f2b43a":"#e3e6ea")+";background:"+(on?"rgba(242,180,58,.14)":"transparent")+";color:#14171b;font-weight:700;font-size:13.5px;cursor:pointer";
      b.onclick=()=>{ if(S.method===b.dataset.m) return; S.method=b.dataset.m; render(); }; });
    (S.method==="reader"?renderReader:S.method==="link"?renderLink:renderKeyed)();
  }

  /* ---------- 8z75 (owner, 2026-11-12): PAY LINK — "send a link for payment when out in the field" ----------
     The customer pays on their OWN phone: the link opens a small page (pay.html) with the shop, invoice number and amount,
     then Stripe's secure card page. Money goes to the shop's own Stripe account like every card sale. NO 2% surcharge on a
     link (owner decision — a link cannot tell credit from debit before the customer pays; the reader and typed card keep it).
     The link never expires, always charges the invoice's current total, and stops working once the invoice is paid.
     The server (stripe-webhook) records the payment and marks the invoice paid by itself — this sheet does not need to stay open. */
  function linkUrl(i,k){ const u=new URL("pay.html", location.href); u.search="?i="+encodeURIComponent(i)+"&k="+encodeURIComponent(k); u.hash=""; return u.toString(); }
  function linkPhone(){ const d=String((S.receipt&&S.receipt.phone)||"").replace(/\D/g,""); return d.length===10?d:(d.length===11&&d[0]==="1"?d.slice(1):""); }
  function linkText(){ const r=S.receipt||{}, shop=(typeof SETTINGS!=="undefined"&&SETTINGS&&SETTINGS.name)||"";
    return (shop?shop+": ":"")+"invoice "+(r.number||"")+" — "+m(S.baseCents)+". Pay securely here: "+S.link; }
  function renderLink(){

  async function startLink(){
    const go=modal&&modal.querySelector("#pnGo"); if(go){ go.disabled=true; go.textContent="Creating link…"; }

    const j=await call("pay-link",{ action:"create", invoiceId:S.receipt.id });
    if(!modal || S.method!=="link") return;
    if(j.error || !j.k){ if(go){ go.disabled=false; go.textContent="Create pay link"; } status(j.error||"Could not create the link — try again.","bad"); return; }

  // remember on the invoice that a link went out (shown on the card and in History)
  function noteLinkSent(how){ try{ const r=S.receipt; if(!r) return; r.payLinkSentAt=Date.now(); r.payLinkVia=how; if(typeof _syncReceiptInHistory==="function") _syncReceiptInHistory(r); }catch(_){} }
  // while this sheet is open, notice the payment (the server has already recorded it by then)

    if(S.linkWatch) return; S.linkWatch=true; let n=0; const mine=S;

      if(!modal || S!==mine || S.completed) return;

        const j=await call("pay-link",{ action:"info", i:S.linkI, k:S.linkK });

        if(j && j.ok && j.paid){ linkPaid(j); return; }

        { const pb=mk("🖨 Print receipt",()=>printPaper(r, pb)); wrap.appendChild(pb); }   // 8z80

  // 8z47: staff are never asked for a Stripe key (a technician taking a real payment got a "Stripe publishable key
  // (one-time) pk_test_…" box on 2026-11-11). The key comes from the server, the same for every shop.
  let serverPK=null;
  async function getPK(){
    if(serverPK) return serverPK;
    try{ const j=await call("pay-terminal",{action:"config"}); if(j&&j.publishableKey){ serverPK=j.publishableKey; return serverPK; } }catch(e){}

  function renderKeyed(){
    modal.querySelector("#pnBody").innerHTML=`<div id="pnPE" style="background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;min-height:42px"></div>${payBtn("Start card entry","pnGo")}`;

  async function startKeyed(){
    if(!window.Stripe){ status("Stripe.js didn't load.","bad"); return; }
    status("Preparing secure card field…");
    const pk=await getPK();
    if(!pk){ status("Typed-card entry could not start (no connection to the payment service). Check the signal and try again, or use the card reader.","bad"); return; }
    status("Preparing secure card field…");
    const j=await call("pay-create-intent",{invoiceId:S.receipt.id,method:"keyed",attempt:S.attempt});
    if(j.error||!j.clientSecret){ status(j.error||"no client secret","bad"); return; }
    S.pi=j.paymentIntentId;
    // 8z37: the charge lives on the shop's own Stripe account (direct charge), so Stripe.js must be opened "as" that account.
    try{ stripe=j.stripeAccount?Stripe(pk,{stripeAccount:j.stripeAccount}):Stripe(pk); elements=stripe.elements({clientSecret:j.clientSecret}); elements.create("payment").mount("#pnPE"); }
    catch(e){ status("Card field error: "+(e.message||e),"bad"); return; }

  }

    status("Processing…");
    const res=await stripe.confirmPayment({elements,redirect:"if_required"});
    if(res.error){ status("Declined: "+res.error.message,"bad"); return; }
    poll();
  }

  async function poll(){
    polls=0; let netFails=0;
    const tick=async()=>{ polls++;
      if(!modal || !S.pi) return;
      const j=await call("pay-status",{paymentIntentId:S.pi});
      // 8z59: a single failed status check (weak signal) used to stop here with a red error while the card was in fact
      // charged. Keep checking, and if it still cannot be confirmed say plainly NOT to charge again.
      if(j.error){ netFails++;
        if(netFails<=6 && polls<45){ status("Checking the payment… ("+netFails+")"); setTimeout(tick,2000); return; }
        status("Could not confirm the payment from this phone ("+j.error+"). The card MAY have been charged — do NOT charge again. Check Reports or ask the office first.","bad"); return; }
      netFails=0;
      if(j.status==="completed"){
        S.completed=true;
        status("✓ Approved — "+m(j.captured_cents)+(j.surcharge_applied?" (incl. 2% credit surcharge)":" (no surcharge)"),"ok");
        // Card cleared → mark the doc paid and consume its parts (once).
        try{ const r=S.receipt; if(r){
          if(r.docType==="invoice"){ r.docType="receipt"; if(r.number) r.number=String(r.number).replace(/^INV/,"TKS"); }
          r.status="Paid in Full"; r.paidAt=Date.now(); r.payment="Card";
          // The card was charged captured_cents (base + 2% only when it was a CREDIT card). Put the
          // real figures on the document so the PDF/share matches the card statement (C2).
          try{ const capt=Number(j.captured_cents), base=Number(j.base_cents!=null?j.base_cents:capt);

          if(typeof _syncReceiptInHistory==="function") _syncReceiptInHistory(r);
          if(typeof applyStockForReceipt==="function") applyStockForReceipt(r);
          if(typeof renderHistList==="function"){ try{ renderHistList(); }catch(_){} }
          // Offer to send the receipt straight from the success screen (native share / file).
          const body=modal&&modal.querySelector("#pnBody");
          if(body && !body.querySelector(".pnSend")){
            const wrap=document.createElement("div"); wrap.className="pnSend";
            wrap.style.cssText="display:flex;gap:8px;margin-top:12px";
            const mkBtn=(label)=>{ const b=document.createElement("button"); b.type="button";
              b.style.cssText="flex:1;min-height:44px;padding:13px;border-radius:11px;border:1px solid #e3e6ea;background:#f3f4f6;color:#14171b;font-weight:700;cursor:pointer";
              b.textContent=label; return b; };
            const pr=mkBtn("🖨 Print receipt"); pr.onclick=()=>printPaper(r, pr); wrap.appendChild(pr);   // 8z80
            const dl=mkBtn("⬇ Download receipt");
            dl.onclick=()=>{ try{ makePDF(r,"en",true); }catch(e){ appAlert("PDF unavailable", "Couldn't build the PDF — open the receipt and use Print."); } };
            const sn=mkBtn("📤 Send receipt");
            sn.onclick=()=>{ try{ shareDocument(r,"en",true); }catch(e){ appAlert("Share unavailable", "Sharing isn't available on this device — open the receipt and use Share or Print."); } };
            wrap.appendChild(dl); wrap.appendChild(sn); body.appendChild(wrap);
          }
        } }catch(_){}
        return;
      }
      if(j.status==="failed"){ status("✗ "+(j.failure_reason||"failed")+" — try again.","bad"); S.attempt++; return; }
      if(j.status==="canceled"){ status("Canceled — try again.","bad"); S.attempt++; return; }
      if(polls<40) setTimeout(tick,2000); else status("Still waiting — check the reader.","bad");
    }; tick();
  }
})();

/* ===================== PARTS, COST & STOCK (shared) =====================
   Lets a sale reference real Inventory parts so the system can compute PROFIT
   (sale − cost) and keep stock accurate. The customer-facing line is unchanged
   (it still shows the SALE price); the part's cost rides along behind the scenes
   on the line item: { partId, qty, unitCost, cost }  (cost = unitCost × qty).
   - Inventory part-picker is owner-only (it reveals cost).
   - Stock is decremented only when a sale is COMPLETED/PAID (never on a draft),
     and added back if a paid sale is later voided/deleted/refunded. Guarded by a
     `stockApplied` flag on the receipt so it can never double-apply. */
function _isOwnerForCosts(){
  // Cost/margin = manager+ (per the matrix). Signed-in manager/owner see it;
  // technician/front_desk do not. Nobody signed in -> own device (full).
  return canEditPricing();
}
function currentTechnician(){
  try{ if(window.TKS && TKS.auth && TKS.auth.isSignedIn()) return TKS.auth.email()||""; }catch(e){}
  return "";
}
function lineCost(unitCost, qty){
  const u=parseFloat(unitCost); const q=parseInt(qty,10)||1;
  if(isNaN(u)||u<=0) return 0;
  return Math.round(u*q*100)/100;
}
/* Open a searchable Inventory picker (name / SKU / fitment / VIN — same search as
   the Inventory tile). Calls onPick(part) with the chosen part. Owner-gated. */
function pickInventoryPart(onPick, veh){
  if(!_isOwnerForCosts()){ appAlert("Managers only", "Picking parts (and seeing cost) is manager-only."); return; }
  if(!window.TKS || !TKS.Inventory){ appAlert("Inventory unavailable", "Inventory isn't available here yet."); return; }
  // 8h: when the invoice already names a vehicle, start on the keys whose Fits list covers it.
  const vehOk = !!(veh && (veh.make||veh.model) && window.TKS_FIT);
  const vehLbl = vehOk ? TKS_FIT.vehLabel(veh) : "";
  let fitOnly = vehOk;
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px";
  ov.innerHTML=`<div style="background:#ffffff;color:#14171b;width:100%;max-width:460px;border-radius:16px;padding:16px;margin:auto;max-height:92vh;overflow:auto;font-family:-apple-system,Segoe UI,Roboto,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:17px">📦 Pick a part</b><button id="ipX" style="background:none;border:none;color:#5a616c;font-size:26px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin:-6px -6px -6px 0">&times;</button></div>
    ${vehOk?`<button type="button" id="ipFit" style="width:100%;text-align:left;border:1px solid #2f6b46;background:#e6f4ea;color:#14171b;border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13.5px;cursor:pointer"><b>🚗 Fits ${escapeHtml(vehLbl)}</b> <span id="ipFitN" style="color:#5a616c"></span><span style="float:right;color:#5a616c">tap to show all parts</span></button>`:""}
    <input id="ipQ" placeholder="Search name, SKU, FCC ID, fitment, VIN…" style="width:100%;background:#f3f4f6;border:1px solid #e3e6ea;border-radius:10px;color:#14171b;padding:11px;font-size:15px;box-sizing:border-box">
    <div id="ipList" style="margin-top:10px;max-height:60vh;overflow:auto"></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("#ipX").onclick=close;
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  const q=ov.querySelector("#ipQ"), listBox=ov.querySelector("#ipList"), fitBtn=ov.querySelector("#ipFit");
  if(fitBtn) fitBtn.onclick=()=>{ fitOnly=!fitOnly; fitBtn.style.background=fitOnly?"#e6f4ea":"#f3f4f6"; fitBtn.style.borderColor=fitOnly?"#2f6b46":"#e3e6ea"; fitBtn.querySelector("span:last-child").textContent=fitOnly?"tap to show all parts":"tap to show only parts that fit"; draw(); };
  function row(p){
    const low = TKS.Inventory.isLow(p);
    const costTxt = (p.cost!=null && p.cost!=="") ? ("$"+Number(p.cost).toFixed(2)) : "no cost set";
    const costCol = (p.cost!=null && p.cost!=="") ? "#7fd49b" : "#f2b43a";
    const keyBits=[p.fccId?("FCC "+p.fccId):"", p.chip?("chip "+p.chip):""].filter(Boolean).join(" · ");
    return `<button class="ipRow" data-id="${escapeHtml(p.id)}" style="width:100%;text-align:left;background:#f3f4f6;border:1px solid ${low?'#7a5b12':'#e3e6ea'};border-radius:11px;padding:10px 12px;margin-bottom:7px;color:#14171b;cursor:pointer">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <b style="font-size:14px">${escapeHtml(p.name||"(unnamed part)")}</b>
        <span style="font-size:12px;color:${costCol};white-space:nowrap">cost ${costTxt}</span></div>
      <div style="font-size:12px;color:#5a616c;margin-top:2px">${escapeHtml([p.sku, "qty "+(parseInt(p.qty,10)||0)+(low?" · LOW":""), keyBits, (window.TKS_FIT&&p.fitment)?TKS_FIT.summary(p.fitment)||p.fitment:p.fitment].filter(Boolean).join(" · "))}</div>
    </button>`;
  }
  function draw(){
    let res=TKS.Inventory.search(q.value||"");
    if(fitOnly){ const ids={}; TKS.Inventory.forVehicle(veh).forEach(p=>{ ids[p.id]=1; }); res=res.filter(p=>ids[p.id]); const n=ov.querySelector("#ipFitN"); if(n) n.textContent="· "+res.length+" part"+(res.length===1?"":"s"); }
    if(!res.length){ listBox.innerHTML='<div style="color:#5a616c;font-size:14px;padding:14px;text-align:center">'+(fitOnly?("No parts in Inventory list "+escapeHtml(vehLbl)+" in their Fits. Tap the green bar to see all parts."):(((q.value||"").trim())?"No parts match.":"No parts in inventory yet. Add them in the Inventory tile, or type a manual cost on the line."))+'</div>'; return; }
    listBox.innerHTML=res.slice(0,60).map(row).join("");
    listBox.querySelectorAll(".ipRow").forEach(b=> b.onclick=()=>{ const p=TKS.Inventory.get(b.dataset.id); if(p){ close(); onPick(p); } });
  }
  q.addEventListener("input",draw); draw(); setTimeout(()=>q.focus(),30);
}
/* Persist a (possibly mutated) receipt back into history by id/number. */
function _syncReceiptInHistory(r){
  try{ const hist=getHistory(); const i=hist.findIndex(x=> (r.id&&x.id===r.id) || (r.number&&x.number===r.number));
    if(i>=0){ hist[i]=r; saveHistory(hist); } }catch(e){}
}
function _receiptIsPaid(r){ return !!r && r.status==="Paid in Full"; }
/* Stock on a sale.
   SIGNED IN → the server does it (pos_decrement_stock / pos_restock): per-location, serialized-unit
   aware, audited, idempotent via receipts.data.posStockApplied. The old direct write to inventory.qty
   is wrong when signed in — inventory.qty is a trigger-maintained SUM of inventory_locations, so the
   next location event silently undid it, and RLS rejected it (0 rows, no error) for technicians.
   LOCAL / signed out → the simple per-item qty adjust, as before. */
function _stockViaServer(){ try{ return !!(window.TKS && TKS.POS && TKS.POS.decrementStock && TKS.auth && TKS.auth.isSignedIn && TKS.auth.isSignedIn() && !(TKS.isDemo && TKS.isDemo())); }catch(e){ return false; } }
function _stockNote(msg){ try{ if(typeof toast==="function") toast(msg); else if(typeof appAlert==="function") appAlert("Stock", msg); else console.warn(msg); }catch(e){} }
// The receipt row may still be in flight to the cloud when this runs right after a save → retry "not found" briefly.
function _stockRpcRetry(fn, tries){
  return Promise.resolve().then(fn).then(res=>{
    if(res && res.error && /not found/i.test(res.error.message||"") && tries>0){ return new Promise(r=>setTimeout(r,700)).then(()=>_stockRpcRetry(fn, tries-1)); }
    return res;
  });
}
/* Decrement stock for each part line — ONLY once, ONLY on a paid/completed sale. */
function applyStockForReceipt(r){
  if(!r || r.stockApplied || r.posStockApplied) return false;
  if(!window.TKS || !TKS.Inventory) return false;
  const hasParts=(r.items||[]).some(it=> it && it.partId && (parseInt(it.qty,10)||0)>0);
  if(!hasParts) return false;
  if(_stockViaServer()){
    _stockRpcRetry(()=>TKS.POS.decrementStock(r.id), 5).then(res=>{
      if(res && res.error){ _stockNote("Stock was NOT updated for "+(r.number||r.id)+": "+(res.error.message||res.error)); return; }
      r.posStockApplied=true; r.stockApplied=true; r.stockAppliedAt=Date.now();   // keep the client copy in step so a later save can't clear the server flag
      _syncReceiptInHistory(r);
    }).catch(e=>_stockNote("Stock was NOT updated: "+((e&&e.message)||e)));
    return true;
  }
  let did=false;
  (r.items||[]).forEach(it=>{ const qn=parseInt(it.qty,10)||0; if(it.partId && qn>0){ TKS.Inventory.adjustQty(it.partId, -qn); did=true; } });
  r.stockApplied=true; r.stockAppliedAt=Date.now();
  _syncReceiptInHistory(r);
  return did;
}
/* Add stock back if a paid sale is voided / deleted / refunded. Returns a Promise when the server
   path is used (callers that then DELETE the receipt must wait for it — see the history "del" action). */
function reverseStockForReceipt(r){
  if(!r || !(r.stockApplied || r.posStockApplied)) return false;
  if(!window.TKS || !TKS.Inventory) return false;
  if(_stockViaServer()){
    return _stockRpcRetry(()=>TKS.POS.restock(r.id), 2).then(res=>{
      if(res && res.error){ _stockNote("Parts were NOT returned to stock for "+(r.number||r.id)+": "+(res.error.message||res.error)); return false; }
      r.posStockApplied=false; r.stockApplied=false; r.stockReversedAt=Date.now();
      _syncReceiptInHistory(r);
      return true;
    }).catch(e=>{ _stockNote("Parts were NOT returned to stock: "+((e&&e.message)||e)); return false; });
  }
  let did=false;
  (r.items||[]).forEach(it=>{ const qn=parseInt(it.qty,10)||0; if(it.partId && qn>0){ TKS.Inventory.adjustQty(it.partId, +qn); did=true; } });
  r.stockApplied=false; r.stockReversedAt=Date.now();
  _syncReceiptInHistory(r);
  return did;
}

/* ===================== 8r: SERIALIZED UNITS — scan OUT on a line, scan BACK IN on a decline =====================
   Unit labels (hardware.js printUnit) are QR codes of the inventory_units id: "u_" + 32 hex. A SKU barcode
   returns the SKU text. Lookups read inventory_units directly (every staff role can select); demo/offline
   has no units → a clear "needs the live app" message. Returns go through the unit_return_to_stock RPC. */
const UNIT_ID_RX=/^u_[0-9a-f]{32}$/i;
function isUnitCode(code){ return UNIT_ID_RX.test(String(code||"").trim()); }
function cloudReady(){ try{ return !!(window.TKS && TKS.auth && TKS.auth.isSignedIn && TKS.auth.isSignedIn() && !(TKS.isDemo && TKS.isDemo())); }catch(e){ return false; } }
function auditLog(action, type, id, detail){
  try{ if(window.TKS && TKS.Audit && TKS.Audit.log){ const p=TKS.Audit.log(action, type, String(id==null?"":id), detail||{}); if(p && p.catch) p.catch(function(){}); return p; } }catch(e){}
  return Promise.resolve(null);
}
/* Look a unit up by id → {unit, part}; rejects with a user-facing message. */
function lookupUnit(code){
  code=String(code||"").trim();
  if(!cloudReady()) return Promise.reject(new Error("Looking up a key needs the live app (signed in, not the demo)."));
  let sb=null; try{ sb=TKS._sb(); }catch(e){ return Promise.reject(new Error("Sign in to the cloud to look up a key.")); }
  return Promise.resolve(sb.from('inventory_units').select('*').eq('id', code).maybeSingle()).then(r=>{
    if(r && r.error) throw new Error(r.error.message||"Lookup failed");
    if(!r || !r.data) throw new Error("No key with id “"+code+"” in this shop.");
    let part=null; try{ part=TKS.Inventory.get(r.data.item_id)||null; }catch(e){}
    return { unit:r.data, part:part };
  });
}
function findPartByCode(code){
  let all=[]; try{ all=TKS.Inventory.all()||[]; }catch(e){}
  const raw=String(code||"").trim(), lc=raw.toLowerCase(); if(!lc) return null;
  return all.find(p=>String(p.sku||"").toLowerCase()===lc) || all.find(p=>String(p.id)===raw) || null;
}
function shortUnit(id){ id=String(id||""); return id.length>14 ? id.slice(0,8)+"…"+id.slice(-4) : id; }
/* Where a returned key goes: the signed-in tech's home van when known, else the shop. */
function techReturnLocation(){
  return (async function(){
    try{ const sb=TKS._sb(); const u=(await sb.auth.getUser()).data; const uid=u&&u.user&&u.user.id; if(!uid) return 'shop';
      const r=await sb.from('staff').select('home_van_id').eq('user_id', uid).maybeSingle();
      return (r && r.data && r.data.home_van_id) ? ('van:'+r.data.home_van_id) : 'shop'; }catch(e){ return 'shop'; }
  })();
}
/* Put a SOLD unit back in stock (server RPC, idempotent) + log unit_scanned_in. Resolves true when accepted. */
function returnUnitToStock(unitId, reason, receipt, partId){
  if(!cloudReady()) return Promise.resolve(false);
  return techReturnLocation().then(loc=>Promise.resolve(TKS._sb().rpc('unit_return_to_stock', { p_unit:unitId, p_location:loc, p_reason:reason||'' })).then(res=>{
      if(res && res.error){ _stockNote("Key "+shortUnit(unitId)+" was NOT returned to stock: "+(res.error.message||res.error)); return false; }
      auditLog('unit_scanned_in','inventory_units', unitId, { receipt:(receipt&&(receipt.number||receipt.id))||null, partId:partId||null, location:loc, reason:reason||'' });
      return true;
    })).catch(e=>{ _stockNote("Key was NOT returned to stock: "+((e&&e.message)||e)); return false; });
}
/* Does this device have a camera we should offer? Probed once; the 📷 buttons only show when it does (html.has-cam).
   Chrome lists a placeholder "videoinput" before permission is granted (even headless / no webcam), so a listed camera
   counts only on a touch / coarse-pointer device (phone, tablet — where labels get scanned) or when camera permission
   was already granted here (a desktop webcam the user approved once). Everything else still works via the typed code. */
const camProbe={ ok:null, p:null };
function probeCamera(){
  if(camProbe.p) return camProbe.p;
  camProbe.p=(async function(){
    try{ if(!(window.TKS_CAM && TKS_CAM.available())){ camProbe.ok=false; }
         else {
           const ds=await navigator.mediaDevices.enumerateDevices(); const listed=ds.some(d=>d.kind==="videoinput");
           let handheld=false; try{ handheld=(navigator.maxTouchPoints>0) || matchMedia("(pointer:coarse)").matches; }catch(_){}
           let granted=false; try{ if(navigator.permissions && navigator.permissions.query){ const st=await navigator.permissions.query({name:"camera"}); granted=(st && st.state==="granted"); } }catch(_){}
           camProbe.ok = listed && (handheld || granted);
         } }catch(e){ camProbe.ok=false; }
    try{ document.documentElement.classList.toggle("has-cam", !!camProbe.ok); }catch(e){}
    return camProbe.ok; })();
  return camProbe.p;
}
/* Scan one code: the camera when there is one, else a typed prompt. Resolves the code or null (cancelled). */
function scanCode(title, hint){
  if(window.TKS_CAM && TKS_CAM.available() && camProbe.ok!==false){ return TKS_CAM.scan({title:title, hint:hint}).then(c=>String(c||"").trim()||null).catch(()=>null); }
  return appPrompt(title||"Scan a key", {placeholder:"Type or scan the code", okText:"Use"}).then(v=>v?String(v).trim():null);
}
