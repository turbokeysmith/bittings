        if(nt){ o.d1=x.d1; if(x.d1===true && window.TKS_RDOCS){ const d=TKS_RDOCS.d1Read(x.d1Box); o.color=d.color; o.odometer=d.odometer; o.plate=d.plate; } }   // 8z90
        o._n=i+2; return o; }).filter(v=>v.make||v.text||v.vin); }
    function syncVehD1(){ let on=false; try{ on=!!nastfType && getSvc()==="Automotive"; }catch(e){} extraVeh.forEach(x=>{ const w=x.el.querySelector(".mvD1"); if(w) w.style.display=on?"":"none"; }); }
    const keysLater=()=>{ clearTimeout(keysTimer); keysTimer=setTimeout(renderKeys, 60); };
    ["#qiVYear","#qiVMake","#qiVModel"].forEach(s=>{ const el=$q(s); if(el) el.addEventListener("change", keysLater); });
    { const applyVeh0=modal._qiApplyVeh; if(applyVeh0) modal._qiApplyVeh=function(){ const r=applyVeh0.apply(this, arguments); keysLater(); return r; }; }   // a decoded VIN fills the vehicle
    try{ new MutationObserver(keysLater).observe(itemsBox, { childList:true }); }catch(e){}   // a line removed → its key can be added again
    keysLater();
    $q("#qiAddDisc").onclick=()=>{ if(!canDisc) return; const r=addDisc(); try{ r.querySelector(".qiDV").focus(); }catch(e){} };

    // ---- Technician / tax / warranty ----
    try{ const t=(isEdit&&edit.technician)?edit.technician:currentTechnician(); $q("#qiTech").value=t; $q("#qiTechName").textContent=t||"you"; }catch(e){}
    try{ $q("#qiTaxRate").placeholder="default "+configTaxRate()+"%"; }catch(e){}
    const wcfg=configWarranty();
    function syncWarranty(){ $q("#qiWarrantyWrap").style.display=(wcfg.months>0 && getType()!=="estimate")?"block":"none"; }
    if(wcfg.months>0){ $q("#qiWarranty").checked=!!wcfg.defaultOn; $q("#qiWarrantyLabel").textContent="Include standard warranty ("+wcfg.months+" month"+(wcfg.months===1?"":"s")+")"; }

    // ---- Pre-fill (edit = every field from the receipt; prefill = the Start-a-job draft) ----
    $q("#qiName").value=src.customer||""; $q("#qiContact").value=src.contact||"";
    $q("#qiPhone").value=src.phone||""; $q("#qiEmail").value=src.email||""; $q("#qiAddr").value=src.address||"";
    try{ $q("#qiINotes").value=src.internalNotes||""; }catch(e){}   // 8z45
    if(hasVehData()){
      const ok=modal._qiApplyVeh(src.vehYear, src.vehMake, src.vehModel);
      $q("#qiVin").value=src.vin||"";
      $q("#qiVehText").value = src.vehicle || (ok ? "" : [src.vehYear,src.vehMake,src.vehModel].filter(Boolean).join(" "));
    }
    if(isEdit){
      $q("#qiTaxRate").value=(edit.taxRate!=null&&edit.taxRate!=="")?edit.taxRate:"";
      $q("#qiNotes").value=edit.notes||"";
      $q("#qiAmountPaid").value=(edit.amountPaid!=null&&edit.amountPaid!=="")?edit.amountPaid:"";
      if(edit.warranty!=null) $q("#qiWarranty").checked=!!edit.warranty;
    }
    (src.items||[]).forEach(it=>{ if(!it) return; if(it.isDiscount){ if(pricing || isEdit) addDisc(it); } else { const rr=addItem(it); if(rr && it.vehIdx!=null && extraVeh.length) rr._vehIdx=parseInt(it.vehIdx,10); } });   // 8z84
    if(!itemsBox.querySelector(".qi-item:not(.disc)")) addItem();
    syncNastfVisibility(); syncVehicle();
    if(isEdit && edit.nastf && edit.nastf.type && getSvc()==="Automotive") setNastf(edit.nastf.type, false); else syncCustomerType();
    syncPay(); syncWarranty();

    // ---- 8z61 (owner, 2026-11-11): running totals under the line items — the total BEFORE tax, then tax and the total.
    // Reads the rows the same way submit() does, but never complains about a half-typed line.
    function paintTotals(){
      if(!modal || !itemsBox.isConnected) return;   // the builder was closed (Create / Cancel) before this ran
      const box=$q("#qiTot"); if(!box) return;
      paintEx();
      const its=[];
      itemsBox.querySelectorAll(".qi-item").forEach(row=>{
        if(row.dataset.disc){ const v=parseFloat(row.querySelector(".qiDV").value); if(isNaN(v)||v<=0) return;
          const mode=row._mode?row._mode():"percent";
          its.push({isDiscount:true, discountMode:mode, discountValue:(mode==="percent"?Math.min(v,100):v), amount:0}); return; }
        const M=row._meta||{}; if(M.declined) return;
        let a=parseFloat(row.querySelector(".qiAmt").value);
        if(M.fromDispatch && !pricing){ let q=parseInt(row.querySelector(".qiQty").value,10); if(isNaN(q)||q<1) q=1;
          a=Math.round((Number(M.dispatchAmount)||0)*(q/(M.dispatchQty||1))*100)/100; }
        if(isNaN(a)||a<0) return;
        its.push({amount:a, taxable:row.querySelector(".qiTax").checked && ((edit && edit.paidAt) || taxAllowed(row.querySelector(".qiCat").value, row.dataset.part))});   // 8z96
      });
      const dt=getType(); let pay=getPay();
      if(dt==="estimate") pay="Not specified"; else if(dt==="receipt" && (!pay || pay==="Not specified")) pay="Cash";
      let rate=null;
      if(pricing){ const v=($q("#qiTaxRate").value||"").trim(); if(v!=="") rate=parseFloat(v)||0; }
      else if(isEdit && edit.taxRate!=null && edit.taxRate!=="") rate=edit.taxRate;
      if(exempt) rate=0;   // 8z78
      const t=computeTotals(its, pay, rate);
      const row=(l,v,c)=>'<div'+(c?' class="'+c+'"':'')+'><span>'+l+'</span><span>'+v+'</span></div>';
      let h="";
      if(t.discount>0) h+=row("Items",money(t.grossSubtotal))+row("Discount","− "+money(t.discount));
      h+=row("Total before tax",money(t.subtotal),"big");
      h+=row(exempt?"Sales tax — exempt":("Sales tax ("+t.taxRate+"%)"),money(t.tax));
      if(t.surcharge>0) h+=row("Card surcharge ("+t.surchargeRate+"%)",money(t.surcharge));
      h+=row(exempt?"Total":"Total with tax",money(t.total));
      if(box._h!==h){ box._h=h; box.innerHTML=h; }
    }
    ["input","change","click"].forEach(ev=>modal.addEventListener(ev,()=>setTimeout(paintTotals,0)));
    // parts picked, keys scanned and "didn't do this" fill a line without a keystroke — keep up with those too
    (function(m){ const iv=setInterval(()=>{ if(!m.isConnected){ clearInterval(iv); return; } paintTotals(); },700); })(modal);
    paintTotals();

    // ---- Wire up ----
    const cancel=()=>{ close(); if(typeof onCancel==="function") onCancel(); };
    $q("#qiX").onclick=cancel; $q("#qiCancel").onclick=cancel;
    $q("#qiGo").onclick=()=>submit({getType,getSvc,getPay,getStatus,getCT,getNastf,getNastfChecklist,getSig:()=>sigData,getExempt:()=>exempt,getWhere:()=>where,getVehLabels:()=>vehLabels(),getMoreVeh:()=>moreVehForSave(),edit,isEdit,pricing,techDiscMax,src,setErr});
    try{ if(!isEdit && !$q("#qiName").value) $q("#qiName").focus(); }catch(e){}
  };

  function submit(S){
    const $q=s=>modal.querySelector(s);
    const err=S.setErr; err("");
    const name=($q("#qiName").value||"").trim();
    const svc=S.getSvc(), dt=S.getType();
    // 8z65: an estimate for a caller who has not given a name is fine — it is filed as "Phone quote" and no customer record is made
    const noName=!name && dt==="estimate";
    if(!name && !noName){ err((S.getCT()==="business"?"Business":"Customer")+" name is required."); return; }
    const vin=($q("#qiVin").value||"").trim().toUpperCase();
    const nastf=S.getNastf();
    if(nastf){
      for(const f of nastf.fields){ if(f.req && f.key!=="address" && !nastf.values[f.key]){ err("NASTF ("+nastf.type+"): “"+f.ask+"” is required."); return; } }
      if(nastf.type==="Auction/Fleet D1" && !/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){ err("A 17-character VIN is required for Auction/Fleet D1."); return; }
      if(window.TKS_RDOCS){   // 8z90
        const m0=TKS_RDOCS.d1Missing(nastf.d1, "NASTF D1"); if(m0){ err(m0); try{ $q("#qiD1Veh0").scrollIntoView({block:"center"}); }catch(e){} return; }
        const mv=(S.getMoreVeh?S.getMoreVeh():[]);
        for(const v of mv){ const nm="Vehicle "+v._n;
          if(v.d1!==true && v.d1!==false){ err(nm+": choose whether it needs a NASTF D1 — Yes or No."); return; }
          if(v.d1===true){ const m1=TKS_RDOCS.d1Missing(v, nm+" (NASTF D1)"); if(m1){ err(m1); return; } } }
      }
    }
    // ---- line items (+ discount lines) ----
    const its=[]; let bad=null;
    const _vl=(S.getVehLabels?S.getVehLabels():[]), _mv=(S.getMoreVeh?S.getMoreVeh():[]);   // 8z84
    modal.querySelectorAll(".qi-item").forEach(row=>{
      if(bad) return;
      if(row.dataset.disc){
        const v=parseFloat(row.querySelector(".qiDV").value); if(isNaN(v)||v<=0) return;   // empty discount row → ignore
        const mode=row._mode?row._mode():"percent";
        if(mode==="percent" && v>100){ bad="Discount percent can't be over 100."; return; }
        if(!S.pricing && !row.dataset.frozen){   // 8r: technician discount → percent only, capped per shop (0 = none)
          if(!(S.techDiscMax>0)){ bad="Discounts are managers-only at this shop."; return; }
          if(mode!=="percent"){ bad="Technicians can only give a percent discount."; return; }
          if(v>S.techDiscMax){ bad="Technicians can discount up to "+S.techDiscMax+"% at this shop."; return; }
        }
        its.push({isDiscount:true, discountMode:mode, discountValue:v, desc:"Discount", amount:0});
        return;
      }
      const M=row._meta||{};
      const d=(row.querySelector(".qiDesc").value||"").trim();
      let a=parseFloat(row.querySelector(".qiAmt").value);
      if(M.declined) a=0;                                           // 8r: "didn't do this" → $0 line
      if(!d && isNaN(a)) return;                                   // untouched blank row
      if(!d){ bad="A line item is missing its description."; return; }
      if(isNaN(a)||a<0){ bad="“"+d+"” needs a sale price (0 is fine)."; return; }
      let qty=parseInt(row.querySelector(".qiQty").value,10); if(isNaN(qty)||qty<1) qty=1; if(M.declined) qty=0;
      // 8r: a dispatched line's price is fixed for roles without editPricing (scaled when fewer were done) — never discounted per line
      if(M.fromDispatch && !S.pricing && !M.declined){ const dq=M.dispatchQty||1, base=Number(M.dispatchAmount)||0; a=Math.round(base*(qty/dq)*100)/100; }
      if(!M.declined && Array.isArray(M.units) && M.units.length>qty){ bad="“"+d+"” has "+M.units.length+" keys scanned but qty "+qty+" — scan the extra key back in or detach it (×)."; return; }
      const uc=parseFloat(row.querySelector(".qiCost").value);
      const partId=row.dataset.part||null;
      const it={ desc:d, amount:Math.round(a*100)/100, taxable:row.querySelector(".qiTax").checked && ((S.edit && S.edit.paidAt) || taxAllowed(row.querySelector(".qiCat").value, row.dataset.part)),   // 8z96: services are never taxed
                 category:row.querySelector(".qiCat").value||guessCategory(d,svc),
                 partId:partId, qty:qty, unitCost:(isNaN(uc)?0:uc), cost:lineCost(uc,qty) };
      // 8r: dispatch origin, scanned keys, decline — all ride on the saved item (server: declined lines pull no stock; unitIds sell first)
      if(M.fromDispatch){ it.fromDispatch=true; if(M.jobId) it.jobId=M.jobId; it.dispatchQty=M.dispatchQty||qty||1; it.dispatchAmount=(M.dispatchAmount!=null)?M.dispatchAmount:it.amount; }
      if(Array.isArray(M.units) && M.units.length) it.unitIds=M.units.slice();
      if(M.declined || M.declinedQty>0){ it.declined=!!M.declined; it.declineReason=M.declineReason||""; it.declinedQty=M.declined?(M.dispatchQty||M.declinedQty||1):M.declinedQty; }
      if(M.declineLoggedQty!=null) it.declineLoggedQty=M.declineLoggedQty;
      if(M.addLogged) it.addLogged=true;
      if(_mv.length && row._vehIdx!=null && row._vehIdx>=0 && row._vehIdx<=_mv.length && _vl[row._vehIdx]){ it.vehIdx=row._vehIdx; it.vehicle=_vl[row._vehIdx]; }   // 8z84
      if(Array.isArray(M.unitIdsLogged) && M.unitIdsLogged.length) it.unitIdsLogged=M.unitIdsLogged.slice();
      its.push(it);
    });
    if(bad){ err(bad); return; }
    if(!its.some(i=>!i.isDiscount)){ err("Add at least one line item (description + price)."); return; }
    // Keep saved common-job prices current with what was just charged.
    try{ const all=getCommonJobs(); let ch=false;
      its.forEach(it=>{ if(it.isDiscount) return; const hit=all.find(j=>(j.desc||"").toLowerCase()===it.desc.toLowerCase()); if(hit && hit.lastPrice!==it.amount){ hit.lastPrice=it.amount; ch=true; } });
      if(ch) saveCommonJobs(all); }catch(e){}

    // ---- Build the receipt: MERGE over the existing document when editing ----
    const R = S.isEdit ? JSON.parse(JSON.stringify(S.edit)) : {};
    const ct=S.getCT();
    R.customer=noName?"Phone quote":name; R.customerType=ct;
    if(noName) R.noCustomer=true; else delete R.noCustomer;
    R.contact = (ct==="business") ? ($q("#qiContact").value||"").trim() : "";
    R.phone=($q("#qiPhone").value||"").trim(); R.email=($q("#qiEmail").value||"").trim(); R.address=($q("#qiAddr").value||"").trim();
    R.serviceType=svc;
    R.vehYear=($q("#qiVYear").value||"").trim(); R.vehMake=($q("#qiVMake").value||"").trim(); R.vehModel=($q("#qiVModel").value||"").trim();
    R.vin=vin; R.vehicle=($q("#qiVehText").value||"").trim();
    _mv.forEach(v=>{ delete v._n; }); if(_mv.length) R.moreVehicles=_mv; else delete R.moreVehicles;   // 8z84
    R.technician=($q("#qiTech").value||"").trim() || R.technician || currentTechnician();
    R.notes=($q("#qiNotes").value||"").trim();
    R.internalNotes=(($q("#qiINotes")||{}).value||"").trim();   // 8z45: staff only — no print / PDF / share path reads this field
    if(S.src && S.src.jobId && !R.jobId) R.jobId=String(S.src.jobId);   // 8r: ties the receipt to the Scheduler job (log entries key on it)
    if(S.src && S.src.fromDispatch) R.fromDispatch=true;
    if(S.pricing){ const v=($q("#qiTaxRate").value||"").trim(); R.taxRate = v!=="" ? (parseFloat(v)||0) : configTaxRate(); }
    else if(R.taxRate==null || R.taxRate==="") R.taxRate=configTaxRate();
    { // 8z78: tax exempt → rate 0 + the certificate snapshot; removing it puts the shop's rate back
      const ex=S.getExempt?S.getExempt():null;
      if(ex){ R.taxRate=0; R.taxExempt=ex; }
      else if(R.taxExempt){ delete R.taxExempt; const tv=S.pricing?(($q("#qiTaxRate").value||"").trim()):""; if(tv==="") R.taxRate=configTaxRate(); }
      const w=S.getWhere?S.getWhere():""; if(w) R.serviceWhere=w; else delete R.serviceWhere;
      if(!S.isEdit && S.src && S.src.fromEstimate && dt!=="estimate" && !R.fromEstimate) R.fromEstimate=String(S.src.fromEstimate); }   // 8z81: billed from a job that came from an estimate
    // payment + status (exactly the chat's values, so Reports / Closeout keep working)
    if(dt==="estimate"){ R.payment="Not specified"; R.status=""; delete R.amountPaid; }
    else if(dt==="invoice"){ R.payment=S.getPay()||"Not specified"; R.status="Unpaid"; delete R.amountPaid; }
    else {
      let pay=S.getPay(); if(!pay || pay==="Not specified") pay="Cash";
      R.payment=pay; R.status=S.getStatus()||"Paid in Full";
      if(R.status==="Partial Payment"){ const ap=parseFloat($q("#qiAmountPaid").value); R.amountPaid=isNaN(ap)?0:Math.round(ap*100)/100; }
      else delete R.amountPaid;
    }
    // warranty: explicit checkbox wins (finish() won't override a set value); estimates never carry one
    try{ const wcb=$q("#qiWarranty"), wcfg=configWarranty();
      if(dt!=="estimate" && wcb && wcb.checked && wcfg.months>0){ R.warranty=true; R.warrantyMonths=wcfg.months; }
      else { R.warranty=false; R.warrantyMonths=0; }
    }catch(e){}
    // NASTF: the type drives the audit blocks; the collected fields + photo checklist live on the receipt
    if(nastf){
      nastfInfo={type:nastf.type};
      nastf.fields.forEach(f=>{ if(f.key==="address") return; R[f.key]=nastf.values[f.key]||""; });
      R.vehColor=nastf.values.vehColor||""; R.plate=nastf.values.plate||""; R.odometer=nastf.values.odometer||"";   // 8z90
      const cl=S.getNastfChecklist(); if(cl) R.nastfChecklist=cl; else delete R.nastfChecklist;
    } else { nastfInfo=null; delete R.nastfChecklist; }
    // hand off to the shared save/result path
    docType=dt; receipt=R; items=its; signatureData=S.getSig();
    close();
    finish();
  }
  /* 8r: keyboard-wedge scanner (hardware.js emits 'tks-scan'; index.html's handler doesn't run on this page) —
     while the builder is open, a scanned unit id / SKU lands on the focused line (or the matching / a new line). */
  window.addEventListener('tks-scan', function(e){
    try{ const code=String((e.detail&&e.detail.code)||"").trim(); if(!code || !modal || !modal._routeScan) return;
      let row=null; try{ const ae=document.activeElement; row=(ae && ae.closest)?ae.closest(".qi-item:not(.disc)"):null; }catch(_){}
      if(row && !modal.contains(row)) row=null;
      modal._routeScan(code, row); }catch(_){}
  });
})();

// Start the app last, so all of the above (Pay Now + Quick invoice) is defined first.
// 8z64: wait for the device copy (a few milliseconds) so the builder opens already knowing the customers, the stock and
// who is signed in. On a first load with nothing saved yet, open after 1.2 s regardless, as before.
(function(){ var started=false; function go(){ if(started) return; started=true; boot(); }
  var p=window.TKS_CONNECTING; if(p && p.then){ p.then(go, go); setTimeout(go, 1200); } else go(); })();
</script>
</body>
