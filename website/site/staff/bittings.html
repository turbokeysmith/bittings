<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2A2A2A">
<title>Bittings</title>
<!-- Follow the global Light/Dark toggle (shared with the dashboard via localStorage). -->
<script>try{if(localStorage.getItem('bt_theme')==='dark')document.documentElement.setAttribute('data-bt-theme','dark');}catch(e){}</script>
<script src="app/vendor/jspdf.umd.min.js"></script><!-- 8j: shared jsPDF 2.5.1 (was embedded here AND in app/receipts-engine.js) -->
<style>
  :root{
    --dark:#2A2A2A; --red:#C83232; --green:#22994A; --amber:#d98a00;
    --bg:#f6f7f9; --bubble-bot:#333; --bubble-me:#C83232;
    --light:#f5f5f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:#eee; display:flex; flex-direction:column;
    height:100vh; height:100dvh; overflow:hidden;   /* dvh = visible height, so the bottom nav isn't hidden behind the phone browser's toolbar */
  }
  /* Header — themed to match the rest of the app (light surface in light mode, dark in dark). */
  header{
    background:#fbfcfd; padding:12px 16px; display:flex; align-items:center;
    gap:10px; border-bottom:2px solid var(--red); flex-shrink:0;
  }
  header img{height:34px;width:auto;max-width:120px;object-fit:contain;background:transparent;}
  header .ht{flex:1;min-width:0;}
  header h1{font-size:15px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#14171b;}
  header h1 .r{color:var(--red);}
  header .sub{font-size:10px;color:#5a616c;margin-top:1px;}
  .hdr-btn{
    background:#eef1f5;color:#28303a;border:1px solid #d7dbe0;border-radius:8px;
    padding:8px 10px;font-size:11.5px;font-weight:600;
  }
  .hdr-btn:active{background:#e0e4ea;}

  /* #chat = the RESULTS surface (finished receipt card + actions / empty-state panel) */
  #chat{
    flex:1; overflow-y:auto; padding:16px 12px 8px; display:flex;
    flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch;
  }

  .receipt-card{
    background:#fff;color:#222;border-radius:10px;overflow:hidden;
    margin-top:4px;max-width:92%;box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .rc-head{background:var(--dark);padding:14px;display:flex;gap:10px;align-items:center;}
  .rc-head img{width:46px;height:46px;border-radius:6px;object-fit:contain;background:transparent;}
  .rc-head .t{flex:1;min-width:0;}
  .rc-head .t b{color:#fff;font-size:15px;font-weight:800;}
  .rc-head .t b .r{color:var(--red);}
  .rc-head .t span{display:block;color:#aaa;font-size:9.5px;margin-top:2px;word-break:break-word;}
  .rc-head .rt{color:var(--red);font-weight:800;font-size:13px;text-align:right;}
  .rc-head .rt span{display:block;color:#aaa;font-weight:400;font-size:9px;margin-top:3px;}
  .rc-body{padding:14px;}
  .rc-sec{color:var(--red);font-weight:800;font-size:11px;border-bottom:1.5px solid var(--red);padding-bottom:3px;margin-bottom:7px;}
  .rc-line{font-size:12.5px;margin:3px 0;color:#333;word-break:break-word;}
  .rc-items{margin-top:12px;}
  .rc-ihead{background:var(--dark);color:#fff;font-size:10.5px;font-weight:700;display:flex;justify-content:space-between;padding:7px 9px;}
  .rc-irow{font-size:12px;display:flex;justify-content:space-between;padding:8px 9px;border:1px solid #eee;gap:8px;}
  .rc-irow:nth-child(odd){background:#f5f5f5;}   /* 8r: the card is paper-white in both themes — --light flips dark and hid odd rows */
  .rc-tot{margin-top:12px;}
  .rc-subrow{display:flex;justify-content:space-between;font-size:11.5px;color:#777;padding:2px 0;}
  .rc-totrow{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:#222;border-top:1px solid #ccc;margin-top:5px;padding-top:6px;}
  .rc-pm{font-size:11px;color:#777;margin-top:5px;text-align:right;}
  .rc-st{font-size:11.5px;font-weight:800;margin-top:2px;text-align:right;}
  .rc-notes{font-size:11.5px;color:#555;margin-top:10px;padding-top:8px;border-top:1px dashed #ccc;font-style:italic;}
  .rc-actions{display:flex;flex-wrap:wrap;border-top:1px solid #eee;}
  .rc-actions button{
    flex:1 1 45%;min-width:140px;min-height:44px;background:var(--red);color:#fff;border:none;
    padding:13px;font-size:13px;font-weight:700;border-right:1px solid rgba(255,255,255,.2);
    border-bottom:1px solid rgba(255,255,255,.2);white-space:nowrap;
  }
  .rc-actions button:last-child{border-right:none;}
  .rc-actions button:active{background:#a82828;}
  .rc-actions button.gray{background:#666;}
  .rc-actions button.gray:active{background:#555;}


  /* Persistent app navigation — main + quick menu, always visible (bottom bar on phones). */
  /* Bottom nav — themed to match the main app (light in light mode, dark in dark mode). */
  #appnav{
    display:flex; background:#fbfcfd; border-top:1px solid #e3e6ea; flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #appnav a{
    flex:1; text-align:center; padding:7px 2px 6px; text-decoration:none;
    color:#5a616c; font-size:10px; font-weight:600; line-height:1.25;
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;
  }
  #appnav a .ic{ font-size:18px; line-height:1; }
  #appnav a.active{ color:#c8323c; }
  #appnav a.active .ic{ filter:drop-shadow(0 0 4px rgba(200,50,50,.5)); }
  #appnav a:active{ background:rgba(0,0,0,.05); }
  [data-bt-theme="dark"] #appnav{ background:#1b1f25; border-top-color:#2c313a; }
  [data-bt-theme="dark"] #appnav a{ color:#9aa1ac; }
  [data-bt-theme="dark"] #appnav a.active{ color:#fff; }
  [data-bt-theme="dark"] #appnav a:active{ background:#2a2a2a; }

  /* modal panels (settings, history, customers) */
  .panel{
    position:fixed;inset:0;background:var(--bg);z-index:50;
    display:none;flex-direction:column;
  }
  .panel.open{display:flex;}
  .pp-head{background:var(--dark);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--red);}
  .pp-head b{flex:1;font-size:16px;}
  .pp-head button{background:#444;border:none;color:#ddd;padding:10px 15px;min-height:44px;border-radius:8px;font-size:13px;font-weight:600;}
  .pp-body{flex:1;overflow-y:auto;padding:14px;}

  /* settings form */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:#aaa;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
  .field input, .field textarea{
    width:100%;background:#333;border:1px solid #e3e6ea;border-radius:8px;
    padding:11px 13px;color:#fff;font-size:14.5px;outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--red);}
  .field textarea{resize:vertical;min-height:60px;font-family:inherit;}
  .field .row2{display:flex;gap:8px;}
  .field .row2 input{flex:1;}
  .field-hint{font-size:11px;color:#6b7280;margin-top:4px;}


  /* history list */
  .hist-item{background:#2e2e2e;border-radius:10px;padding:12px 14px;border-left:3px solid var(--red);margin-bottom:9px;}
  .hist-item.invoice{border-left-color:var(--amber);}
  .hist-item.estimate{border-left-color:#888;}
  .hist-item .hi-top{display:flex;justify-content:space-between;font-size:13px;}
  .hist-item .hi-num{font-weight:700;color:var(--red);}
  .hist-item.invoice .hi-num{color:var(--amber);}
  .hist-item.estimate .hi-num{color:#bbb;}
  .hist-item .hi-amt{font-weight:700;}
  .hi-warr{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;align-self:center;margin:0 8px;}
  .hist-item .hi-cust{font-size:13.5px;margin-top:3px;color:#fff;}
  .cust-type-tag{
    display:inline-block;font-size:9px;font-weight:700;
    padding:2px 6px;border-radius:4px;margin-left:6px;letter-spacing:.4px;
    vertical-align:middle;
  }
  .cust-type-tag.ind{background:#2d4860;color:#9fd;}
  .cust-type-tag.biz{background:#603830;color:#fda;}
  .hist-item .hi-desc{font-size:11.5px;color:#5a616c;margin-top:2px;}
  .hist-item .hi-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .hist-item .hi-actions button{
    flex:1;min-width:80px;min-height:44px;background:#444;border:none;color:#ddd;padding:10px 8px;border-radius:7px;font-size:12px;font-weight:600;
  }
  .hist-item .hi-actions button:active{background:var(--red);color:#fff;}
  .hist-filter{display:flex;gap:6px;margin-bottom:12px;}
  .hist-filter button{
    flex:1;background:#333;border:1px solid #e3e6ea;color:#ddd;padding:9px;border-radius:8px;font-size:12px;font-weight:600;
  }
  .hist-filter button.active{background:var(--red);border-color:var(--red);color:#fff;}
  .pp-empty{text-align:center;color:#9a9a9a;margin-top:40px;font-size:14px;}

  /* Custom modal (replaces browser confirm/alert) */
  #modalBackdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100002;   /* above the builder + signature pad */
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  #modalBackdrop.open{display:flex;}
  .modal-box{
    background:#2e2e2e;border-radius:14px;padding:20px;
    max-width:340px;width:100%;border-top:4px solid var(--red);
  }
  .modal-box .mtitle{font-size:16px;font-weight:700;color:#fff;margin-bottom:10px;}
  .modal-box .mbody{font-size:14px;color:#ddd;line-height:1.5;margin-bottom:16px;}
  .modal-box .mbtns{display:flex;gap:8px;}
  .modal-box .mbtns button{
    flex:1;border:none;padding:12px;border-radius:8px;
    font-size:14px;font-weight:700;
  }
  .mbtn-yes{background:var(--red);color:#fff;}
  .mbtn-no{background:#555;color:#ddd;}
  .mbtn-ok{background:var(--red);color:#fff;}


  /* ===== Studio light theme — shell + panels (the receipt-card preview keeps its paper look) ===== */
  body{color:#14171b;}
  header,.pp-head{background:#fff;}
  header .sub{color:#5a616c;}
  .pp-head b{color:#14171b;}
  .hdr-btn,.pp-head button,.hist-item .hi-actions button,.mbtn-no{background:#eef0f3;color:#14171b;}
  .field-hint,.pp-empty,.hist-item .hi-desc,.modal-box .mbody{color:#5a616c;}
  .hist-item,.modal-box{background:#fff;}
  .hist-item .hi-cust,.modal-box .mtitle{color:#14171b;}
  .field label{color:#5a616c;}
  .field input,.field textarea,.hist-filter button{background:#fff;border:1px solid #e3e6ea;color:#14171b;}
  .hist-filter button{background:#f3f4f6;}
  .hist-item.estimate .hi-num{color:#5a616c;}
  .cust-type-tag.ind{background:#e6eef6;color:#1f6fd0;}
  .cust-type-tag.biz{background:#f6ece6;color:#9a6a00;}

  /* ===== DARK chrome — follows the global Light/Dark toggle. Overrides the light rules above by
     specificity. The printable RECEIPT-CARD PREVIEW intentionally keeps its paper (white) look. ===== */
  [data-bt-theme="dark"]{ --bg:#14171b; --light:#1f232a; }
  [data-bt-theme="dark"] body{ background:#14171b; color:#f4f5f7; }
  [data-bt-theme="dark"] header,[data-bt-theme="dark"] .pp-head{ background:#1f232a; }
  [data-bt-theme="dark"] header h1{ color:#f4f5f7; }
  [data-bt-theme="dark"] header .sub{ color:#9aa1ac; }
  [data-bt-theme="dark"] .hdr-btn{ border-color:#3a414c; }
  [data-bt-theme="dark"] .pp-head b{ color:#f4f5f7; }
  [data-bt-theme="dark"] .hdr-btn,[data-bt-theme="dark"] .pp-head button,
  [data-bt-theme="dark"] .hist-item .hi-actions button,[data-bt-theme="dark"] .mbtn-no{ background:#2c313a;color:#f4f5f7; }
  [data-bt-theme="dark"] .field-hint,[data-bt-theme="dark"] .pp-empty,
  [data-bt-theme="dark"] .hist-item .hi-desc,[data-bt-theme="dark"] .modal-box .mbody{ color:#9aa1ac; }
  [data-bt-theme="dark"] .hist-item,[data-bt-theme="dark"] .modal-box{ background:#1f232a; }
  [data-bt-theme="dark"] .hist-item .hi-cust,[data-bt-theme="dark"] .modal-box .mtitle{ color:#f4f5f7; }
  [data-bt-theme="dark"] .field label{ color:#9aa1ac; }
  [data-bt-theme="dark"] .field input,[data-bt-theme="dark"] .field textarea,
  [data-bt-theme="dark"] .hist-filter button{ background:#2c313a;border-color:#3a414c;color:#f4f5f7; }
  [data-bt-theme="dark"] .hist-filter button{ background:#252a32; }
  [data-bt-theme="dark"] .hist-item.estimate .hi-num{ color:#9aa1ac; }
  [data-bt-theme="dark"] .cust-type-tag.ind{ background:rgba(74,163,255,.16);color:#7fb8ff; }
  [data-bt-theme="dark"] .cust-type-tag.biz{ background:rgba(242,180,58,.16);color:#f2b43a; }
  /* ---- Read-only Receipts mode (view/search/reprint only; no create/charge) ---- */
  body.ro-mode #chat, body.ro-mode header .hdr-btn[onclick*="openHist"]{ display:none !important; }
  #roWrap{ display:none; }
  /* fill the space between header and the bottom nav so the nav stays pinned to the bottom;
     scroll the list inside #roWrap (body is height:100vh; overflow:hidden). */
  body.ro-mode #roWrap{ display:block; flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; width:100%; max-width:760px; margin:0 auto; padding:14px 14px 24px; }
  .ro-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:4px 2px 10px; }
  .ro-head h2{ font-size:19px; margin:0; }
  .ro-head .ro-sub{ font-size:12px; color:#8a9099; }
  .ro-tabs{ display:flex; gap:8px; margin-bottom:10px; }
  .ro-tabs button{ flex:1; background:#eef1f5; border:1px solid #d7dbe0; color:#4a5563; padding:11px; border-radius:10px; font-size:14px; font-weight:800; cursor:pointer; }
  .ro-tabs button.on{ background:#2a7de1; border-color:#2a7de1; color:#fff; }
  .ro-search{ width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #c7ccd3; border-radius:10px; font-size:15px; margin-bottom:10px; }
  #roList{ display:flex; flex-direction:column; gap:9px; }
  .ro-item{ background:#fff; border:1px solid #e6e9ee; border-left:3px solid #2a7de1; border-radius:10px; padding:11px 13px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .ro-item.invoice{ border-left-color:#e08a2a; } .ro-item.estimate{ border-left-color:#9098a3; }
  .ro-item.nastf{ border-left-color:#6b8cff; }
  .ro-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .ro-num{ font-weight:800; color:#14171b; } .ro-amt{ font-weight:800; color:#14171b; white-space:nowrap; }
  .ro-cust{ font-size:13.5px; color:#222; margin-top:2px; } .ro-desc{ font-size:11.5px; color:#7a818b; margin-top:2px; }
  .ro-badges{ margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .ro-actions{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .ro-actions button{ flex:1; min-width:84px; min-height:42px; background:#f1f3f6; border:1px solid #d7dbe0; color:#28303a; padding:9px 8px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
  .ro-actions button:active{ background:#2a7de1; color:#fff; }
  .ro-filed{ display:flex; align-items:center; gap:8px; margin-top:9px; font-size:13.5px; font-weight:700; color:#28303a; }
  .ro-filed input{ width:20px; height:20px; }
  .ro-filed.locked{ color:#9098a3; }
  .ro-empty{ text-align:center; color:#9098a3; margin-top:46px; font-size:14px; }
  /* tap-to-view affordance on a read-only row */
  .ro-open{ cursor:pointer; position:relative; }
  .ro-open:hover{ opacity:.92; }
  /* in-app PDF viewer (modal) — view default, download/print one tap away */
  .ro-viewer{ position:fixed; inset:0; z-index:9999; background:rgba(15,18,22,.88); display:none; flex-direction:column; }
  .ro-viewer.open{ display:flex; }
  .ro-viewer-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:#1a1d22; color:#fff; flex:0 0 auto; }
  .ro-viewer-title{ font-weight:800; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ro-viewer-btns{ display:flex; gap:8px; flex:0 0 auto; }
  .ro-viewer-btns button{ min-height:42px; padding:8px 13px; border:0; border-radius:9px; font-weight:800; font-size:14px; cursor:pointer; background:#33404e; color:#fff; }
  #roViewerPrint{ background:#2a7de1; } #roViewerDl{ background:#1f8f43; } #roViewerClose{ background:#444b55; min-width:44px; }
  .ro-viewer-body{ flex:1; min-height:0; background:#3a3d42; position:relative; }
  .ro-viewer-doc{ width:100%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; box-sizing:border-box; }
  .ro-viewer-doc .receipt-card{ max-width:580px; margin:0 auto; }
  @media (max-width:560px){ .ro-viewer-btns button{ padding:8px 11px; font-size:13px; } .ro-viewer-title{ font-size:13px; } }
  @keyframes d1pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  [data-bt-theme="dark"] body.ro-mode, [data-bt-theme="dark"] .ro-item{ }
  [data-bt-theme="dark"] .ro-item{ background:#2a2f37; border-color:#3a414c; }
  [data-bt-theme="dark"] .ro-num,[data-bt-theme="dark"] .ro-amt,[data-bt-theme="dark"] .ro-cust{ color:#f4f5f7; }
  [data-bt-theme="dark"] .ro-tabs button{ background:#252a32; border-color:#3a414c; color:#cdd2da; }
  [data-bt-theme="dark"] .ro-actions button{ background:#333a44; border-color:#3a414c; color:#e7e9ee; }
  [data-bt-theme="dark"] .ro-search{ background:#2c313a; border-color:#3a414c; color:#f4f5f7; }
  /* ===== Results surface (#chat): the finished receipt card + its actions, or the empty "start" panel ===== */
  .res-note{font-size:14.5px;font-weight:700;color:#14171b;padding:4px 2px;}
  .res-card{display:flex;}
  .res-actions{display:flex;flex-wrap:wrap;gap:8px;max-width:92%;}
  .res-actions button{flex:1 1 140px;min-height:44px;border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#eef0f3;color:#14171b;}
  .res-actions button.primary{background:var(--red);color:#fff;}
  .res-home{max-width:420px;width:100%;margin:30px auto 0;text-align:center;background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:22px 18px;}
  .res-home h2{font-size:18px;margin-bottom:6px;color:#14171b;}
  .res-home p{font-size:13.5px;color:#5a616c;margin-bottom:14px;line-height:1.45;}
  .res-home button{width:100%;min-height:48px;border:none;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;background:#eef0f3;color:#14171b;}
  .res-home button.primary{background:linear-gradient(180deg,#c8323c,#8f1f27);color:#fff;}
  [data-bt-theme="dark"] .res-note{color:#f4f5f7;}
  [data-bt-theme="dark"] .res-actions button{background:#2c313a;color:#f4f5f7;}
  [data-bt-theme="dark"] .res-actions button.primary{background:var(--red);color:#fff;}
  [data-bt-theme="dark"] .res-home{background:#1f232a;border-color:#3a414c;}
  [data-bt-theme="dark"] .res-home h2{color:#f4f5f7;}
  [data-bt-theme="dark"] .res-home p{color:#9aa1ac;}
  [data-bt-theme="dark"] .res-home button{background:#2c313a;color:#f4f5f7;}
  [data-bt-theme="dark"] .res-home button.primary{background:linear-gradient(180deg,#c8323c,#8f1f27);color:#fff;}

  /* ===== Quick invoice — the one builder (every role; cost/discount/tax-rate controls are editPricing-only) ===== */
  .qi-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99998;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px;}
  .qi-box{background:#fff;color:#14171b;width:100%;max-width:520px;border-radius:16px;padding:16px;margin:auto;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
  .qi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  .qi-head b{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qi-x{background:none;border:none;color:#5a616c;font-size:26px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin:-6px -8px -6px 0;flex:0 0 auto;}
  .qi-l{display:block;font-size:12px;color:#5a616c;margin:10px 0 4px;font-weight:600;}
  .qi-l .m{color:#9aa1ac;font-weight:400;}
  .qi-l .req{color:#c8323c;}

<!-- In-app invoice viewer: renders the existing PDF engine to an inline preview
     (no auto-download). Read-only — no edit/charge path. The PDF carries sell
     prices only (never cost/margin), so it's safe for every role. -->
<div id="roViewer" class="ro-viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Invoice viewer">

  </div>

<!-- Persistent app navigation — main + quick menu, always one tap away (bottom bar on phones). -->
<nav id="appnav"><!-- 8z74: the SAME bottom bar as the main app (this person's own picks), then More -->
  <a href="index.html?go=schedule"><span class="ic">📅</span>Schedule</a>
  <a href="bittings.html?quote=1"><span class="ic">💬</span>Quote</a>
  <a href="bittings.html?receipts=1" class="active"><span class="ic">🧾</span>Receipts</a>
  <a href="index.html?go=inventory"><span class="ic">📦</span>Stock</a>
  <a href="index.html?menu=1"><span class="ic">⋯</span>More</a>
</nav>
<script>
/* 8z74 (owner, 2026-11-12: "on the receipts page the bottom bar has a lot of stuff, I don't know why"): this page had its own
   fixed list of six tabs (Schedule was there twice). It now shows exactly what the main app's bottom bar shows — the main app
   saves the tabs this person picked (tks_bottombar_view) — and "More" opens the main app with its full menu out. */
try{ (function(){
  var v=null; try{ v=JSON.parse(localStorage.getItem('tks_bottombar_view')||'null'); }catch(e){}
  if(!Array.isArray(v) || !v.length) return;
  var nav=document.getElementById('appnav'); if(!nav) return;
  var isQuote=/[?&]quote=1/.test(location.search), html='';
  v.slice(0,4).forEach(function(o){ if(!o || !o.go) return;
    var href = o.go==='quote' ? 'bittings.html?quote=1' : o.go==='receipts' ? 'bittings.html?receipts=1' : ('index.html?go='+encodeURIComponent(o.go));
    var on = (o.go==='quote' && isQuote) || (o.go==='receipts' && !isQuote);
    var a=document.createElement('a'); a.href=href; if(on) a.className='active';
    var ic=document.createElement('span'); ic.className='ic'; ic.textContent=o.ic||'•'; a.appendChild(ic); a.appendChild(document.createTextNode(o.label||o.go));
    html+=a.outerHTML; });
  nav.innerHTML=html+'<a href="index.html?menu=1"><span class="ic">⋯</span>More</a>';
})(); }catch(e){}
</script>

function readLS(key, fallback){
  try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; }
}
function writeLS(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error(e); }
}
function getSettings(){
  const s = readLS("tks_settings", null);
  if(!s) return null;
  return Object.assign({}, DEFAULT_SETTINGS, s);
}
function saveSettingsObj(s){ writeLS("tks_settings", s); }
// Receipts + customers now flow through the shared data layer (TKS), so they
// share ONE deduped list with the staff app and sync to the cloud when signed
// in. Falls back to localStorage if TKS isn't loaded for any reason.
function getHistory(){ try{ return TKS.list("receipts"); }catch(e){ return readLS("tks_receipts", []); } }
function saveHistory(arr){ try{ TKS.saveList("receipts", arr); }catch(e){ writeLS("tks_receipts", arr); } }
function getCustomers(){ try{ return TKS.list("customers"); }catch(e){ return readLS("tks_customers", []); } }
function saveCustomers(arr){ try{ TKS.saveList("customers", arr); }catch(e){ writeLS("tks_customers", arr); } }

// Line-item categories. Each has a default taxable treatment (flippable per item).
const LINE_CATEGORIES = [
  {key:"Labor",        label:"Labor / Service",   defaultTax:false},
  {key:"Materials",    label:"Materials / Parts", defaultTax:true},
  {key:"Travel",       label:"Travel / Mileage",  defaultTax:false},
  {key:"Programming",  label:"Programming",       defaultTax:false, autoOnly:true},
  {key:"AfterHours",   label:"After-Hours",       defaultTax:false},
  {key:"Discount",     label:"Discount",          defaultTax:false, isDiscount:true}
];
/* 8z96 (owner, 2026-11-12: "there are no taxable services / labor — it all should be no tax"). Only parts carry sales tax:
   a line in Materials / Parts, or a stock part. "Car lockout" had been taxed because its name contains the word "lock".
   (A shop in a state that taxes labor would switch on config.taxServices — there is no screen for that yet.) */
function svcTaxOn(){ try{ return !!(window.TKS && TKS.Config && TKS.Config.get().taxServices); }catch(e){ return false; } }
function taxAllowed(category, partId){ return svcTaxOn() || String(category||"")==="Materials" || !!partId; }
function catDefaultTax(key){
  if(key!=="Materials" && !svcTaxOn()) return false;
  // Owner config (cloud-synced) overrides the built-in default per category.
  try{ const cfg=(window.TKS&&TKS.Config)?TKS.Config.get():null;
    if(cfg && cfg.taxableByCategory && key in cfg.taxableByCategory) return !!cfg.taxableByCategory[key]; }catch(e){}
  const c = LINE_CATEGORIES.find(c=>c.key===key);
  return c ? !!c.defaultTax : false;
}
// The default sales-tax rate (%) from the cloud-synced owner config (falls back to
// the old local SETTINGS.taxRate, then 0).
function configTaxRate(){
  try{ const cfg=(window.TKS&&TKS.Config)?TKS.Config.get():null; if(cfg && cfg.taxRate!=null) return Number(cfg.taxRate)||0; }catch(e){}
  return (SETTINGS && SETTINGS.taxRate) ? Number(SETTINGS.taxRate)||0 : 0;
}
// A receipt's own rate (per-receipt override), defaulting to the config rate.
function receiptTaxRate(r){
  return (r && r.taxRate!=null && r.taxRate!=='') ? Number(r.taxRate) : configTaxRate();
}
// ---- Warranty (standard labor/parts warranty configured in Setup) ----
function configWarranty(){
  try{ const w=(window.TKS&&TKS.Config&&TKS.Config.warranty)?TKS.Config.warranty():null;
       if(w) return {months:Number(w.months)||0, defaultOn:!!w.defaultOn}; }catch(e){}
  return {months:0, defaultOn:false};
}
// expiry timestamp = start date + N calendar months
function warrantyUntilTs(startMs, months){ const d=new Date(startMs||Date.now()); d.setMonth(d.getMonth()+(Number(months)||0)); return d.getTime(); }
// 8z44 (owner, 2026-11-11): a warranty is only offered when HARDWARE was sold — a stocked part (partId / Register part line)
// or a Materials / Parts line. Service calls, programming and labor alone carry none.
function receiptHasHardware(its){
  return (its||[]).some(function(it){ if(!it || it.isDiscount || it.declined) return false;
    return !!it.partId || it.lineType==="part" || (it.category||"")==="Materials"; });
}
// Register sales are written by the server without warranty fields. Give one with hardware the shop's standard warranty,
// counted from the day it was paid, so it shows and prints like any other receipt.
function warrantyView(r){
  if(!r) return r;
  if(r.warranty==null && r.source==="pos" && r.docType!=="estimate" && receiptHasHardware(r.items)){
    let m=0; try{ const w=(window.TKS&&TKS.Config&&TKS.Config.warranty)?TKS.Config.warranty():null; m=w?(Number(w.months)||0):0; }catch(e){}
    const start=Number(r.paidAt)||Number(r.savedAt)||0;
    if(m>0 && start) return Object.assign({}, r, { warranty:true, warrantyMonths:m, warrantyStart:start });
  }
  return r;
}
// {until, days, expired, months} for a saved receipt, or null if it carries no warranty
function warrantyInfo(r){
  r=warrantyView(r);
  if(!r || !r.warranty || !Number(r.warrantyMonths)) return null;
  const start=r.warrantyStart||r.savedAt; if(!start) return null;
  const until=r.warrantyUntil||warrantyUntilTs(start, r.warrantyMonths);
  const days=Math.ceil((until-Date.now())/86400000);
  return {until, days, expired:days<0, months:Number(r.warrantyMonths)};
}
// Customer-facing warranty term, e.g. "6 months limited warranty" (no dates). "" if none.
function warrantyTermText(r){
  r=warrantyView(r);
  if(!r || !r.warranty || !Number(r.warrantyMonths) || r.docType==="estimate") return "";
  const m=Number(r.warrantyMonths);
  return m+" month"+(m===1?"":"s")+" limited warranty";
}
// Configured Terms & Conditions URL (Setup → identity). "" when the shop has none.
function configTermsUrl(){
  try{ const id=(window.TKS&&TKS.Config)?TKS.Config.identity():null; if(id&&id.termsUrl!=null && String(id.termsUrl).trim()) return String(id.termsUrl).trim(); }catch(e){}
  return (SETTINGS && SETTINGS.termsUrl) ? String(SETTINGS.termsUrl).trim() : "";
}
function termsHref(u){ return /^https?:\/\//i.test(u) ? u : ("https://"+u); }
function termsDisplay(u){ return u.replace(/^https?:\/\//i,"").replace(/\/+$/,""); }
// Pill HTML for a receipt's warranty (or "" if none). Green→amber→red as it runs down.
function warrantyPillHTML(r){
  const w=warrantyInfo(r); if(!w) return "";
  let bg,fg,txt;
  if(w.expired){ bg="rgba(200,50,60,.14)"; fg="#b3242f"; txt="Warranty expired"; }
  else if(w.days<=30){ bg="rgba(234,88,12,.16)"; fg="#c2410c"; txt=w.days+" day"+(w.days===1?"":"s")+" warranty left"; }   // dark orange — about to expire
  else { bg="rgba(34,153,74,.16)"; fg="#1f8f43"; txt=w.days+" days warranty left"; }
  return '<span style="display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:'+bg+';color:'+fg+'">🛡 '+txt+'</span>';
}
// Compact warranty pill for the receipt-list TILES (sits in the top row between the
// number and the amount). Same green→amber→red countdown, shorter text.
function warrantyPillCompactHTML(r){
  const w=warrantyInfo(r); if(!w) return "";
  let bg,fg,txt;
  if(w.expired){ bg="rgba(200,50,60,.14)"; fg="#b3242f"; txt="Expired"; }
  else if(w.days<=30){ bg="rgba(234,88,12,.16)"; fg="#c2410c"; txt=w.days+"d left"; }   // dark orange — about to expire
  else { bg="rgba(34,153,74,.16)"; fg="#1f8f43"; txt=w.days+"d left"; }
  return '<span class="hi-warr" style="background:'+bg+';color:'+fg+'">🛡 '+txt+'</span>';
}

function escapeHtml(s){

}

function todayStr(){
  const d=new Date();
  const m=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function docPrefix(type){
  return type==="invoice" ? "INV" : type==="estimate" ? "EST" : "TKS";
}
function nextDocNumber(type){
  const d=new Date();
  const ymd=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const prefix=docPrefix(type)+"-"+ymd;
  const used=getHistory().filter(r=>r.number && r.number.startsWith(prefix));
  // 8z45: count-based numbering reused a letter once an earlier receipt of the day was removed, and saving then
  // overwrote the receipt that already had it. Step forward to the first letter nobody has.
  const taken={}; used.forEach(r=>{ taken[r.number]=1; });
  let i=used.length; while(taken[prefix+String.fromCharCode(65+i)]) i++;
  return prefix+String.fromCharCode(65+i);
}

/* 8z80 (owner, 2026-11-12: "I was not able to print a receipt using the shop PC … we need to be able to print a physical

   sent as a PDF. 🖨 Print: if this computer has the Bittings Print Helper (the counter computer with the Star printer) the
   receipt prints there; on any other computer it offers the full-page copy for that computer's own printer. */
function paperCopy(r){
  const t=r.totals||computeTotals(r.items||[], r.payment, receiptTaxRate(r)), est=(r.docType==="estimate");
  let wt=""; try{ wt=warrantyTermText(r)||""; }catch(e){}
  return { number:r.number||"", date:r.date||"", docType:r.docType||"receipt", customer:r.noCustomer?"":(r.customer||""), technician:r.technician||"",
    payment:est?"":(r.payment||""), status:est?"":(r.status||""),
    items:(r.items||[]).filter(it=>it && !it.declined).map(it=>({ desc:String(it.desc||"")+(it.vehicle?(" - "+it.vehicle):""), amount:it.amount, qty:parseInt(it.qty,10)||1, isDiscount:!!it.isDiscount })),
    moreVehicles:moreVehList(r).map(l=>l.replace(/\s*\u00b7\s*/g," - ")),
    totals:t, vehicleText:vehicleString(r)||"", vin:r.vin||"", serviceWhere:r.serviceWhere||"", taxExempt:r.taxExempt||null,
    exemptLabel:(r.taxExempt && window.TKS_EXEMPT)?TKS_EXEMPT.label(r.taxExempt).replace(/\s*·\s*/g," - "):"", warrantyText:wt, notes:r.notes||"" };
}
function printFullPage(r){
  let out; try{ out=makePDF(r, "en", true, true); }catch(e){ appAlert("Print failed", (e&&e.message)||"Could not build the page."); return; }
  if(!(out && out.blob)) return;
  const url=URL.createObjectURL(out.blob), w=window.open(url, "_blank");
  if(!w){ const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
}
function printPaper(r, btn, reprint){
  const say=m=>{ if(btn){ btn.textContent=m; } }, was=btn?btn.textContent:"";
  const back=()=>{ if(btn){ setTimeout(()=>{ btn.textContent=was; btn.disabled=false; }, 2500); } };
  const hw=window.TKS_HW;
  const noPrinter=()=>{ if(btn){ btn.textContent=was; btn.disabled=false; }
    appConfirm("No receipt printer on this computer", "The receipt printer is connected to the counter computer. Open a full-page copy to print on this computer's own printer instead?").then(ok=>{ if(ok) printFullPage(r); }); };
  if(hw && hw.printDoc){ hw.printDoc(paperCopy(r), { btn:btn, reprint:!!reprint, paidAt:r.paidAt, fullPage:()=>printFullPage(r), ask:(t,b)=>appConfirm(t,b), alert:(t,b)=>appAlert(t,b) }); return; }   // 8z81: the shared routine
  if(!(hw && hw.thermal)){ noPrinter(); return; }
  if(btn){ btn.disabled=true; } say("🖨 Printing…");
  /* Send the receipt straight to the helper. (The first version asked the helper for its status first and gave up after
     3 seconds — but that status check alone takes about 3 seconds on the counter computer, so it always fell back to
     the PDF.) Nothing listening on this computer fails at once → offer the full-page copy; the helper answering with an
     error means the printer itself has a problem → say so. */
  // the cash drawer opens only for a payment taken in the last few minutes — never on a reprint
  const fresh=!reprint && r.paidAt && (Date.now()-Number(r.paidAt) < 10*60000);
  hw.thermal.printReceipt(paperCopy(r), { force:true, noDrawer:!fresh }).then(()=>{ say("✓ Sent to the printer"); back(); },
    e=>{ const m=String((e&&e.message)||"");
      if(/reach the Bittings Print Helper/i.test(m)){ noPrinter(); return; }
      if(btn){ btn.textContent=was; btn.disabled=false; }
      appAlert("Did not print", (m||"The printer did not answer.")+" Check that the receipt printer is on and has paper."); });
}
/* 8z84 (owner, 2026-11-12: "we need to be able to add a 2nd, 3rd vehicle … a couple that come in for multiple different
   vehicles, or we go to them and do multiple cars"). r.moreVehicles = [{year, make, model, vin, text}] holds vehicles 2, 3…
   (the first stays in vehYear / vehMake / vehModel / vin, so everything written before still works). A line that belongs
   to one vehicle carries it.vehicle (its label); when printed, that label is added after the description. */
function moreVehList(r){ return (Array.isArray(r&&r.moreVehicles)?r.moreVehicles:[]).map(function(v){ if(!v) return ""; var n=[v.year,v.make,v.model].filter(Boolean).join(" ")||String(v.text||"").trim();
  return [n, v.vin?("VIN "+v.vin):"", v.d1===true?("NASTF D1 — "+[v.color, v.odometer?(/^no /i.test(v.odometer)?v.odometer:(v.odometer+" mi")):"", v.plate?(/^no /i.test(v.plate)?v.plate:("tag "+v.plate)):""].filter(Boolean).join(", ")):""].filter(Boolean).join(" · "); }).filter(Boolean); }

function docWithVehicles(r){ try{ if(!r || !Array.isArray(r.items) || !r.items.some(function(it){ return it && it.vehicle; })) return r;
  return Object.assign({}, r, { items:r.items.map(function(it){ return (it && it.vehicle) ? Object.assign({}, it, { desc:String(it.desc||"")+" — "+it.vehicle }) : it; }) }); }catch(e){ return r; } }

/* Start-a-job (index.html) hands over sessionStorage 'tks_job_draft' =
   {category:'automotive'|'residential'|'commercial', vehicle:'2019 Honda Civic', items:[{name,price}], ts}.
   8r: the Scheduler's "Invoice this job" adds jobId, fromDispatch:true and items[].{qty, partId, fromDispatch:true}.
   Turn it into a builder prefill. */
function jobDraftToPrefill(d){
  if(!d || typeof d!=="object") return null;
  const p={};
  try{ const lbl=(window.TKS&&TKS.ServiceCats&&d.category)?TKS.ServiceCats.invoiceLabel(String(d.category)):""; if(lbl) p.serviceType=lbl; }catch(e){}
  if(!p.serviceType && d.category){ const c=String(d.category); p.serviceType=c.charAt(0).toUpperCase()+c.slice(1); }
  const v=String(d.vehicle||"").trim();
  if(v){ const m=v.match(/^(\d{4})\s+(\S+)\s+(.+)$/); if(m){ p.vehYear=m[1]; p.vehMake=m[2]; p.vehModel=m[3]; } p.vehicle=v; }
  if(/^[A-HJ-NPR-Z0-9]{17}$/i.test(String(d.vin||""))) p.vin=String(d.vin).toUpperCase();
  p.items=(Array.isArray(d.items)?d.items:[]).filter(it=>it && (it.name||it.desc)).map(it=>{
    const price=(it.price!==""&&it.price!=null)?Number(it.price):(it.amount!=null?Number(it.amount):NaN);
    const o={ desc:String(it.name||it.desc), amount:isNaN(price)?null:price };
    const q=parseInt(it.qty,10); if(q>0) o.qty=q;
    if(it.partId) o.partId=String(it.partId);
    if(Number(it.unitCost)>0) o.unitCost=Number(it.unitCost);   // 8z74: a stock part brings its cost
    if(it.category) o.category=String(it.category);
    if(it.taxable!=null) o.taxable=!!it.taxable;
    // 8r: lines the Scheduler dispatched stay tagged (locked for technicians — "Didn't do this" instead of delete)
    if(it.fromDispatch===true || (d.fromDispatch && it.fromDispatch!==false)){ o.fromDispatch=true; if(d.jobId) o.jobId=String(d.jobId); }
    return o;
  });
  if(d.jobId) p.jobId=String(d.jobId);
  if(d.fromDispatch) p.fromDispatch=true;
  if(d.customer) p.customer=String(d.customer);
  if(d.address) p.address=String(d.address);
  if(d.serviceWhere==="shop"||d.serviceWhere==="mobile") p.serviceWhere=d.serviceWhere;   // 8z78
  if(d.fromEstimate) p.fromEstimate=String(d.fromEstimate);   // 8z81
  if(Array.isArray(d.moreVehicles) && d.moreVehicles.length) p.moreVehicles=d.moreVehicles;   // 8z84
  if(d.taxExempt && typeof d.taxExempt==="object") p.taxExempt=d.taxExempt;
  if(d.internalNotes) p.internalNotes=String(d.internalNotes);   // 8z45   // 8z41: the job's address was handed over but never used
  // 8n: Start-a-job can also pass the chosen customer record → phone / email ride along (name wins if both given)
  if(d.customerInfo && typeof d.customerInfo==="object"){ const ci=d.customerInfo; if(!p.customer && ci.name) p.customer=String(ci.name); if(ci.phone) p.phone=String(ci.phone); if(ci.email) p.email=String(ci.email); if(ci.id) p.customerId=String(ci.id); }
  return p;
}

function openSignaturePad(onDone){

  const auth = tu
    ? ("By signing, I authorize the work described and agree to "+shop+"&rsquo;s <a href=\""+escapeHtml(termsHref(tu))+"\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit;text-decoration:underline\">Terms &amp; Conditions</a>.")
    : ("By signing, I authorize the work described by "+shop+".");
  const ov=document.createElement("div"); ov.className="sig-ov";
  ov.innerHTML='<div class="sig-box"><div class="t">CUSTOMER SIGNATURE</div><div class="auth">'+auth+'</div>'+
    '<canvas width="600" height="280"></canvas>'+
    '<div class="acts"><button type="button" class="clear">Clear</button><button type="button" class="skip">Cancel</button><button type="button" class="save">Save</button></div></div>';
  document.body.appendChild(ov);
  const canvas=ov.querySelector("canvas"), ctx=canvas.getContext("2d");
  ctx.lineWidth=2.5; ctx.lineCap="round"; ctx.strokeStyle="#111";
  let drawing=false, last=null, hasDrawn=false;
  function pt(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)}; }
  function start(e){ e.preventDefault(); drawing=true; last=pt(e); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pt(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; hasDrawn=true; }
  function end(){ drawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end); canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end);
  function close(){ ov.remove(); }
  ov.querySelector(".clear").onclick=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn=false; };
  ov.querySelector(".skip").onclick=()=>{ close(); onDone(null); };
  ov.querySelector(".save").onclick=()=>{
    if(!hasDrawn){ appAlert("No signature yet","Sign in the box, or tap Cancel."); return; }
    const data=canvas.toDataURL("image/png"); close(); onDone(data);
  };
}

function showModal(opts){

/* Return the vehicle string to display on a receipt/PDF.
   New records use vehYear/vehMake/vehModel separately. Older records
   used a single 'vehicle' field. Falls back to the single field. */
function vehicleString(r){
  const parts = [r.vehYear, r.vehMake, r.vehModel].filter(p => p && String(p).trim());
  if(parts.length > 0) return parts.join(" ");
  return r.vehicle || "";
}

/* ==========================================================
   TOTALS & FINISH
   ========================================================== */
function computeTotals(its, payment, taxRatePct){
  const ratePct = (taxRatePct!=null ? Number(taxRatePct) : configTaxRate()) || 0;
  const taxRate=ratePct/100;
  const surchargeRate=(SETTINGS.surcharge||0)/100;
  // Sum up positive line items by taxable bucket
  let taxable=0, nontax=0;
  its.forEach(it=>{
    if(it.isDiscount || it.declined) return;   // 8r: "didn't do this" lines never count
    if(it.taxable) taxable+=it.amount; else nontax+=it.amount;
  });
  const grossSubtotal = taxable + nontax;

  // Compute total discount amount from any discount lines
  let discountTotal = 0;
  its.forEach(it=>{
    if(!it.isDiscount) return;
    if(it.discountMode==="percent"){
      discountTotal += grossSubtotal * (it.discountValue/100);
    }else{
      discountTotal += it.discountValue;
    }
  });
  if(discountTotal > grossSubtotal) discountTotal = grossSubtotal; // never below zero
  discountTotal = Math.round(discountTotal*100)/100;

  // Apply discount PROPORTIONALLY across taxable and non-taxable buckets,
  // so tax is only charged on the discounted taxable portion.
  let discTaxable = 0, discNontax = 0;
  if(grossSubtotal > 0 && discountTotal > 0){
    discTaxable = discountTotal * (taxable / grossSubtotal);
    discNontax  = discountTotal * (nontax  / grossSubtotal);
  }
  const taxableAfter = Math.max(0, taxable - discTaxable);
  const nontaxAfter  = Math.max(0, nontax  - discNontax);

  const subtotalAfter = Math.round((taxableAfter + nontaxAfter)*100)/100;
  const tax=Math.round(taxableAfter*taxRate*100)/100;
  const preCard=subtotalAfter+tax;
  const surcharge=(payment==="Card")? Math.round(preCard*surchargeRate*100)/100 : 0;
  const total=Math.round((preCard+surcharge)*100)/100;

  return {
    taxable, nontax,                  // gross (pre-discount) buckets
    grossSubtotal,
    discount: discountTotal,
    taxableAfter: Math.round(taxableAfter*100)/100,
    nontaxAfter: Math.round(nontaxAfter*100)/100,
    subtotal: subtotalAfter,          // subtotal AFTER discount
    tax, surcharge, total,
    taxRate:ratePct, surchargeRate:SETTINGS.surcharge
  };
}

// A lockout (just opening a door) has no key/lock/part to stand behind, so it gets
// no warranty. True when every line item is a lockout/unlock and none are parts/programming.
function isLockoutOnly(its){
  if(!its || !its.length) return false;
  let real=false, nonLockout=false, partOrProg=false;
  its.forEach(it=>{ const d=(it.desc||"").toLowerCase().trim(); if(!d) return; real=true;
    const cat=it.category||""; if(cat==="Materials"||cat==="Programming") partOrProg=true;
    if(!/lock\s*out|unlock/.test(d)) nonLockout=true; });
  return real && !nonLockout && !partOrProg;
}
// NASTF D1: start the filing countdown on a fresh tag; preserve an existing deadline /
// filed status when re-saving (filing itself is done server-side via set_d1_filed).
function d1Days(){ try{ return (window.TKS&&TKS.Config&&TKS.Config.d1Days)?TKS.Config.d1Days():5; }catch(e){ return 5; } }
function d1DueFrom(days){ var d=new Date(); d.setDate(d.getDate()+(parseInt(days,10)||5)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function stampD1Nastf(info, prior){
  if(!info || !info.type) return info || null;
  prior = prior || {};
  var days = (prior.d1Days!=null) ? prior.d1Days : d1Days();
  var out = { type: info.type, d1Days: days, d1DueDate: prior.d1DueDate || d1DueFrom(days), d1Filed: !!prior.d1Filed };
  if(prior.d1FiledAt) out.d1FiledAt = prior.d1FiledAt;
  if(prior.d1FiledBy) out.d1FiledBy = prior.d1FiledBy;
  if(prior.d1FiledByName) out.d1FiledByName = prior.d1FiledByName;
  return out;
}
function finish(){
  receipt.docType=docType;
  // Preserve identity when EDITING an existing doc (quick-form edit sets these); only
  // mint a new number/date/timestamp for a brand-new document.
  if(!receipt.number) receipt.number=nextDocNumber(docType);
  if(!receipt.date) receipt.date=todayStr();
  if(!receipt.savedAt) receipt.savedAt=Date.now();
  if(!receipt.id) receipt.id="rcpt_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); // stable id for cloud sync + Pay Now
  receipt.items=items.slice();
  if(receipt.taxRate==null || receipt.taxRate==='') receipt.taxRate=configTaxRate(); // snapshot rate (per-receipt override defaults to config)
  // Warranty: the builder sets receipt.warranty explicitly; if a caller leaves it undefined →
  // apply the Setup default. Estimates never carry a warranty. Stamp the expiry once.
  (function(){
    const w=configWarranty();
    if(docType==="estimate"){ receipt.warranty=false; receipt.warrantyMonths=0; }
    else{
      if(receipt.warranty===undefined) receipt.warranty = (w.defaultOn && w.months>0);
      if(!receipt.warrantyMonths) receipt.warrantyMonths = w.months;
      if(isLockoutOnly(items)) receipt.warranty=false;   // lockouts carry no warranty
      if(!receiptHasHardware(items)) receipt.warranty=false;   // 8z44: no hardware sold → no warranty
      if(receipt.warranty && receipt.warrantyMonths){ receipt.warrantyStart=receipt.savedAt; receipt.warrantyUntil=warrantyUntilTs(receipt.savedAt, receipt.warrantyMonths); }
      else receipt.warranty=false;
    }
  })();
  receipt.totals=computeTotals(items, receipt.payment, receipt.taxRate);
  receipt.signature=signatureData;
  receipt.nastf=stampD1Nastf(nastfInfo, receipt.nastf);   // start/keep the D1 filing countdown
  if(!receipt.technician) receipt.technician=currentTechnician();  // groundwork for commission
  // Save customer/shop to DB (if we have at least a name)
  if(receipt.customer && !receipt.noCustomer){
    const isContracting = nastfInfo && nastfInfo.type==="Contracting D1";
    if(isContracting){
      const list=getShops();
      const existing=list.find(s=>(s.customer||s.name||"").toLowerCase()===receipt.customer.toLowerCase());
      const shopData={
        customer:receipt.customer, contact:receipt.contact||"",
        phone:receipt.phone||"", email:receipt.email||"",
        address:receipt.address||""
      };
      if(existing){ Object.assign(existing, shopData); existing.lastUsed=Date.now(); }
      else{ list.push(Object.assign({}, shopData, {lastUsed:Date.now()})); }
      saveShops(list);
      // Also save the VEHICLE OWNER as a customer — they're not the bill-to, but we
      // already have their info (referrals + marketing list).
      if((receipt.voName||"").trim()){
        const cl=getCustomers(); const vn=receipt.voName.trim();
        const ex=cl.find(c=>(c.customer||"").toLowerCase()===vn.toLowerCase());
        const voData={ customer:vn, contact:"", phone:receipt.voPhone||"", email:"",
          address:[receipt.voCity,receipt.voState].filter(Boolean).join(", "),
          customerType:"individual", source:"contracting-vehicle-owner" };
        if(ex){ Object.assign(ex, voData); ex.lastUsed=Date.now(); }
        else{ cl.push(Object.assign({}, voData, {lastUsed:Date.now()})); }
        saveCustomers(cl);
      }
    }else{
      const list=getCustomers();
      const existing=list.find(c=>(c.customer||"").toLowerCase()===receipt.customer.toLowerCase());
      const custData={
        customer:receipt.customer, contact:receipt.contact||"",
        phone:receipt.phone||"", email:receipt.email||"",
        address:receipt.address||"",
        customerType: receipt.customerType || "individual"
      };
      if(existing){ Object.assign(existing, custData); existing.lastUsed=Date.now(); }
      else{ list.push(Object.assign({}, custData, {lastUsed:Date.now()})); }
      saveCustomers(list);
    }
  }
  try{ logDispatchEvents(receipt); }catch(e){}   // 8r: per-job running log (declines, added lines, keys scanned out) — once per event
  const hist=getHistory();
  // 8z59: two phones can hand out the same number (each numbers from its own copy of the list). Matching on the NUMBER then
  // treated a different document as "this one" and replaced it. Match on id; fall back to the number only for old records with no id.
  let _exIdx=hist.findIndex(x=> receipt.id && x.id===receipt.id);
  if(_exIdx<0) _exIdx=hist.findIndex(x=> !x.id && receipt.number && x.number===receipt.number);
  if(_exIdx>=0) hist[_exIdx]=receipt; else hist.unshift(receipt);   // update on edit, add when new
  saveHistory(hist);
  // A paid sale (cash/check/marked-paid receipt) consumes its parts now.
  if(_receiptIsPaid(receipt)) applyStockForReceipt(receipt);
  // Log cash/check/Zelle/other paid sales as a transaction so they show in Dashboard/Reports/Closeout
  // (card sales log via Pay Now; estimates/unpaid/partial don't; never logs the same receipt twice). 8j: + zelle, other
  if(receipt.docType==="receipt" && receipt.status==="Paid in Full"
     && /^(cash|check|zelle|other)$/i.test(receipt.payment||"") && !receipt.cashLogged
     && typeof window.recordCashSale==="function"){
    window.recordCashSale(receipt, String(receipt.payment).toLowerCase()).then(function(res){
      if(res && !res.error){ receipt.cashLogged=true; try{ _syncReceiptInHistory(receipt); }catch(_){ } }
      else { try{ console.warn("Cash/check sale not logged to transactions:", res&&res.error); }catch(_){ } }
    });
  }

  chat.innerHTML="";
  /* 8z44: plain status line instead of the old chat-style "Done! Here's …" */
  resultNote("✓ "+(receipt.docType==="estimate"?"Estimate":receipt.docType==="invoice"?"Invoice":"Receipt")+" "+receipt.number+" saved"+(receipt.docType==="receipt"&&receipt.status?(" — "+receipt.status):""));
  renderReceiptCard(receipt);

  // Contracting D1 — remind user to delete photos per NASTF rules
  if(nastfInfo && nastfInfo.type==="Contracting D1"){
    setTimeout(()=>{
      appAlert("Delete photos now",
        "NASTF requires you to delete the DL and ownership doc photos from your phone after the job. Do that now while you remember.");
    }, 800);
  }
  finishedActions(receipt);
}
/* 8z65: turn an estimate into an invoice. A NEW document with its own id and INV number; the estimate is kept.
   (Before, the copy kept the estimate's id, so the two records could overwrite each other.) */
function estimateToInvoice(r){
  const inv=JSON.parse(JSON.stringify(r));
  inv.id="rcpt_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  inv.docType="invoice"; inv.status="Unpaid";
  inv.number=nextDocNumber("invoice");
  inv.date=todayStr(); inv.savedAt=Date.now();
  inv.fromEstimate=r.number;
  delete inv.signature;
  const hist=getHistory(); hist.unshift(inv); saveHistory(hist);
  return inv;
}
/* 8z65: book the job an estimate was written for — hands the customer, vehicle and priced lines to the Scheduler's new-job form. */
function estimateToJob(r){
  const lines=(r.items||[]).filter(it=>it && !it.isDiscount && !it.declined).map(it=>{
    const q=Math.max(1, parseInt(it.qty,10)||1), amt=Number(it.amount)||0;
    return { desc:String(it.desc||"Service"), qty:q, each:Math.round(amt/q*100)/100, amount:amt, taxable:!!it.taxable, partId:it.partId||"" }; });
  const d={ fromEstimate:r.number||"", estimateId:r.id||"", serviceType:r.serviceType||"",
    customer:{ name:r.noCustomer?"":(r.customer||""), phone:r.phone||"", email:r.email||"" }, address:r.address||"",
    vehicle:{ year:r.vehYear||"", make:r.vehMake||"", model:r.vehModel||"", vin:r.vin||"" }, vehicleText:r.vehicle||"",
    items:lines, notes:r.notes||"", internalNotes:r.internalNotes||"", serviceWhere:r.serviceWhere||"", taxExempt:r.taxExempt||null, moreVehicles:Array.isArray(r.moreVehicles)?r.moreVehicles:[], ts:Date.now() };
  try{ sessionStorage.setItem("tks_quote_job", JSON.stringify(d)); }catch(e){}

function d1PhotoBox(r){ try{ if(!hasD1(r) || !r.id || !window.TKS_RDOCS || r.docType==="estimate") return; const b=document.createElement("div"); b.className="d1-docs"; chat.appendChild(b); TKS_RDOCS.panel(b, r, { pdf:(x)=>makePDF(x, "en", false, true) }); scrollDown(); }catch(e){} }

/* 8r: running per-job log. Each event fires ONCE — flags on the item (declineLoggedQty, addLogged,
   unitIdsLogged) stop a later edit/re-save from logging it again. Demo/offline → TKS.Audit.log is a no-op. */
function logDispatchEvents(r){
  const rid=r.number||r.id||null, job=r.jobId||null;
  (r.items||[]).forEach(it=>{
    if(!it || it.isDiscount) return;
    const dq = it.declined ? (parseInt(it.declinedQty,10)||parseInt(it.dispatchQty,10)||1) : (parseInt(it.declinedQty,10)||0);
    if(dq>0 && it.declineLoggedQty!==dq){
      auditLog('dispatch_line_declined', job?'job':'receipt', job||rid, { desc:it.desc, reason:it.declineReason||'', qty:it.declined?0:(parseInt(it.qty,10)||0),
        declinedQty:dq, full:!!it.declined, receipt:rid, partId:it.partId||null, unitIds:(it.unitIds||[]).slice(), fromDispatch:!!it.fromDispatch });
      it.declineLoggedQty=dq;
    }
    if(job && !it.fromDispatch && !it.addLogged){
      auditLog('dispatch_line_added','job', job, { desc:it.desc, amount:it.amount, qty:parseInt(it.qty,10)||1, partId:it.partId||null, receipt:rid });
      it.addLogged=true;
    }
    if(Array.isArray(it.unitIds) && it.unitIds.length && !it.declined){
      const done=Array.isArray(it.unitIdsLogged)?it.unitIdsLogged.slice():[];
      it.unitIds.forEach(u=>{ if(done.indexOf(u)<0){ auditLog('unit_scanned_out','inventory_units', u, { receipt:rid, partId:it.partId||null, jobId:job }); done.push(u); } });
      it.unitIdsLogged=done;
    }
  });
}
/* 8r: keys still scanned out on this receipt's live (not declined) lines → [{unitId, item, idx}]. */
function receiptScannedUnits(r){
  const out=[]; ((r&&r.items)||[]).forEach((it,i)=>{ if(it && !it.isDiscount && !it.declined && Array.isArray(it.unitIds)) it.unitIds.forEach(u=>out.push({unitId:u, item:it, idx:i})); });
  return out;
}
/* 8r: one scanned key of a SAVED line comes back: drop the id, lower qty (scale the price) or strike the whole line. */
function declineUnitOnItem(it, unitId, reason){
  it.unitIds=(it.unitIds||[]).filter(u=>u!==unitId);
  const q=parseInt(it.qty,10)||1;
  if(it.dispatchAmount==null) it.dispatchAmount=it.amount;
  if(it.dispatchQty==null) it.dispatchQty=q+(parseInt(it.declinedQty,10)||0);
  it.declinedQty=(parseInt(it.declinedQty,10)||0)+1; it.declineReason=reason;
  if(q<=1){ it.declined=true; it.qty=0; it.amount=0; it.cost=0; }
  else { it.qty=q-1; const base=Number(it.dispatchAmount)||0, dq=it.dispatchQty||1; it.amount=Math.round(base*(it.qty/dq)*100)/100; it.cost=lineCost(it.unitCost, it.qty); }
}
/* 8r: "Scan back in" from the finished receipt — a decline AFTER the sale was completed. Lists the receipt's
   scanned keys; scanning one puts it back in stock (server, when stock was applied), marks the line not done
   with a reason, re-totals, saves and logs. */
function scanBackInFromReceipt(r){
  const units=receiptScannedUnits(r);
  if(!units.length){ appAlert("Nothing to scan back in","No keys are scanned out on this receipt."); return; }
  const bd=document.getElementById("modalBackdrop");
  document.getElementById("modalTitle").textContent="↩ Scan a key back in";
  const body=document.getElementById("modalBody"); body.textContent="";
  const p=document.createElement("div"); p.textContent="Keys scanned out on "+(r.number||"this receipt")+". Scan the one the customer didn't take — it goes back in stock and its line is marked not done."; body.appendChild(p);
  const ul=document.createElement("div"); ul.className="nd-units"; ul.innerHTML=units.map(u=>'🔑 '+escapeHtml(shortUnit(u.unitId))+' — '+escapeHtml(u.item.desc||'')).join('<br>'); body.appendChild(ul);
  if(!cloudReady()){ const n=document.createElement("div"); n.className="qi-note"; n.textContent="Demo / offline: the key can't be returned to stock here (needs the live app) — the line is still marked not done."; body.appendChild(n); }
  const btns=document.getElementById("modalBtns"); btns.innerHTML="";
  const cancel=document.createElement("button"); cancel.textContent="Cancel"; cancel.className="mbtn-no"; cancel.onclick=()=>bd.classList.remove("open");
  const go=document.createElement("button"); go.textContent="📷 Scan"; go.className="mbtn-yes";
  go.onclick=()=>{ bd.classList.remove("open");
    scanCode("↩ Scan the key back in","Scan the label of the key the customer didn't take.").then(code=>{
      if(!code) return;
      const hit=units.find(u=>String(u.unitId).toLowerCase()===code.toLowerCase());
      if(!hit){ appAlert("Not on this receipt","Key "+shortUnit(code)+" isn't one of the keys scanned out on "+(r.number||"this receipt")+"."); return; }
      declineReasonPrompt({title:"Didn't do this", body:"“"+(hit.item.desc||"")+"” — why is this key coming back?"}).then(ans=>{
        if(!ans) return;
        declineUnitOnItem(hit.item, hit.unitId, ans.reason);
        r.totals=computeTotals(r.items, r.payment, r.taxRate);
        const applied=!!(r.stockApplied||r.posStockApplied);
        const after=(returned)=>{ try{ logDispatchEvents(r); }catch(e){} _syncReceiptInHistory(r);
          chat.innerHTML=""; resultNote("Updated "+(r.number||"")+" — "+shortUnit(hit.unitId)+(returned?" is back in stock.":" removed; line marked not done.")); renderFinished(r); };
        if(applied && cloudReady()) returnUnitToStock(hit.unitId, ans.reason, r, hit.item.partId).then(after, ()=>after(false)); else after(false);
      });
    });
  };
  btns.appendChild(cancel); btns.appendChild(go); bd.classList.add("open");
}
