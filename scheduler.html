<script>
/* Set theme before the page paints so a dark-mode user never sees a white flash. */
(function(){
  try{
    var s = localStorage.getItem('tks_sched_theme');
    var theme = s ? JSON.parse(s)
      : ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<style>
/* =========================================================================
   TURBO KEYSMITH — TRAINEE SCHEDULER
   Single-file app. Walks a new hire through booking a job, tells him exactly
   what to say, coaches small talk + upselling, and adds the job to your
   calendar with one tap. Shares the Bittings customer database.
   No backend, no logins, no cost. Works offline once loaded.
   ========================================================================= */

/* ---- LIGHT THEME (default) ---- */
:root{
  --gold:#E8A317;          /* brand accent (key gold) */
  --gold-soft:#FFF6E2;     /* tint for selected choices */
  --gold-line:#F0C462;
  --ink:#1C1C1E;           /* main text */
  --ink-soft:#5A5A60;      /* secondary text */
  --bg:#F4F3F0;            /* page background */
  --card:#FFFFFF;
  --input-bg:#FFFFFF;
  --line:#E3E1DC;
  --green:#1F8A4C;
  --green-soft:#E7F4EC;
  --red:#C0392B;
  --red-soft:#FDF1F0;
  --on-gold:#1C1C1E;       /* text that sits on a gold button (dark in both themes) */
  /* header */
  --header-bg:#1C1C1E; --header-fg:#FFFFFF; --toggle-bg:#2C2C2E; --toggle-fg:#9A9A9F;
  /* "say this" coaching card */
  --coach-bg:#FFF6E2; --coach-border:#F0C462; --coach-accent:#E8A317; --coach-tag:#9A6B00; --coach-text:#3A2D08;
  /* "tip" coaching card */
  --tip-bg:#EEF3FF; --tip-border:#C9D8FF; --tip-accent:#3B6FE0; --tip-tag:#2E55B5; --tip-text:#22335E;
  --header-h:64px;
  --maxw:540px;
  --radius:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
}
/* ---- DARK THEME ---- */
:root[data-theme="dark"]{
  --gold:#F2B43A;
  --gold-soft:#3A2E12;
  --gold-line:#5C4A1E;
  --ink:#F1F1F4;
  --ink-soft:#9A9AA2;
  --bg:#111113;
  --card:#1C1C20;
  --input-bg:#16161A;
  --line:#33333A;
  --green:#54C98A;
  --green-soft:#16291F;
  --red:#E26A5E;
  --red-soft:#2E1A18;
  --on-gold:#1C1C1E;
  --header-bg:#0E0E10; --header-fg:#FFFFFF; --toggle-bg:#28282C; --toggle-fg:#9A9AA2;
  --coach-bg:#2E2410; --coach-border:#5C4A1E; --coach-accent:#F2B43A; --coach-tag:#E0A93C; --coach-text:#F5E4C2;
  --tip-bg:#16203A; --tip-border:#2A3F6B; --tip-accent:#5B86E5; --tip-tag:#9DB8F0; --tip-text:#D3E0FA;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:17px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .2s ease,color .2s ease;
}
h1,h2,h3,.brand{font-family:"Sora",-apple-system,sans-serif;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;height:var(--header-h);
  background:var(--header-bg);color:var(--header-fg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;padding-top:env(safe-area-inset-top);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.hdr-right{display:flex;align-items:center;gap:10px;}
.lang-toggle{
  display:flex;background:var(--toggle-bg);border-radius:999px;padding:3px;font-size:13px;font-weight:600;
}
.lang-toggle button{
  border:0;background:transparent;color:var(--toggle-fg);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;
}
.lang-toggle button.active{background:var(--gold);color:var(--on-gold);}
.theme-btn{
  border:0;background:var(--toggle-bg);color:var(--header-fg);width:38px;height:38px;
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:18px 16px 120px;}
.screen{display:none;}
.screen.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- progress ---------- */
.progress{height:6px;background:var(--line);border-radius:999px;margin-bottom:18px;overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease;}

/* ---------- coaching card (the "say this" box) ---------- */
.coach{
  background:var(--coach-bg);border:1px solid var(--coach-border);
  border-left:5px solid var(--coach-accent);border-radius:14px;
  padding:14px 16px;margin:0 0 18px;position:relative;
}
.coach .tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--coach-tag);margin-bottom:6px;
}
.coach .line{font-size:18px;font-weight:600;color:var(--coach-text);line-height:1.4;}
.coach.tip{background:var(--tip-bg);border-color:var(--tip-border);border-left-color:var(--tip-accent);}
.coach.tip .tag{color:var(--tip-tag);}
.coach.tip .line{font-weight:500;color:var(--tip-text);}

/* ---------- step content ---------- */
.step-title{font-size:15px;font-weight:600;color:var(--ink-soft);margin:0 0 12px;}
label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
input,select,textarea{
  width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--input-bg);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
textarea{min-height:70px;resize:vertical;}
.field-err{border-color:var(--red)!important;background:var(--red-soft);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ---------- big choice buttons ---------- */
.choices{display:grid;gap:10px;}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;color:var(--ink);
  transition:.15s;
}
.choice:active{transform:scale(.99);}
.choice.sel{border-color:var(--gold);background:var(--gold-soft);}
.choice .emo{font-size:22px;width:28px;text-align:center;}

/* ---------- yes/no toggle for upsell ---------- */
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.yn button{
  padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink);
}
.yn button.yes.sel{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.yn button.no.sel{background:var(--red-soft);border-color:var(--red);color:var(--red);}

/* ---------- nav buttons ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;}
.btn{
  flex:1;padding:16px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:17px;
  cursor:pointer;font-family:"Sora",sans-serif;
}
.btn.primary{background:var(--gold);color:var(--on-gold);}
.btn.ghost{flex:0 0 auto;background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);min-width:84px;}
.btn:disabled{opacity:.45;}

/* ---------- summary + calendar ---------- */
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
.summary .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;}
.summary .r:last-child{border-bottom:0;}
.summary .r b{color:var(--ink-soft);font-weight:600;}
.cal{display:grid;gap:10px;margin-bottom:10px;}
.cal a,.cal button{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font:inherit;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;font-size:16px;
}
.opencal{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border-radius:12px;border:1.5px solid var(--gold);background:var(--gold-soft);
  color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:18px;
}

/* ---------- home + lists ---------- */
.hero{text-align:center;padding:18px 0 8px;}
.hero h1{font-size:26px;margin:0 0 4px;}
.hero p{color:var(--ink-soft);margin:0 0 22px;}
.tile{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px;width:100%;font:inherit;text-align:left;cursor:pointer;
  margin-bottom:12px;box-shadow:var(--shadow);color:var(--ink);
}
.tile .big{font-size:26px;}
.tile h3{margin:0;font-size:18px;}
.tile p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat .n{font-family:"Sora";font-size:24px;font-weight:700;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.backup-row{display:flex;gap:10px;margin-top:24px;}
.mini{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font:inherit;font-weight:600;font-size:14px;cursor:pointer;}
.bk-caption{font-size:12px;color:var(--ink-soft);text-align:center;margin:10px 4px 0;line-height:1.4;}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.job .top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);}
.job h3{margin:4px 0 2px;font-size:17px;}
.job .meta{font-size:14px;color:var(--ink-soft);}
.empty{text-align:center;color:var(--ink-soft);padding:40px 0;}
.section-h{font-family:"Sora";font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:24px 0 10px;}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--coach-tag);}
.cust-hit{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.cust-hit b{display:block;}
.cust-hit span{font-size:14px;color:var(--ink-soft);}
.done-check{font-size:54px;text-align:center;margin:18px 0 6px;}

/* ---- Day view (in-app calendar) ---- */
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.daybar .navd{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto;}
.daybar input[type=date]{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 12px;color:var(--ink);font-size:15px;font-family:inherit;}
.daysum{font-size:13px;color:var(--ink-soft);margin:0 2px 12px;}
.slot{display:flex;gap:12px;align-items:stretch;border-top:1px solid var(--line);padding:10px 2px;}
.slot .hr{flex:0 0 64px;font-weight:700;font-size:13px;color:var(--ink-soft);padding-top:4px;}
.slot .cell{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.slot.free .cell{justify-content:center;}
.book-card{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--gold,#f2b43a);
  border-radius:12px;padding:10px 12px;cursor:pointer;}
.book-card.urgent{border-left-color:var(--coach-tag,#c8323c);}
.book-card b{font-size:15px;}
.book-card .m{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.slot .addbtn{align-self:flex-start;background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.slot .addbtn:hover{color:var(--ink);}
.gcal-stub{margin-top:18px;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;
  padding:14px 16px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.gcal-stub b{color:var(--ink);}
.gcal-stub .tagph{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;background:var(--gold-soft);
  color:var(--coach-tag);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
.gcal-stub button{margin-top:10px;background:transparent;border:1.5px solid var(--line);color:var(--ink);
  border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;}

/* ---- Accessibility + mobile polish ---- */
:focus-visible{outline:3px solid var(--gold,#f2b43a);outline-offset:2px;border-radius:8px;}
.daybar .navd{min-width:44px;min-height:44px;}
.slot .addbtn{min-height:40px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>Turbo Scheduler</div>
  <div class="hdr-right">
    <div class="lang-toggle" id="langToggle">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="es">ES</button>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="nav" id="nav" style="display:none">
  <div class="nav-inner">
    <button class="btn ghost" id="backBtn">Back</button>
    <button class="btn primary" id="nextBtn">Next</button>
  </div>
</div>

<script>
/* =========================================================================
   1) STORAGE HELPERS  (same pattern as Bittings: readLS / writeLS)
   These read and write the browser's localStorage. Because this app is
   hosted on the same turbokeysmith.github.io domain as Bittings, it sees
   the SAME saved data — so customers added here show up in Bittings.
   ========================================================================= */
function readLS(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function writeLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.warn('save failed', e); }
}

/* Shared keys (must match Bittings). >>> VERIFY against app_template_v2.html <<< */
const K_CUSTOMERS = 'tks_customers';   // shared customer database (read + write)
const K_SHOPS     = 'tks_shops';       // Bittings stores BUSINESS customers here
const K_SETTINGS  = 'tks_settings';    // shared settings (read only here)
const K_BOOKINGS  = 'tks_bookings';    // NEW key created by this app for scheduled jobs
const K_LANG      = 'tks_sched_lang';  // remembers EN/ES choice for this app
const K_THEME     = 'tks_sched_theme'; // remembers light/dark choice for this app
const K_LASTLINE  = 'tks_sched_lastline'; // remembers last script variant per slot (rotation)

/* =========================================================================
   2) LANGUAGE  (English / Spanish)
   ========================================================================= */
let LANG = readLS(K_LANG, 'en');

const UI = {
  en:{
    home_sub:"Book a job, step by step.", new_booking:"New booking",
    new_booking_sub:"Walk through a call and add it to the calendar",
    todays:"Today's jobs", all_jobs:"All bookings", view_jobs:"View jobs",
    coaching_progress:"Your coaching so far",
    stat_jobs:"Booked", stat_offered:"Upsells offered", stat_rate:"Offer rate",
    back:"Back", next:"Next", save:"Save booking", done:"Done", start:"Caller's on — start",
    say_this:"Say this", tip:"Tip — what to do",
    existing_q:"Have we helped this customer before?", search_cust:"Search name or phone…",
    new_cust:"➕ New customer", no_match:"No match — add as new customer",
    name:"Customer name", phone:"Best callback number", email:"Email (optional)",
    jobtype:"What do they need help with?",
    auto:"Car / vehicle", res:"House / home", com:"Business / commercial",
    subtype:"What kind of job?",
    addr:"Service address", veh_y:"Year", veh_mk:"Make", veh_md:"Model", vin:"VIN (if they have it)",
    where_parked:"Where is the car parked?",
    sched:"When can we go out?", date:"Date", time:"Time", dur:"How long to block?",
    open_cal:"Open Google Calendar", check_sched:"Check my schedule",
    check_sched_sub:"Opens Google Calendar in a new tab",
    bk_export:"Back up", bk_import:"Restore", bk_caption:"Save a copy of your contacts so you never lose them. Keep the file in Google Drive.",
    bk_restored:"Restored:", bk_contacts:"new contacts", bk_bookings:"new bookings",
    bk_badfile:"That file couldn't be read. Make sure it's a Turbo Scheduler backup.",
    upsell_q:"Did you offer the add-on?", yes:"Yes, I offered", no:"Not this time",
    upsell_acc:"Did they say yes to it?", acc_yes:"They said yes", acc_no:"They passed",
    confirm:"Confirm the booking", add_cal:"Add to calendar",

/* =========================================================================
   3b) SCRIPT ROTATION ENGINE
   Picks a variant for each slot, avoiding the one used last time so lines
   don't repeat back-to-back. The choice is locked per booking (stable if he
   taps Back), and the "last used" is saved so the next call differs too.
   We store the INDEX (not the text), so toggling EN/ES keeps the same line.
   ========================================================================= */
let lastLineIdx = readLS(K_LASTLINE, {});   // { slot: lastIndexUsed }

function pickIdx(slot, len){
  if(booking.lineIdx && booking.lineIdx[slot]!=null) return booking.lineIdx[slot]; // stable within this call
  let i = Math.floor(Math.random()*len);
  if(len>1 && i===lastLineIdx[slot]) i=(i+1)%len;   // never repeat the previous one
  booking.lineIdx[slot]=i;
  lastLineIdx[slot]=i; writeLS(K_LASTLINE, lastLineIdx);
  return i;
}
/* returns the chosen line text for a slot, in the current language */
function line(slot, variants){
  const arr = variants[LANG] || variants.en;
  return arr[pickIdx(slot, arr.length)];
}
/* emergency jobs get reassurance instead of cheerful small talk */
function isUrgent(){
  return booking.subType==='lockout' || (booking.jobType==='auto' && booking.subType==='lost');
}

/* =========================================================================

   Reads the SAME local bookings (tks_bookings) the intake flow writes, shows

   booking pre-filled with that date + time. No Google account required.
   ========================================================================= */
const DAY_START = 7, DAY_END = 20;            // 7 AM … 8 PM rows
function todayISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
let DAY = todayISO();
function shiftDay(n){ DAY = addDaysISO(DAY,n); render(); }
function setDay(v){ if(v){ DAY=v; render(); } }
function startFlowAt(date,time){ startFlow(); booking.date=date; booking.time=time; }

function renderDay(){
  if(nav) nav.style.display='none';
  const all = readLS(K_BOOKINGS, []).filter(b=>(b.date||'')===DAY)
                .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let rows='';
  for(let h=DAY_START; h<=DAY_END; h++){
    const hh = String(h).padStart(2,'0');
    const inSlot = all.filter(b=>{ const t=(b.time||''); const bh=parseInt(t.slice(0,2),10); return bh===h; });
    const label = fmt12(hh+':00');
    let cell='';
    if(inSlot.length){
      cell = inSlot.map(b=>{
        const nm = (b.customer && b.customer.name) ? b.customer.name : (b.customer && b.customer.customer) || '—';
        const job = subLabel ? subLabel(b.jobType, b.subType) : (b.jobType||'');
        const urgent = (typeof isUrgent==='function' && isUrgent(b)) ? ' urgent' : '';
        return `<div class="book-card${urgent}" onclick="VIEW='jobs';render()">
          <b>${esc(fmt12(b.time))} · ${esc(nm)}</b>
          <div class="m">${esc(job||'')}${b.address?' · '+esc(b.address):''}</div></div>`;
      }).join('');
    }
    cell += `<button class="addbtn" onclick="startFlowAt('${DAY}','${hh}:00')">+ ${LANG==='es'?'Agendar':'Book'} ${esc(label)}</button>`;
    rows += `<div class="slot ${inSlot.length?'busy':'free'}"><div class="hr">${esc(label)}</div><div class="cell">${cell}</div></div>`;
  }
  const count = all.length;
  app.innerHTML = `
    <button class="btn ghost" style="margin-bottom:14px" onclick="VIEW='home';render()">← ${t('home')}</button>
    <div class="daybar">
      <button class="navd" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>

      <button class="navd" onclick="shiftDay(1)" aria-label="Next day">›</button>
    </div>
    <div class="daysum">${esc(prettyDate(DAY))} · ${count} ${count===1?(LANG==='es'?'trabajo':'job'):(LANG==='es'?'trabajos':'jobs')} ${LANG==='es'?'agendados':'booked'}</div>

        ? 'La sincronización en dos sentidos con Google Calendar aún no está conectada. Por ahora puedes abrir Google Calendar en otra pestaña. Conectar la cuenta real es una decisión pendiente.'
        : 'Two-way sync with Google Calendar isn’t wired up yet. For now you can open Google Calendar in a new tab. Connecting the real account is a pending decision (needs credentials).'}

  let html = `<div class="progress"><i style="width:${pct}%"></i></div>`;

  if(step==='greeting') html += stepGreeting();
  if(step==='customer') html += stepCustomer();
  if(step==='jobtype')  html += stepJobType();
  if(step==='subtype')  html += stepSubType();
  if(step==='details')  html += stepDetails();
  if(step==='schedule') html += stepSchedule();
  if(step==='upsell')   html += stepUpsell();
  if(step==='confirm')  html += stepConfirm();

  app.innerHTML = html;
  app.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input',()=>setPath(el.dataset.bind, el.value));
  });
  backBtn.textContent = t('back');
  nextBtn.textContent = (step==='confirm') ? t('save') : (step==='greeting' ? t('start') : t('next'));
  backBtn.onclick = goBack;
  nextBtn.onclick = goNext;
}

  return coachCard(line('ask_info', SCRIPT.ask_info)) +
    tipCard(TIPS.customer[LANG]) +
    `<label>${t('name')}</label><input data-bind="customer.name" id="f_name" value="${esc(booking.customer.name)}" placeholder="${t('name')}">
     <label>${t('phone')}</label><input data-bind="customer.phone" id="f_phone" type="tel" value="${esc(booking.customer.phone)}" placeholder="(405) 555-0199">
     <label>${t('email')}</label><input data-bind="customer.email" type="email" value="${esc(booking.customer.email)}" placeholder="${t('email')}">
     ${custs.length? `<label>${t('existing_q')}</label><input id="custSearch" placeholder="${t('search_cust')}" oninput="searchCust(this.value)"><div id="custHits"></div>`:''}`;
}

function stepJobType(){
  return tipCard(TIPS.jobtype[LANG]) +
    `<p class="step-title">${t('jobtype')}</p><div class="choices">
      ${jobChoice('auto','🚗',t('auto'))}
      ${jobChoice('res','🏠',t('res'))}
      ${jobChoice('com','🏢',t('com'))}
    </div>`;
}
function jobChoice(v,emo,label){
  const sel = booking.jobType===v?'sel':'';
  return `<button class="choice ${sel}" onclick="pickJobType('${v}')"><span class="emo">${emo}</span>${label}</button>`;
}

function stepSubType(){
  const tipKey = booking.jobType==='auto'?'auto':booking.jobType==='res'?'res':'com';
  const list = SUBTYPES[booking.jobType]||[];
  const items = list.map(([v,emo,en,es])=>{
    const sel = booking.subType===v?'sel':'';
    const label = LANG==='es'?es:en;
    return `<button class="choice ${sel}" onclick="pickSub('${v}')"><span class="emo">${emo}</span>${label}</button>`;
  }).join('');
  const empathy = (booking.subType==='lockout') ? coachCard(line('empathy', SCRIPT.empathy_lockout)) : '';
  return tipCard(TIPS[tipKey][LANG]) + empathy +
    `<p class="step-title">${t('subtype')}</p><div class="choices">${items}</div>`;
}

function stepDetails(){
  // Tone-matched: cheerful small talk for routine jobs, but keep-it-moving for emergencies.
  const msg = isUrgent() ? line('details', SCRIPT.details_urgent) : line('details', SCRIPT.smalltalk);
  let html = coachCard(msg);
  html += tipCard(TIPS.location[LANG]);
  if(booking.jobType==='auto'){
    html += `<div class="row2">
        <div><label>${t('veh_y')}</label><input data-bind="vehicle.year" inputmode="numeric" value="${esc(booking.vehicle.year)}"></div>
        <div><label>${t('veh_mk')}</label><input data-bind="vehicle.make" value="${esc(booking.vehicle.make)}"></div>
      </div>
      <label>${t('veh_md')}</label><input data-bind="vehicle.model" value="${esc(booking.vehicle.model)}">
      <label>${t('vin')}</label><input data-bind="vehicle.vin" value="${esc(booking.vehicle.vin)}" placeholder="17 chars">
      <label>${t('where_parked')}</label><input data-bind="parked" value="${esc(booking.parked)}">`;
  }
  html += `<label>${t('addr')}</label><input data-bind="address" id="f_addr" value="${esc(booking.address)}" placeholder="123 Main St, Oklahoma City">`;
  return html;
}

function stepSchedule(){
  return tipCard(TIPS.schedule[LANG]) +
    `<button class="opencal" onclick="openCalendar()">📅 ${t('open_cal')}</button>` +
    coachCard(line('reassure', SCRIPT.reassure)) +
    `<label>${t('date')}</label><input data-bind="date" id="f_date" type="date" value="${esc(booking.date)}">
     <div class="row2">
       <div><label>${t('time')}</label><input data-bind="time" id="f_time" type="time" value="${esc(booking.time)}"></div>
       <div><label>${t('dur')}</label>
         <select data-bind="duration">
           <option value="30" ${booking.duration==30?'selected':''}>30 min</option>
           <option value="60" ${booking.duration==60?'selected':''}>1 hr</option>
           <option value="90" ${booking.duration==90?'selected':''}>1.5 hr</option>
           <option value="120" ${booking.duration==120?'selected':''}>2 hr</option>
         </select></div>
     </div>`;
}

function stepUpsell(){
  const up = line('upsell', UPSELL[booking.jobType] || UPSELL.auto);
  const oY = booking.upsell.offered===true?'sel':'', oN = booking.upsell.offered===false?'sel':'';
  const accBlock = booking.upsell.offered===true ? `
    <p class="step-title" style="margin-top:18px">${t('upsell_acc')}</p>
    <div class="yn">
      <button class="yes ${booking.upsell.accepted===true?'sel':''}" onclick="setUpsell('accepted',true)">✓ ${t('acc_yes')}</button>
      <button class="no ${booking.upsell.accepted===false?'sel':''}" onclick="setUpsell('accepted',false)">✕ ${t('acc_no')}</button>
    </div>` : '';
  return coachCard(up) +
    `<p class="step-title">${t('upsell_q')}</p>
     <div class="yn">
       <button class="yes ${oY}" onclick="setUpsell('offered',true)">✓ ${t('yes')}</button>
       <button class="no ${oN}" onclick="setUpsell('offered',false)">✕ ${t('no')}</button>
     </div>${accBlock}`;
}

function stepConfirm(){
  const veh = booking.vehicle.make ? `${booking.vehicle.year} ${booking.vehicle.make} ${booking.vehicle.model}`.trim() : '';
  const when = booking.date ? `${prettyDate(booking.date)} · ${fmt12(booking.time)}` : '—';
  const rows = [
    [t('r_customer'), booking.customer.name],
    [t('r_phone'), booking.customer.phone],
    [t('r_job'), subLabel(booking.jobType, booking.subType)],
    veh?[t('r_vehicle'), veh]:null,
    [t('r_address'), booking.address || booking.parked || '—'],
    [t('r_when'), when],
    [t('r_upsell'), booking.upsell.offered ? (booking.upsell.accepted?t('yes_short')+' ✓':t('yes_short')) : t('no_short')]
  ].filter(Boolean).map(([k,v])=>`<div class="r"><b>${k}</b><span>${esc(v||'—')}</span></div>`).join('');

  return tipCard(LANG==='es'?'Repite los detalles al cliente antes de colgar.':'Read the details back to the customer before hanging up.') +
    `<p class="step-title">${t('confirm')}</p>
     <div class="summary">${rows}</div>
     <div class="section-h">${t('add_cal')}</div>
     <div class="cal">
       <a href="${googleUrl()}" target="_blank" rel="noopener">📆 ${t('g_cal')}</a>
       <a href="${outlookUrl()}" target="_blank" rel="noopener">📆 ${t('o_cal')}</a>
       <button onclick="downloadICS()">📆 ${t('ics')}</button>
     </div>
     <label>${t('notes')}</label><textarea data-bind="notes">${esc(booking.notes)}</textarea>`;
}

/* =========================================================================
   6) FLOW ACTIONS
   ========================================================================= */
function setPath(path,val){
  const parts = path.split('.'); let o = booking;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function pickJobType(v){ booking.jobType=v; booking.subType=''; render(); }
function pickSub(v){ booking.subType=v; render(); }
function setUpsell(field,val){
  booking.upsell[field]=val;
  if(field==='offered' && val===false) booking.upsell.accepted=null;
  render();
}

function searchCust(q){
  const hits = document.getElementById('custHits'); if(!hits) return;
  q=(q||'').toLowerCase().trim();
  if(!q){ hits.innerHTML=''; return; }
  // search BOTH individual customers and business shops (Bittings keeps them apart)
  const all = readLS(K_CUSTOMERS, []).concat(readLS(K_SHOPS, []));
  const found = all.filter(c=>{
    const n=(c.customer||'').toLowerCase();   // Bittings stores the name under "customer"
    const p=(c.phone||'').toLowerCase();
    return n.includes(q)||p.includes(q);
  }).slice(0,5);
  hits.innerHTML = found.length
    ? found.map(c=>`<div class="cust-hit" onclick='useCust(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
        <b>${esc(c.customer||'')}</b><span>${esc(c.phone||'')}</span></div>`).join('')
    : `<div class="cust-hit" style="cursor:default"><span>${t('no_match')}</span></div>`;
}
function useCust(c){
  booking.customer.name  = c.customer || '';   // "customer" holds the name in Bittings
  booking.customer.phone = c.phone || '';
  booking.customer.email = c.email || '';
  if(c.address) booking.address = c.address;
  render();
}

function goBack(){
  if(stepIndex===0){ VIEW='home'; render(); return; }
  stepIndex--; render();
}
function goNext(){
  const step = STEPS[stepIndex];
  if(!validateStep(step)) return;
  if(step==='confirm'){ saveBooking(); return; }
  stepIndex++; render();
}

/* required-field validation with red highlight (matches Bittings behavior) */
function validateStep(step){
  let ok=true;
  function bad(id){ const el=document.getElementById(id); if(el){el.classList.add('field-err'); ok=false;} }
  if(step==='customer'){
    if(!booking.customer.name.trim()) bad('f_name');
    if(!booking.customer.phone.trim()) bad('f_phone');
  }
  if(step==='jobtype' && !booking.jobType) ok=false;
  if(step==='subtype' && !booking.subType) ok=false;
  if(step==='details'){
    if(!booking.address.trim() && !booking.parked.trim()) bad('f_addr');
  }
  if(step==='schedule'){
    if(!booking.date) bad('f_date');
    if(!booking.time) bad('f_time');
  }
  if(!ok){
    document.querySelectorAll('.field-err').forEach(el=>el.addEventListener('input',()=>el.classList.remove('field-err'),{once:true}));
  }
  return ok;
}

function saveBooking(){
  const bookings = readLS(K_BOOKINGS, []);
  booking.id = 'bk_'+Date.now();
  booking.createdAt = new Date().toISOString();
  bookings.push(JSON.parse(JSON.stringify(booking)));
  writeLS(K_BOOKINGS, bookings);
  saveCustomerToSharedDB();
  VIEW='done'; render();
}

/* -------------------------------------------------------------------------
   SAVE CUSTOMER TO SHARED DATABASE  — matches Bittings exactly.
   Verified against bittings.html: a customer record is
     { customer, contact, phone, email, address, customerType, lastUsed }
   where the NAME is stored under "customer". Bittings finds an existing
   record by NAME (case-insensitive) and updates it; otherwise adds a new one
   and stamps lastUsed (the picker sorts by lastUsed). We mirror that so the
   scheduler and Bittings agree on what counts as the same customer.
   Business (commercial) jobs are tagged customerType "business"; everything
   else "individual".
   ------------------------------------------------------------------------- */
function saveCustomerToSharedDB(){
  const name = (booking.customer.name||'').trim();
  if(!name) return;
  const list = getCustomers();
  const custData = {
    customer: name,
    contact: '',
    phone: (booking.customer.phone||'').trim(),
    email: (booking.customer.email||'').trim(),
    address: (booking.address||'').trim(),
    customerType: (booking.jobType==='com') ? 'business' : 'individual'
  };
  const existing = list.find(c => (c.customer||'').toLowerCase() === name.toLowerCase());
  if(existing){ Object.assign(existing, custData); existing.lastUsed = Date.now(); }
  else{ list.push(Object.assign({}, custData, {lastUsed: Date.now()})); }
  saveCustomers(list);
}
/* tiny Bittings-compatible helpers (same keys/behaviour as bittings.html) */
function getCustomers(){ return readLS(K_CUSTOMERS, []); }
function saveCustomers(arr){ writeLS(K_CUSTOMERS, arr); }

/* =========================================================================
   7) CALENDAR LINKS  (one-tap add — free, no login)
   ========================================================================= */
function eventTimes(){
  const [y,m,d] = booking.date.split('-').map(Number);
  const [hh,mm] = (booking.time||'09:00').split(':').map(Number);
  const start = new Date(y, m-1, d, hh, mm);
  const end   = new Date(start.getTime() + (booking.duration*60000));
  return {start,end};
}
function eventTitle(){
  const sub = subLabel(booking.jobType, booking.subType);
  return `${sub} — ${booking.customer.name||'Customer'}`;
}
function eventDetails(){
  const veh = booking.vehicle.make ? `\nVehicle: ${booking.vehicle.year} ${booking.vehicle.make} ${booking.vehicle.model} ${booking.vehicle.vin}` : '';
  return `Customer: ${booking.customer.name}\nPhone: ${booking.customer.phone}${veh}\n${booking.notes||''}`.trim();
}
function eventLocation(){ return booking.address || booking.parked || ''; }

/* Open Google Calendar so he can see what's already booked before picking a time.
   If a date is already chosen, jump straight to that day's view. */
function calendarViewUrl(){
  const base='https://calendar.google.com/calendar/r';
  if(booking.date){
    const [y,m,d]=booking.date.split('-').map(Number);
    return `${base}/day/${y}/${m}/${d}`;
  }
  return base;
}
function openCalendar(){ window.open(calendarViewUrl(), '_blank', 'noopener'); }

/* =========================================================================
   7b) BACKUP & RESTORE  (free, no cloud)
   Export saves all contacts + bookings to a file. Import MERGES a file back
   in — it only ADDS what's missing (matched by phone / booking id) and never
   deletes what's already there, so it's safe to run anytime.
   ========================================================================= */
function exportData(){
  const data = {
    _app:'turbo-scheduler', _version:1, _exported:new Date().toISOString(),
    customers: readLS(K_CUSTOMERS, []),
    shops:     readLS(K_SHOPS, []),
    bookings:  readLS(K_BOOKINGS, [])
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='turbo-scheduler-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
/* merge a list of {customer,...} records by name (case-insensitive), Bittings-style */
function mergeByName(key, incoming){
  const list = readLS(key, []);
  const have = new Set(list.map(c=>(c.customer||'').toLowerCase()).filter(Boolean));
  let added=0;
  (incoming||[]).forEach(c=>{
    const n=(c.customer||'').toLowerCase();
    if(n && have.has(n)) return;
    list.push(c); if(n) have.add(n); added++;
  });
  writeLS(key, list); return added;
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      let addedC = mergeByName(K_CUSTOMERS, data.customers);
      addedC    += mergeByName(K_SHOPS, data.shops);
      // merge bookings by id
      const bks=readLS(K_BOOKINGS,[]);
      const haveB=new Set(bks.map(b=>b.id).filter(Boolean));
      let addedB=0;
      (data.bookings||[]).forEach(b=>{
        if(b.id && haveB.has(b.id)) return;
        bks.push(b); if(b.id) haveB.add(b.id); addedB++;
      });
      writeLS(K_BOOKINGS, bks);
      alert(`${t('bk_restored')} ${addedC} ${t('bk_contacts')}, ${addedB} ${t('bk_bookings')}.`);
      render();
    }catch(e){ alert(t('bk_badfile')); }
  };
  r.readAsText(file);
}

function pad(n){return String(n).padStart(2,'0');}
function fmtCompact(dt){ return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`; }
function fmtOutlook(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}:00`; }
function googleUrl(){
  if(!booking.date||!booking.time) return '#';
  const {start,end}=eventTimes();
  const p = new URLSearchParams({
    action:'TEMPLATE', text:eventTitle(),
    dates:`${fmtCompact(start)}/${fmtCompact(end)}`,
    details:eventDetails(), location:eventLocation(),
    ctz:'America/Chicago'
  });
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function outlookUrl(){
  if(!booking.date||!booking.time) return '#';
  const {start,end}=eventTimes();
  const p = new URLSearchParams({
    path:'/calendar/action/compose', rru:'addevent',
    subject:eventTitle(), startdt:fmtOutlook(start), enddt:fmtOutlook(end),
    body:eventDetails(), location:eventLocation()
  });
  return 'https://outlook.live.com/calendar/0/deeplink/compose?'+p.toString();
}
function downloadICS(){
  if(!booking.date||!booking.time){ alert(t('err')); return; }
  const {start,end}=eventTimes();
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Turbo Keysmith//Scheduler//EN','BEGIN:VEVENT',
    'UID:'+(booking.id||Date.now())+'@turbokeysmith',
    'DTSTAMP:'+fmtCompact(new Date()),
    'DTSTART:'+fmtCompact(start),
    'DTEND:'+fmtCompact(end),
    'SUMMARY:'+icsEsc(eventTitle()),
    'DESCRIPTION:'+icsEsc(eventDetails()),
    'LOCATION:'+icsEsc(eventLocation()),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics],{type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'turbokeysmith-booking.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}

/* =========================================================================
   8) SMALL HELPERS
   ========================================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function subLabel(type,sub){
  const list = SUBTYPES[type]||[]; const row = list.find(r=>r[0]===sub);
  if(!row) return type||'';
  return LANG==='es'?row[3]:row[2];
}
function fmt12(t24){
  if(!t24) return '';
  let [h,m]=t24.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12;
  return `${h}:${pad(m)} ${ap}`;
}
function prettyDate(iso){
  if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString(LANG==='es'?'es-US':'en-US',{weekday:'short',month:'short',day:'numeric'});
}

/* =========================================================================
   9) BOOT
   ========================================================================= */
document.getElementById('langToggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  LANG=b.dataset.lang; writeLS(K_LANG, LANG); render();
});

/* ---- dark mode ----
   The theme is already set on <html> by the small script in the <head>
   (so there's no white flash). Here we just sync the button icon and
   handle taps. Sun = currently dark (tap to go light); moon = the reverse. */
function syncThemeIcon(){
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  writeLS(K_THEME, next);
  syncThemeIcon();
});
syncThemeIcon();

render();
</script>
