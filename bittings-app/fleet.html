<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Fleet — Bittings</title>
<link rel="icon" href="tks_mark.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app/cloud-config.js"></script>
<script>try{if(localStorage.getItem('bt_theme')==='dark')document.documentElement.setAttribute('data-bt-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="app/ui/legacy-dark.css">
<style>
  :root{--bg:#f6f7f9;--bg2:#eef0f3;--card:#ffffff;--edge:#e3e6ea;--ink:#14171b;--dim:#5a616c;
    --red:#c8323c;--red-deep:#8f1f27;--amber:#f2b43a;--green:#22994a;--blue:#4aa3ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 520px at 50% -10%,#ffffff 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;color:var(--ink);min-height:100vh;min-height:100dvh;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));}
  .wrap{max-width:640px;margin:0 auto;}
  header.app{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  header.app img{height:32px;width:auto;max-width:120px;object-fit:contain;}
  header.app h1{margin:0;font-size:18px;font-weight:800;}
  header.app .sp{margin-left:auto;}
  .ghost{background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--dim);border-radius:10px;
    padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;}
  .intro{color:var(--dim);font-size:12px;line-height:1.45;margin:0 0 10px;}
  .panel{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
  .panel h2{margin:0 0 3px;font-size:16px;font-weight:800;}
  .panel .sub{color:var(--dim);font-size:12px;line-height:1.4;margin:0 0 10px;}
  label{display:block;font-size:12px;color:var(--dim);font-weight:600;margin:8px 0 4px;}
  input,select{width:100%;background:#f3f4f6;border:1px solid var(--edge);border-radius:10px;
    padding:9px 11px;color:var(--ink);font-size:16px;outline:none;font-family:inherit;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .van{border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
  .van .vmain{flex:1;min-width:0;}
  .van .vtitle{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .van .vmeta{color:var(--dim);font-size:12px;margin-top:2px;overflow-wrap:anywhere;}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase;}
  .badge.active{background:rgba(34,153,74,.14);color:#1c7d3e;}
  .badge.maintenance{background:rgba(242,180,58,.16);color:#9a6b08;}
  .badge.down{background:rgba(200,50,60,.14);color:#a3252e;}
  .badge.retired{background:rgba(90,97,108,.14);color:#5a616c;}
  .van .vact{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;align-items:stretch;}
  .van .vact select{font-size:12px;padding:6px 8px;min-width:122px;}
  .mini{background:#e7e9ee;border:none;color:#3a4250;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .del{background:transparent;border:1px solid rgba(200,50,60,.5);color:#a3252e;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .addbtn{background:#e7e9ee;border:none;color:#3a4250;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;min-height:44px;margin-top:8px;width:100%;}
  .btn{border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;min-height:46px;width:100%;}
  .btn.save{background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;}
  .crew-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--edge);}
  .crew-row:first-child{border-top:none;}
  .crew-row .cname{flex:1;min-width:0;}
  .crew-row .cname b{display:block;font-size:14px;}
  .crew-row .crole{font-size:11.5px;color:var(--dim);text-transform:capitalize;}
  .crew-row select{flex:0 0 160px;font-size:13px;padding:7px 9px;}
  .msg{font-size:12.5px;min-height:16px;margin-top:6px;}
  .msg.ok{color:#1c7d3e;} .msg.err{color:#a3252e;}
  .block{max-width:460px;margin:60px auto;text-align:center;color:var(--dim);}
  .block h2{color:var(--ink);}
  .empty{color:var(--dim);font-size:13px;padding:6px 2px;}
  html[data-bt-theme="dark"] input,html[data-bt-theme="dark"] select{background:#2c313a;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="block">Loading…</div></div>

<script src="app/store.js"></script>
<script src="app/access.js"></script>
<script>
/* ===================== FLEET / VANS — manager admin =====================
   Manage company vans and assign each crew member a home van. Mirrors the
   server rules (verified against pg_policies):
     • view vans / crew ............ any signed-in staff
     • add / edit a van ............ manager+   (vans_insert/update = is_manager)
     • delete a van ................ OWNER only (vans_delete = is_owner)  → data-cap=hardDelete
     • assign a home van to staff .. OWNER only (staff_update = is_owner) → data-cap=manageStaff
   The page itself is gated to manager+ (can('setup')); a manager sees + edits
   vans but the owner-only controls are hidden, exactly as the DB enforces. */
const wrap = document.getElementById('wrap');
const VAN_STATUS = [['active','Active'],['maintenance','Maintenance'],['down','Down'],['retired','Retired']];
let VANS = [];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function canManage(){ try{ return TKS.auth.isSignedIn() && TKS.auth.can && TKS.auth.can('setup'); }catch(e){ return false; } }

/* ---- boot: connect cloud, gate to manager+, render ---- */
(function boot(){
  function go(){
    if(!canManage()){
      wrap.innerHTML = '<div class="block"><h2>Managers only</h2><p>Fleet management is for managers &amp; the owner. '+
        'Ask a manager to add or change vans.</p><p><a class="ghost" href="index.html">‹ Back to the app</a></p></div>';
      return;
    }
    render();
  }
  const c = window.TKS_CLOUD;
  if(c && c.AUTO_CONNECT!==false && window.supabase && window.supabase.createClient){
    try{
      const probe = window.supabase.createClient(c.url, c.anonKey);
      probe.auth.getSession().then(({data})=>{
        if(data && data.session){ TKS.connectCloud({url:c.url, anonKey:c.anonKey}).then(go).catch(go); }
        else go();
      }).catch(go);
      return;
    }catch(e){}
  }
  go();
})();

function render(){
  const idy=(function(){ try{ return TKS.Config.identity()||{}; }catch(e){ return {}; } })();
  const logo=idy.logo||'tks_logo.png', bn=(idy.name||'').trim();
  wrap.innerHTML =
    '<header class="app"><img src="'+esc(logo)+'" alt="'+esc(bn||'logo')+'"><h1>Fleet</h1>'+
      '<div class="sp"></div><a class="ghost" href="index.html">‹ Back</a></header>'+
    '<p class="intro">Your company vans. Stock lives <b>with the van</b>, not with whoever drives it — so when crew swap trucks the inventory stays put. '+
      'Add or edit vans below; assign each person a <b>home van</b> at the bottom.</p>'+
    '<div class="panel"><h2>Vans</h2><div class="sub">Each van is identified by its fleet # and/or VIN.</div>'+
      '<div id="vanList"><div class="empty">Loading vans…</div></div>'+
      '<button type="button" class="addbtn" id="addVanBtn">+ Add a van</button>'+
      '<div class="msg" id="vanMsg"></div></div>'+
    '<div class="panel" data-cap="manageStaff"><h2>Crew &amp; home vans</h2>'+
      '<div class="sub">Set each person’s home van. (Owner only — this decides where a tech’s stock counts.)</div>'+
      '<div id="crewList"><div class="empty">Loading crew…</div></div>'+
      '<div class="msg" id="crewMsg"></div></div>';
  document.getElementById('addVanBtn').onclick = ()=> openVanForm(null);
  loadVans();
  if(TKS.auth.can && TKS.auth.can('manageStaff')) loadCrew();
}

function statusBadge(s){ const lbl=(VAN_STATUS.find(x=>x[0]===s)||[s,s])[1]; return '<span class="badge '+esc(s||'active')+'">'+esc(lbl)+'</span>'; }

function loadVans(){
  const el=document.getElementById('vanList');
  TKS.Fleet.list().then(res=>{
    if(res.error){ el.innerHTML='<div class="empty">Couldn’t load vans: '+esc(res.error.message)+'</div>'; return; }
    VANS = res.data||[];
    if(!VANS.length){ el.innerHTML='<div class="empty">No vans yet — add your first one below.</div>'; return; }
    el.innerHTML = VANS.map(v=>{
      const name = v.nickname || ('Van '+(v.fleet_no||'')) || 'Van';
      const meta = [v.fleet_no?('Fleet #'+v.fleet_no):'', v.vin?('VIN '+v.vin):'', v.plate?('Plate '+v.plate):''].filter(Boolean).join(' · ');
      const opts = VAN_STATUS.map(s=>'<option value="'+s[0]+'"'+(v.status===s[0]?' selected':'')+'>'+s[1]+'</option>').join('');
      return '<div class="van"><div class="vmain"><div class="vtitle">'+esc(name)+' '+statusBadge(v.status)+'</div>'+
        '<div class="vmeta">'+(meta||'No identifiers set')+'</div></div>'+
        '<div class="vact">'+
          '<select data-id="'+esc(v.id)+'" class="vstatus" title="Van status">'+opts+'</select>'+
          '<button type="button" class="mini" data-edit="'+esc(v.id)+'">Edit</button>'+
          '<button type="button" class="del" data-cap="hardDelete" data-del="'+esc(v.id)+'">Delete</button>'+
        '</div></div>';
    }).join('');
    el.querySelectorAll('.vstatus').forEach(s=> s.onchange=()=> setStatus(s.dataset.id, s.value));
    el.querySelectorAll('[data-edit]').forEach(b=> b.onclick=()=> openVanForm(VANS.find(v=>v.id===b.dataset.edit)));
    el.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=> delVan(VANS.find(v=>v.id===b.dataset.del)));
    if(window.TKS_ACCESS) TKS_ACCESS.applyGates(el);
  }).catch(e=>{ el.innerHTML='<div class="empty">'+esc(e.message||'Connect to the cloud to manage vans.')+'</div>'; });
}

function vanMsg(t,ok){ const m=document.getElementById('vanMsg'); if(m){ m.className='msg '+(ok?'ok':'err'); m.textContent=t; if(ok) setTimeout(()=>{ if(m){m.textContent='';} },2200); } }

function setStatus(id,status){
  TKS.Fleet.setStatus(id,status).then(res=>{
    if(res.error){ vanMsg('Couldn’t update status: '+res.error.message,false); loadVans(); }
    else vanMsg('Status updated.',true);
  }).catch(e=> vanMsg(e.message||'Update failed.',false));
}

function delVan(v){
  if(!v) return;
  TKS_ACCESS.confirmDanger({
    title:'Delete this van?',
    message:'Delete “'+(v.nickname||('Van '+(v.fleet_no||'')))+'”? Any stock recorded on this van must be moved first. This can’t be undone.',
    confirmLabel:'Delete van'
  }).then(ok=>{ if(!ok) return;
    TKS.Fleet.remove(v.id).then(res=>{
      if(res.error){ vanMsg('Couldn’t delete: '+res.error.message,false); }
      else { vanMsg('Van deleted.',true); loadVans(); }
    }).catch(e=> vanMsg(e.message||'Delete failed.',false));
  });
}

/* Inline add/edit form rendered into a lightweight modal-ish panel. */
function openVanForm(v){
  v = v || {};
  const isEdit = !!v.id;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9000;background:rgba(6,8,11,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML='<div style="background:var(--card);width:100%;max-width:560px;border-radius:16px;padding:16px;max-height:88vh;overflow:auto;">'+
    '<h2 style="margin:0 0 10px;font-size:17px;">'+(isEdit?'Edit van':'Add a van')+'</h2>'+
    '<div class="row2"><div><label>Fleet #</label><input id="vf_fleet" value="'+esc(v.fleet_no||'')+'" placeholder="e.g. 12"></div>'+
      '<div><label>Nickname</label><input id="vf_nick" value="'+esc(v.nickname||'')+'" placeholder="e.g. Big White"></div></div>'+
    '<label>VIN</label><input id="vf_vin" value="'+esc(v.vin||'')+'" placeholder="17-char VIN" maxlength="17" style="text-transform:uppercase">'+
    '<div class="row2"><div><label>Plate</label><input id="vf_plate" value="'+esc(v.plate||'')+'" placeholder="Plate #"></div>'+
      '<div><label>Status</label><select id="vf_status">'+VAN_STATUS.map(s=>'<option value="'+s[0]+'"'+((v.status||'active')===s[0]?' selected':'')+'>'+s[1]+'</option>').join('')+'</select></div></div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim);margin:8px 0 0">Give it a fleet # or a VIN (at least one). The nickname is what shows on the inventory move buttons.</div>'+
    '<div class="msg" id="vf_msg"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button type="button" class="ghost" id="vf_cancel" style="flex:1;justify-content:center">Cancel</button>'+
      '<button type="button" class="btn save" id="vf_save" style="flex:2">'+(isEdit?'Save changes':'Add van')+'</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) close(); });
  document.getElementById('vf_cancel').onclick=close;
  document.getElementById('vf_save').onclick=function(){
    const get=id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
    const row={ id:v.id, fleet_no:get('vf_fleet'), vin:get('vf_vin'), nickname:get('vf_nick'), plate:get('vf_plate'), status:document.getElementById('vf_status').value };
    const m=document.getElementById('vf_msg');
    if(!row.fleet_no && !row.vin){ m.className='msg err'; m.textContent='Enter a fleet # or a VIN.'; return; }
    if(row.vin && row.vin.length!==17){ m.className='msg err'; m.textContent='A VIN is 17 characters (or leave it blank).'; return; }
    m.className='msg'; m.textContent='Saving…';
    TKS.Fleet.save(row).then(res=>{
      if(res.error){ m.className='msg err'; m.textContent=res.error.message; }
      else { close(); vanMsg(isEdit?'Van updated.':'Van added.',true); loadVans(); }
    }).catch(e=>{ m.className='msg err'; m.textContent=e.message||'Save failed.'; });
  };
}

/* ---- crew / home-van assignment (owner only) ---- */
function loadCrew(){
  const el=document.getElementById('crewList'); if(!el) return;
  Promise.all([TKS.Fleet.staff(), TKS.Fleet.list()]).then(([s,v])=>{
    if(s.error){ el.innerHTML='<div class="empty">Couldn’t load crew: '+esc(s.error.message)+'</div>'; return; }
    const vans=(v&&v.data)||[];
    const staff=(s.data||[]).filter(x=>x.active!==false);
    if(!staff.length){ el.innerHTML='<div class="empty">No crew yet.</div>'; return; }
    const vanOpts=v=>'<option value="">— none —</option>'+vans.map(x=>{
      const nm=x.nickname||('Van '+(x.fleet_no||''))||'Van';
      return '<option value="'+esc(x.id)+'"'+(v===x.id?' selected':'')+'>'+esc(nm)+'</option>';
    }).join('');
    el.innerHTML = staff.map(p=>'<div class="crew-row"><div class="cname"><b>'+esc(p.name||p.user_id.slice(0,8))+'</b>'+
      '<span class="crole">'+esc(p.role||'')+'</span></div>'+
      '<select data-u="'+esc(p.user_id)+'">'+vanOpts(p.home_van_id)+'</select></div>').join('');
    el.querySelectorAll('select[data-u]').forEach(sel=> sel.onchange=()=> assignHome(sel.dataset.u, sel.value));
  }).catch(e=>{ el.innerHTML='<div class="empty">'+esc(e.message||'Couldn’t load crew.')+'</div>'; });
}
function crewMsg(t,ok){ const m=document.getElementById('crewMsg'); if(m){ m.className='msg '+(ok?'ok':'err'); m.textContent=t; if(ok) setTimeout(()=>{ if(m){m.textContent='';} },2200); } }
function assignHome(userId,vanId){
  TKS.Fleet.assignHomeVan(userId, vanId||null).then(res=>{
    if(res.error){ crewMsg('Couldn’t assign: '+res.error.message,false); }
    else crewMsg('Home van updated.',true);
  }).catch(e=> crewMsg(e.message||'Update failed.',false));
}
</script>
<script src="app/ui/appnav.js"></script>
</body>
</html>
